# Lucairn self-hosted inference overlay.
#
# Use with the base customer compose:
#   docker compose \
#     -f install/docker-compose.customer.yml \
#     -f install/docker-compose.self-hosted.yml \
#     --env-file install/customer.env \
#     --profile "$MODEL_RUNTIME_PROFILE" \
#     up -d
#
# This overlay replaces the remote Sandbox B dependency with a local Sandbox B
# plus a selectable model runtime. Runtimes should expose an OpenAI-compatible
# HTTP API at MODEL_RUNTIME_URL unless using the ollama profile.

# OBS-08: bound container log growth (disk-fill DoS surface). Mirrors the
# base customer compose anchor. Services defined only in this overlay
# (sandbox-b, redis-ai, ollama, the model-runtime profiles, lucairn-dashboard)
# reference it directly; the gateway/audit/id-bridge/veil-witness overlay
# stubs inherit `logging:` from docker-compose.customer.yml at merge time.
# (Compose anchors do not cross files, so the anchor is redefined here.)
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LUCAIRN_LOG_MAX_SIZE:-50m}"
    max-file: "${LUCAIRN_LOG_MAX_FILE:-5}"

networks:
  dsa-ai:
    driver: bridge
    internal: true
  dsa-bridge-ai:
    driver: bridge
    internal: true
  dsa-audit-ai:
    driver: bridge
    internal: true
  dsa-witness-ai:
    driver: bridge
    internal: true
  dsa-model-runtime:
    driver: bridge
    internal: true
  # Identity-plane L3 model network. SPLIT-KNOWLEDGE INVARIANT: the sanitizer's
  # level-3 deep PII shield must scan RAW identity data, so its model instance
  # (ollama-identity, below) lives on its OWN isolated bridge — never the same
  # net as sandbox-b / the AI-plane inference ollama. This mirrors the Helm
  # chart, which runs a dedicated `ollama-identity` StatefulSet in the identity
  # plane (charts/lucairn/charts/sandbox-a/templates/ollama-identity-*.yaml),
  # separate from sandbox-b's bundled inference ollama
  # (charts/lucairn/charts/sandbox-b/templates/ollama-statefulset.yaml).
  # internal: true — identity-plane isolation, no egress; the L3 model must be
  # pre-staged (see ollama-identity below + INSTALL.md self-hosted section).
  dsa-model-runtime-identity:
    driver: bridge
    internal: true

volumes:
  redis-ai-data:
  ollama-model-store:
  # Dedicated model store for the identity-plane L3 PII-shield ollama. Kept
  # separate from ollama-model-store (the AI-plane inference ollama) so the
  # two model instances never share state — split-knowledge isolation.
  ollama-identity-model-store:
  # HF weight cache for the identity-plane FAST L3 runtime (model-runtime-vllm-l3).
  # vLLM reads pre-staged weights from here in HF_HUB_OFFLINE mode. Like
  # ollama-identity-model-store, it MUST be pre-populated ONCE via a throwaway
  # egress-enabled step BEFORE the isolated vllm-l3 profile runs — the identity
  # net is internal:true (no container egress), so vLLM cannot pull from HF at
  # boot. See docs/L3_VLLM_RUNTIME.md § "Pre-staging the model".
  vllm-l3-model-store:
    # EXPLICIT name (NOT project-prefixed). The one-time pre-stage ceremony in
    # docs/L3_VLLM_RUNTIME.md runs a throwaway `docker run -v vllm-l3-model-store …`
    # to populate this volume with egress; pinning the name makes that command
    # target the SAME volume vLLM mounts here (a project-prefixed name would leave
    # the operator staging weights into a different volume → HF_HUB_OFFLINE boot fail).
    name: vllm-l3-model-store

services:
  gateway:
    depends_on:
      sandbox-b:
        condition: service_healthy
    environment:
      INFERENCE_SERVICE_ADDR: "sandbox-b:50054"
      SANDBOX_B_PROXY_URL: "http://sandbox-b:8084"
      SANDBOX_B_INVARIANT_URL: "http://sandbox-b:8084/invariant"
      SANDBOX_B_REMOTE_ENDPOINT: ""
      SANDBOX_B_API_KEY: "${LOCAL_SANDBOX_B_API_KEY:-local-sandbox-b-key}"
      # TMS Slice 4 — per-deployment trust-zone tuning (self-hosted Enterprise only).
      # This overlay merges INTO docker-compose.customer.yml's gateway service,
      # which already sets GATEWAY_TMS_TRUST_ZONES — restating it here keeps the
      # passthrough explicit on the self-hosted path (Compose per-key merge means
      # this value is identical to the base). Requires gateway image >= 0.5.1.
      # See INSTALL.md § "Phase 8".
      GATEWAY_TMS_TRUST_ZONES: "${GATEWAY_TMS_TRUST_ZONES:-}"
      # T-14 tool-schema PII guard (T-487, T-493) — same passthrough rationale
      # as GATEWAY_TMS_TRUST_ZONES immediately above. Base already sets this;
      # restated here for explicitness on the self-hosted path.
      GATEWAY_TOOL_SCHEMA_GUARD: "${GATEWAY_TOOL_SCHEMA_GUARD:-refuse}"
    networks:
      - dsa-ai

  audit:
    networks:
      - dsa-audit-ai

  id-bridge:
    networks:
      - dsa-bridge-ai

  veil-witness:
    environment:
      # Stage 3 dual-name: canonical LCR_X first, legacy VEIL_X fallback.
      # This override merges INTO docker-compose.customer.yml's veil-witness
      # service. Compose's environment-merge is per-key: a key set on the
      # overlay REPLACES the base value entirely (it doesn't recursively
      # merge fallbacks). Without the legacy slot below, a pre-Stage-3
      # customer.env that only has VEIL_SANDBOX_B_PUBLIC_KEY set would
      # land an empty string here, breaking the witness's sandbox-B
      # claim verification path on self-hosted installs.
      LCR_SANDBOX_B_PUBLIC_KEY: "${LCR_SANDBOX_B_PUBLIC_KEY:-${VEIL_SANDBOX_B_PUBLIC_KEY}}"
    networks:
      - dsa-witness-ai

  # L3 reachability for self-hosted installs. The sanitizer's level-3 deep PII
  # shield dials hostname "ollama" (config/default-sanitizer.yaml:91
  # `ollama_url: http://ollama:11434`, fail-CLOSED), but the base customer
  # compose only attaches the sanitizer to its identity nets (dsa-identity +
  # dsa-witness-identity). Append the identity-only L3 net here so the
  # sanitizer can reach the in-cluster L3 model — WITHOUT going through the
  # AI-plane net that sandbox-b uses. On dsa-model-runtime-identity the
  # hostname "ollama" resolves to the ollama-identity service (via its network
  # alias), NOT to the AI-plane inference ollama. The sanitizer is deliberately
  # NOT placed on dsa-model-runtime: that is the whole point — no shared net
  # with sandbox-b, preserving the split-knowledge invariant (the identity
  # plane that sees raw PII is air-gapped from the AI plane). Compose UNIONs
  # networks across overlays, so the sanitizer keeps dsa-identity +
  # dsa-witness-identity (from docker-compose.customer.yml) and gains ONLY
  # dsa-model-runtime-identity here. No sanitizer config change is needed.
  sanitizer:
    environment:
      # L3 AVAILABILITY POSTURE (T-393). Replaces the retired
      # LUCAIRN_L3_REQUIRED: "${LUCAIRN_L3_REQUIRED:-true}" this line carried.
      #
      # ⚠️ THE OVERLAY'S FAIL-CLOSED DEFAULT IS DELIBERATELY GONE, AND THAT IS A
      # POSTURE CHANGE — read this before "restoring" it.
      #
      # The obvious migration was `"${LUCAIRN_L3_AVAILABILITY_POSTURE:-reject}"`,
      # preserving the retired `:-true`. It was drafted, and it is an OUTAGE on
      # the modal install. Since 2026-06 BOTH `bin/lucairn-init` AND
      # `customer.env.example` wrote `LUCAIRN_L3_REQUIRED=false` "for ALL install
      # paths" — so essentially every existing self-hosted `customer.env` carries
      # that line, and pre-upgrade it OVERRODE this overlay's `:-true` and the
      # stack ran continue-mode. With a posture defaulted here, the sanitizer's
      # migration refusal never trips (a posture IS set), the image merely warns
      # about the retired flag, and `reject` wins — against a `qwen2.5:7b` model
      # this kit's own docs say is NOT staged by default. /readyz then fails
      # liveness and the gateway 503s EVERY request. A whole-stack outage from an
      # image + compose bump alone, on the exact state the kit's own generator
      # produced.
      #
      # With NO default here, that same env instead meets the sanitizer's boot
      # refusal naming both replacements — loud, safe, and it forces the operator
      # to state the posture they actually want. The cost is honest and smaller:
      # a HAND-ROLLED self-hosted env that carries no L3 variable at all used to
      # inherit fail-closed and now inherits the image default `degrade`. That
      # population is the one the retired `:-true` was written for; the
      # generator-written population is everyone else. Coverage loss stays
      # visible either way — the veil-witness independently certifies
      # COMPLETENESS_PARTIAL when L3 did not run, which no availability posture
      # can suppress.
      #
      # ⇒ SELF-HOSTED OPERATORS WHO WANT FAIL-CLOSED MUST NOW SAY SO:
      #   LUCAIRN_L3_AVAILABILITY_POSTURE=reject   in customer.env,
      # after staging the model (INSTALL.md § "Pre-stage the L3 deep PII-shield
      # model"). `bin/lucairn doctor` warns if you set it without a wired shield.
      # `bin/lucairn-init` writes `degrade` explicitly on a fresh install,
      # because the model is not staged yet.
      #
      # This line is now identical to the base file's and exists only to keep the
      # variable documented on the path where the L3 shield actually runs; the
      # base `docker-compose.customer.yml` entry already forwards it. Matches the
      # Helm chart, which also states no posture (charts/lucairn/values.yaml § L3
      # DEEP-PII-SHIELD POSTURES). See customer.env.example § L3 postures.
      LUCAIRN_L3_AVAILABILITY_POSTURE: "${LUCAIRN_L3_AVAILABILITY_POSTURE:-}"
      # PRD B — FAST L3 runtime (vllm-l3). The RUNTIME SWITCH is NOT an env var:
      # PRD A's `l3_runtime` / `l3_base_url` are YAML-only dataclass fields on
      # LlmScanConfig, read from config/default-sanitizer.yaml (via
      # SANITIZER_CONFIG_PATH) — there is NO env->config override for them. To
      # route L3 through the vllm-l3 profile the operator (a) adds `vllm-l3` to
      # COMPOSE_PROFILES AND (b) uncomments `l3_runtime: vllm` + `l3_base_url:
      # http://vllm-l3:8000` in config/default-sanitizer.yaml. The default
      # (profile OFF, YAML unchanged) keeps the ollama-identity L3 path,
      # byte-identical. See docs/L3_VLLM_RUNTIME.md.
      #
      # SPLIT L3 POOL (docs/L3_SPLIT_POOL.md): the same `l3_runtime: vllm` switch
      # can point l3_base_url at a REMOTE shared-GPU vLLM host on the customer's
      # private network (`http://10.0.0.10:8000`) so several small gateway boxes
      # share one GPU. That variant adds NO compose service here — the pool is a
      # separate host the customer runs — and a pool CLIENT box does NOT activate
      # the vllm-l3 profile below. It is declared with `LUCAIRN_L3_SPLIT_POOL=true`
      # in customer.env, which is read by `bin/lucairn doctor` ONLY (no service
      # reads it) to run the split-pool preflight instead of the in-box GPU checks.
      #
      # SEC-407-04 (Slice-1 security review) is a DOCUMENTED RECOMMENDATION, NOT an
      # auto-injected env here: the sanitizer's /v1/config runs UNAUTHENTICATED by
      # default and its asdict includes `l3_base_url` (internal topology, NON-secret
      # per the A-E2 invariant — same disclosure class as `ollama_url`). An operator
      # MAY set DSA_ADMIN_KEY on the sanitizer for defense-in-depth, but the kit does
      # NOT inject it — doing so would flip an operator who already sets DSA_ADMIN_KEY
      # (e.g. for Sandbox B) from unauthenticated → authenticated /v1/config on
      # upgrade, a behavior change from a profile that must stay inert when off. The
      # PRIMARY control is the identity-plane network boundary
      # (dsa-model-runtime-identity is internal:true; NetworkPolicy/mTLS in Helm).
      # See docs/L3_VLLM_RUNTIME.md § "Egress / trust-boundary guardrails".
    networks:
      - dsa-model-runtime-identity

  redis-ai:
    image: redis:7-alpine
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory ${SANDBOX_B_REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis-ai-data:/data
    networks:
      - dsa-ai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  sandbox-b:
    image: "${LUCAIRN_IMAGE_REGISTRY:-ghcr.io/declade}/dsa-sandbox-b:${LUCAIRN_IMAGE_TAG:-0.5.4}"
    logging: *default-logging
    depends_on:
      redis-ai:
        condition: service_healthy
      id-bridge:
        condition: service_healthy
      audit:
        condition: service_healthy
      # T-682 claim-egress preflight. sandbox-b is the ONE emitter whose
      # LCR_WITNESS_ADDR is repointed from THIS file
      # (`${LUCAIRN_CENTRAL_WITNESS_ADDR:-veil-witness:50057}` below) rather
      # than from the witness-central overlay, so without this edge it would be
      # the one emitter that could still dial a Lucairn-operated witness. The
      # guard service is defined in docker-compose.customer.yml — the common
      # base both this file and the overlay are applied on top of — which is
      # what makes this reference resolvable in every shipped topology.
      witness-egress-guard:
        condition: service_completed_successfully
      # ── OPTIONAL DEPENDENCY, DELIBERATELY ─────────────────────────────────
      # PRD prd-2026-07-28-split-evidence-plane.md (board #206), 2026-07-28
      # review BLOCKER 1.
      #
      # WHY NOT `required: true` (the Compose default):
      #   sandbox-b is a CLAIM EMITTER. It DIALS a witness at
      #   LCR_WITNESS_ADDR below; it does not need one CO-LOCATED. The other
      #   four emitters in this stack — audit, id-bridge, sanitizer, gateway —
      #   declare no such edge at all, and they submit claims perfectly well.
      #   sandbox-b's edge was a LAN-topology artefact, not a requirement.
      #
      #   Under the witness-central overlay the local `veil-witness` service is
      #   parked behind a profile nobody activates, and a profiled-out service
      #   is UNDEFINED to Compose, not merely not-started. A hard edge onto it
      #   therefore does not degrade — it fails the whole project:
      #     `service "sandbox-b" depends on undefined service "veil-witness":
      #      invalid compose project`
      #   so `customer + self-hosted + witness-central` — the full on-prem set
      #   INSTALL.md documents, plus the pilot topology — would not render at
      #   all. And the workaround an operator finds first,
      #   `--profile witness-local-dev-only`, RESTORES the local witness this
      #   topology exists to delete. That is not a workaround, it is the
      #   security regression: self-signed evidence, back on by accident.
      #
      # WHAT `required: false` DOES NOT COST:
      #   the health CONDITION still applies whenever the witness IS in the
      #   project. Rendered without the overlay this edge is
      #   `{condition: service_healthy, required: false}`, so on the stock LAN
      #   topology sandbox-b still waits for a healthy witness exactly as
      #   before. Only the "the service must exist" half is relaxed.
      #
      # ⚠️ COMPOSE FLOOR: `required:` NEEDS v2.20.0+, AND OLDER CLIENTS ERROR.
      #   They do NOT ignore the unknown key — the Compose Spec schema is
      #   additionalProperties:false here, so v2.19.1 refuses the whole file:
      #     validating docker-compose.self-hosted.yml:
      #       services.sandbox-b.depends_on.veil-witness
      #       Additional property required is not allowed
      #   Measured 2026-07-28: v2.19.1 fails, v2.20.0 and v2.20.3 pass. That is
      #   loud and at config time rather than silent, but it affects the STOCK
      #   full on-prem set too, not just witness-central — so INSTALL.md's
      #   prerequisite was raised from "Docker Compose v2" to "v2.20.0+".
      #   `lucairn doctor` does not yet enforce that floor (follow-up).
      #
      # WHY `cert-builder` KEEPS A HARD EDGE (docker-compose.customer.yml,
      # profile "certification"): it does not dial a witness, it drives one —
      # it genuinely cannot do its job without a witness process in the same
      # project. `certification` + witness-central is therefore a
      # SHOULD-NOT-RENDER cell and is asserted as such in
      # tests/test_witness_central_profile.sh. Do not "fix" it here.
      veil-witness:
        condition: service_healthy
        required: false
    environment:
      DSA_ENV: "${DSA_ENV:-production}"
      DSA_SERVICE_TOKEN: "${DSA_SERVICE_TOKEN:?DSA_SERVICE_TOKEN is required}"
      SANDBOX_B_GRPC_ADDR: "0.0.0.0:50054"
      SANDBOX_B_HEALTH_ADDR: "0.0.0.0:8084"
      SANDBOX_B_REDIS_URL: "redis://redis-ai:6379"
      SANDBOX_B_VERTICALS_DIR: "/app/verticals"
      SANDBOX_B_WORKERS: "${SANDBOX_B_WORKERS:-4}"
      # Internal isolation-probe target. sandbox-b's boot_safety verifies it
      # can reach sandbox-a via this gRPC address as part of the witness
      # claim chain. Default matches the canonical self-hosted compose layout.
      SANDBOX_A_PROBE_TARGET: "${SANDBOX_A_PROBE_TARGET:-sandbox-a:50053}"
      BRIDGE_ADDR: "id-bridge:50052"
      AUDIT_SERVICE_ADDR: "audit:50051"
      GRPC_TLS_ENABLED: "${GRPC_TLS_ENABLED:-true}"
      DSA_ADMIN_KEY: "${DSA_ADMIN_KEY:?DSA_ADMIN_KEY is required}"
      SANDBOX_B_API_KEYS: "${LOCAL_SANDBOX_B_API_KEY:-local-sandbox-b-key}"
      LCR_ENABLED: "${LCR_ENABLED:-${VEIL_ENABLED:-true}}"
      # Compose-v2 eager-nested-interpolation sharp edge (see the matching
      # comment on LCR_GATEWAY_SIGNING_KEY in docker-compose.customer.yml):
      # the historical `:?` on the legacy inner slot fired even when the
      # canonical LCR_SANDBOX_B_SIGNING_KEY WAS set, so a canonical-LCR-only
      # customer.env hit a raw "variable is not set" error. The inner slot
      # now carries a safe empty default. Fail-closed is preserved WITHOUT
      # the `:?`: the base compose ships `DSA_ENV: "${DSA_ENV:-production}"`,
      # and outside DSA_ENV development/test sandbox-b itself refuses to
      # boot on an empty resolved key when the veil emitter is enabled
      # (LCR_ENABLED defaults true above) — dual-sandbox-architecture
      # services/sandbox-b/boot_safety.py
      # fail_closed_if_veil_enabled_raw_but_keys_missing, SystemExit(1).
      # `lucairn doctor` is the required-var authority for EVERY posture,
      # including development/test where that gate is skipped
      # (check_signing_key_compose_preflight in bin/lucairn).
      LCR_SIGNING_KEY: "${LCR_SANDBOX_B_SIGNING_KEY:-${VEIL_SANDBOX_B_SIGNING_KEY:-}}"
      # ⚠️ INTERPOLATED, NOT HARDCODED — 2026-07-28 review, HIGH 3.
      #
      # This was the literal `veil-witness:50057`. The witness-central overlay
      # repoints the other four emitters by declaring an `audit:` /
      # `id-bridge:` / `sanitizer:` / `gateway:` block, but it CANNOT declare a
      # `sandbox-b:` block: that overlay is also applied WITHOUT this file, and
      # an override block for a service the project does not define creates a
      # new service with no image, breaking that cell. So the repoint has to
      # happen HERE, from the same variable the overlay reads.
      #
      # Left hardcoded, `customer + self-hosted + witness-central` would start
      # a sandbox-b dialling a container that is not in the project. Every
      # AI-plane claim fails, and it fails QUIETLY: the turn still completes,
      # the user is still protected, and the certificate seals PARTIAL. An
      # operator sees "certificates are missing the AI plane", months later.
      #
      # The default keeps the stock LAN topology byte-identical.
      LCR_WITNESS_ADDR: "${LUCAIRN_CENTRAL_WITNESS_ADDR:-veil-witness:50057}"
      # ── Witness claim hop: transport latch + scoped client credential ──────
      # PRD prd-2026-07-28-split-evidence-plane.md Slice 1 (board #206 / #223).
      #
      # ⚠️ THIS BLOCK IS HERE BECAUSE IT WAS MISSED ONCE, AND THE MISS IS THE
      # WHOLE FINDING. The Slice-1 wiring went into docker-compose.customer.yml.
      # `sandbox-b` is defined ONLY in this overlay, so there was no merge source
      # for it — and INSTALL.md/OPS.md document
      # `-f docker-compose.customer.yml -f docker-compose.self-hosted.yml` as the
      # mandatory full on-prem set. The result: an operator sets
      # LCR_WITNESS_REQUIRE_MTLS=true in customer.env, every other emitter is
      # mTLS-gated, and the AI-plane emitter — the one the witness's own
      # authorization warning calls "the untrusted AI plane" — keeps a CLEARTEXT
      # claim dial, because require_witness_mtls() reads an absent variable and
      # assert_witness_transport_allowed() is a no-op. Once :50057 actually
      # requires client certificates its claims fail outright and certificates
      # seal PARTIAL, with no signal at config time.
      #
      # That is the shipped-deployments-never-see-the-setting blocker, one
      # topology over. The kit's rendered-compose test now renders
      # customer + self-hosted together for exactly this reason.
      #
      # ⚠️⚠️ NAMED OPERATOR STEP — SANDBOX-B CREDENTIAL PROVISIONING, SLICE 1.
      #
      # These three paths resolve to the EMPTY STRING by default, and this
      # service has NO mount of the witness client-credential directory. The
      # witness-central overlay mounts that directory into audit, id-bridge,
      # sanitizer and gateway — it cannot add a mount here, because it must not
      # define a `sandbox-b:` block at all (see LCR_WITNESS_ADDR above).
      #
      # So the combination
      #     customer + self-hosted + witness-central, LCR_WITNESS_REQUIRE_MTLS=true
      # leaves sandbox-b with the latch ON and no credential to satisfy it.
      # That MUST fail loud at boot, not degrade to a cleartext dial or to
      # silent PARTIAL certificates — the DSA-side boot gate is being widened
      # to make exactly this state fatal.
      #
      # If you run the full on-prem set with a central witness, YOU must:
      #   1. issue this device a claim leaf per
      #      docs/WITNESS_CENTRAL_RUNBOOK.md §3.3 (the same leaf the other four
      #      emitters use is correct — one device, one claim identity);
      #   2. add a read-only bind mount of that host directory into THIS
      #      service, e.g.
      #        volumes:
      #          - /opt/lucairn/certs/witness-client:/etc/lucairn/witness-client:ro
      #   3. set the sandbox-b-scoped triple in customer.env:
      #        LCR_WITNESS_MTLS_SANDBOX_B_CA_BUNDLE_PATH=/etc/lucairn/witness-client/ca.pem
      #        LCR_WITNESS_MTLS_SANDBOX_B_CLIENT_CERT_PATH=/etc/lucairn/witness-client/client.pem
      #        LCR_WITNESS_MTLS_SANDBOX_B_CLIENT_KEY_PATH=/etc/lucairn/witness-client/client.key
      #
      # NO DEFAULT BIND MOUNT IS SHIPPED HERE, DELIBERATELY. A bind mount of a
      # host path that does not exist is materialised by Docker as an EMPTY
      # DIRECTORY, not an error — which is the precise trap the :50058
      # transport gate was rewritten to catch. A shipped default would turn a
      # missing credential into a mount that looks present and reads empty.
      LCR_WITNESS_REQUIRE_MTLS: "${LCR_WITNESS_REQUIRE_MTLS:-false}"
      LCR_WITNESS_MTLS_CA_BUNDLE_PATH: "${LCR_WITNESS_MTLS_SANDBOX_B_CA_BUNDLE_PATH:-${LCR_WITNESS_MTLS_CA_BUNDLE_PATH:-}}"
      LCR_WITNESS_MTLS_CLIENT_CERT_PATH: "${LCR_WITNESS_MTLS_SANDBOX_B_CLIENT_CERT_PATH:-${LCR_WITNESS_MTLS_CLIENT_CERT_PATH:-}}"
      LCR_WITNESS_MTLS_CLIENT_KEY_PATH: "${LCR_WITNESS_MTLS_SANDBOX_B_CLIENT_KEY_PATH:-${LCR_WITNESS_MTLS_CLIENT_KEY_PATH:-}}"
      OLLAMA_URL: "${OLLAMA_URL:-http://ollama:11434}"
      OPENAI_API_KEY: "${MODEL_RUNTIME_API_KEY:-local-model-runtime}"
      OPENAI_BASE_URL: "${MODEL_RUNTIME_URL:-http://model-runtime:8000/v1}"
      PROOFLOG_ENABLED: "${PROOFLOG_ENABLED:-false}"
      PROOFLOG_SIGNING_KEY: "${PROOFLOG_SIGNING_KEY:-}"
      PROOFLOG_POLICIES: "${PROOFLOG_POLICIES:-model-allowlist}"
      # T-211: the image's built-in default (100000 chars) rejects a real
      # Claude Code first turn — one measured turn was 141,767 chars. Raised
      # to 400000 so a normal-sized real turn isn't rejected out of the box.
      # See customer.env.example for the operator-facing knob.
      MAX_PROMPT_CHARS: "${MAX_PROMPT_CHARS:-400000}"
    volumes:
      - ../starter-templates:/app/verticals:ro
    networks:
      - dsa-ai
      - dsa-bridge-ai
      - dsa-audit-ai
      - dsa-witness-ai
      - dsa-model-runtime
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8084/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: on-failure

  model-runtime:
    profiles: ["llama-cpp"]
    image: "${LLAMA_CPP_IMAGE:-ghcr.io/ggerganov/llama.cpp:server}"
    logging: *default-logging
    command:
      - "-m"
      - "/models/${MODEL_FILE:-model.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--ctx-size"
      - "${MODEL_CONTEXT_WINDOW:-8192}"
    volumes:
      - ${LUCAIRN_MODEL_DIR:-../models}:/models:ro
    networks:
      - dsa-model-runtime
    restart: on-failure

  model-runtime-vllm:
    profiles: ["vllm"]
    image: "${VLLM_IMAGE:-vllm/vllm-openai:latest}"
    logging: *default-logging
    command:
      - "--model"
      - "/models/${MODEL_PATH:-.}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    volumes:
      - ${LUCAIRN_MODEL_DIR:-../models}:/models:ro
    networks:
      dsa-model-runtime:
        aliases:
          - model-runtime
    restart: on-failure

  model-runtime-tgi:
    profiles: ["tgi"]
    image: "${TGI_IMAGE:-ghcr.io/huggingface/text-generation-inference:latest}"
    logging: *default-logging
    command:
      - "--model-id"
      - "/models/${MODEL_PATH:-.}"
      - "--port"
      - "8000"
    volumes:
      - ${LUCAIRN_MODEL_DIR:-../models}:/models:ro
    networks:
      dsa-model-runtime:
        aliases:
          - model-runtime
    restart: on-failure

  ollama:
    profiles: ["ollama"]
    # Default pinned to the recorded manifest digest
    # (image-manifest.yaml → pii_plane.ollama-identity →
    # ollama/ollama:0.6.2@sha256:74a0929…) so the DEPLOYED image matches the
    # pinned-and-verified manifest ref (run-vs-verify parity): an operator who
    # leaves OLLAMA_IMAGE unset/empty runs the byte-identical digest that
    # `bin/lucairn doctor --strict` verifies in the manifest. The OLLAMA_IMAGE
    # override fail-closed handling (floating/unpinned override → red) lives in
    # `bin/lucairn doctor --strict` (PR #60); doctor resolves the MANIFEST ref,
    # not this compose default, so the pin does not itself change --strict's
    # verdict.
    image: "${OLLAMA_IMAGE:-ollama/ollama:0.6.2@sha256:74a0929e1e082a09e4fdeef8594b8f4537f661366a04080e600c90ea9f712721}"
    logging: *default-logging
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama-model-store:/root/.ollama
      - ${LUCAIRN_MODEL_DIR:-../models}:/models:ro
    networks:
      - dsa-model-runtime
    restart: on-failure

  # ── Identity-plane L3 PII-shield model (ollama-identity) ────────────
  # Dedicated ollama instance for the sanitizer's level-3 deep PII shield
  # (qwen2.5:7b). It is DELIBERATELY separate from the `ollama` service
  # above (the AI-plane inference runtime used by sandbox-b): the L3 shield
  # scans RAW identity data, so per the split-knowledge invariant it must
  # run on its own identity-only network with NO shared net to the AI plane.
  # This mirrors the Helm chart's separate `ollama-identity` StatefulSet
  # (charts/lucairn/charts/sandbox-a/templates/ollama-identity-statefulset.yaml).
  #
  # ALWAYS-ON in the self-hosted overlay (NOT behind `profiles: ["ollama"]`):
  # this is the L3 shield the whole overlay exists to wire, so it must reach a
  # model regardless of which inference runtime profile (ollama / vllm / tgi /
  # ...) the operator picks for sandbox-b. Whether a missing model 503s the
  # request or degrades to L1+L2 is now the operator's stated
  # LUCAIRN_L3_AVAILABILITY_POSTURE (T-393); this overlay no longer defaults it
  # to fail-closed — see the sanitizer block above for why.
  #
  # PRE-STAGE the L3 model (qwen2.5:7b) ONCE after the stack is up. This
  # service is on the internal-only `dsa-model-runtime-identity` net (no
  # egress), so it CANNOT pull the model itself — `docker compose exec
  # ollama-identity ollama pull` runs inside this egress-less net namespace and
  # fails. Instead, stage qwen2.5:7b into this service's named volume
  # (ollama-identity-model-store) via a one-time throwaway egress-enabled
  # ollama, then restart this service to load it. See INSTALL.md
  # § "Pre-stage the L3 deep PII-shield model" for the exact procedure.
  #
  # ⛔ CHANGING THE L3 MODEL (T-370): the model name lives in
  # config/default-sanitizer.yaml (`llm_scan.model`), not here, and changing it
  # is gated on a per-artifact recall gate that has NOT been run for any other
  # model. The image pin below is a second, independent blocker: ollama 0.6.2
  # predates both Gemma-4 support (0.22.0) and the `think` request field the
  # sanitizer uses to suppress reasoning — and Go's encoding/json silently
  # DROPS unknown request fields, so an old build accepts the request, returns
  # 200, keeps reasoning, and L3 fail-closes on 100% of calls with nothing
  # pointing at this pin. The model store is an unbounded named volume, so the
  # constraint on this lane is HOST DISK (~20 GB for a 31B-class model, ~25 GB
  # during a changeover while the old blob is still staged). Read
  # docs/L3_MODEL_UPGRADE.md before touching any of it.
  ollama-identity:
    # Default pinned to the recorded manifest digest (see the AI-plane `ollama`
    # service above) so the deployed image matches the pinned-and-verified
    # manifest ref (run-vs-verify parity) when OLLAMA_IMAGE is unset/empty. The
    # override fail-closed handling lives in `bin/lucairn doctor --strict`
    # (PR #60); the pin does not itself change --strict's verdict.
    image: "${OLLAMA_IMAGE:-ollama/ollama:0.6.2@sha256:74a0929e1e082a09e4fdeef8594b8f4537f661366a04080e600c90ea9f712721}"
    logging: *default-logging
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # Keep the L3 model resident so the fail-CLOSED L3 block never fires on a
      # cold-start hiccup mid-request. Mirrors the Helm ollama-identity
      # OLLAMA_KEEP_ALIVE=-1 (charts/.../ollama-identity-statefulset.yaml:45-46).
      OLLAMA_KEEP_ALIVE: "${OLLAMA_IDENTITY_KEEP_ALIVE:--1}"
    volumes:
      - ollama-identity-model-store:/root/.ollama
      - ${LUCAIRN_MODEL_DIR:-../models}:/models:ro
    networks:
      dsa-model-runtime-identity:
        aliases:
          # The sanitizer dials hostname "ollama" (its unchanged DSA-owned
          # config). On the identity-only net that alias resolves HERE — to
          # the L3 identity model — NOT to the AI-plane inference ollama.
          - ollama
    restart: on-failure

  # ── Identity-plane FAST L3 PII-shield runtime (vllm-l3) ─────────────
  # OPT-IN, native-Linux-GPU-only alternative to `ollama-identity` for the
  # sanitizer's level-3 deep PII shield. Ollama time-slices concurrent L3
  # requests (hard ~5 rec/s ceiling on one 4090); vLLM's continuous batching
  # multiplies throughput 7.4× @ width-8 / 13× @ width-16 on the same GPU
  # (measured 2026-07-23, RTX 4090, 40-chunk doc — see
  # docs/L3_VLLM_RUNTIME.md). This is the enterprise throughput axis.
  #
  # SPLIT-KNOWLEDGE INVARIANT (non-negotiable): this service is attached ONLY
  # to the identity-plane net `dsa-model-runtime-identity` — NEVER the AI-plane
  # `dsa-model-runtime` that sandbox-b + the AI-plane `model-runtime-vllm`
  # (`:232`, profiles: ["vllm"]) use. The L3 shield scans RAW identity data, so
  # its runtime is air-gapped from the AI plane exactly like `ollama-identity`.
  # This service is a DIFFERENT trust plane from the `:232` AI-plane vllm; the
  # two must never share a net.
  #
  # OPT-IN via `COMPOSE_PROFILES=...,vllm-l3` (kit default stays Ollama — vLLM
  # is native-Linux-GPU-only, WSL2-dead [RuntimeError: UVA is not available],
  # and env-fragile; force it on nobody). When this profile is ACTIVE the
  # operator MUST also point the sanitizer at it (PRD A's config contract) by
  # uncommenting in `config/default-sanitizer.yaml` (the YAML is the ONLY switch —
  # there is NO LUCAIRN_L3_RUNTIME/LUCAIRN_L3_BASE_URL env override):
  #   l3_runtime: vllm  +  l3_base_url: http://vllm-l3:8000
  # With the profile OFF and those YAML lines commented the kit boots
  # byte-identically on the `ollama-identity` path — no default drift.
  #
  # NOT THE ONLY vLLM SHAPE: for a fleet, the SPLIT L3 POOL variant
  # (docs/L3_SPLIT_POOL.md) leaves this profile OFF and points l3_base_url at ONE
  # shared GPU host on the customer's private network instead, so many gateway
  # boxes share one GPU. The kit ships NO compose service for that pool — it is a
  # separate host the customer operates — so nothing below changes; a pool client
  # box just sets `l3_runtime: vllm` + a private `l3_base_url` and declares
  # `LUCAIRN_L3_SPLIT_POOL=true` in customer.env for `bin/lucairn doctor`.
  #
  # Serves the STOCK `Qwen/Qwen2.5-7B-Instruct-AWQ` (the AWQ equivalent of the
  # DSA-default `qwen2.5:7b`).
  #
  # ⛔ MODEL BUMP ON THIS LANE (T-370) is blocked twice over. (1) The image is
  # pinned at vLLM v0.10.2; the official vLLM recipe for the gemma-4-31B-it
  # family requires vLLM >= 0.19.1, so the artifact cannot even load here
  # today. (2) The per-artifact recall gate has not been run on ANY vLLM
  # artifact for that family — Q4_K_M Ollama numbers do not transfer to an
  # AWQ / W4A16 / FP8 build. docs/L3_MODEL_UPGRADE.md § 3 records the
  # researched candidates (only 4-bit W4A16/AWQ is even a candidate on a 24 GB
  # card, and marginally: the recipe's own FP8 pick does not fit and its NVFP4
  # pick requires Blackwell) and § 3 "What a vLLM-lane bump would touch" lists
  # the flags + the image-manifest revision pin that must move together.
  #
  # It does NOT yet serve the custom-trained
  # Enterprise "level-3 PII shield" (that is a LoRA fine-tune deliverable TODAY
  # on Ollama only; the custom→vLLM conversion is a filed follow-up). See
  # docs/L3_VLLM_RUNTIME.md § "What this runtime does NOT serve yet".
  #
  # Uses the network alias `vllm-l3` so the sanitizer's l3_base_url resolves
  # here on the identity-only net. PRE-STAGE note (MANDATORY, mirrors
  # ollama-identity): the identity net is internal:true → this container has NO
  # egress REGARDLESS of whether the HOST has internet. So vLLM CANNOT pull the
  # weights from Hugging Face at boot. The weights MUST be pre-staged ONCE into
  # the `vllm-l3-model-store` volume (a throwaway egress-enabled download step),
  # exactly like ollama-identity stages qwen2.5:7b into ollama-identity-model-store.
  # This service then runs with HF_HUB_OFFLINE=1 + TRANSFORMERS_OFFLINE=1 and
  # loads the pinned revision from that cache — it never dials HF. See
  # docs/L3_VLLM_RUNTIME.md § "Pre-staging the model" for the exact command.
  model-runtime-vllm-l3:
    profiles: ["vllm-l3"]
    # Image pinned by DIGEST to the tested vLLM release (official image bundles
    # matched CUDA/torch/kernels → sidesteps the three-pin pip version-hell:
    # vllm==0.10.2 + torch==2.8.0+cu128 + transformers==4.55.4). Recorded in
    # image-manifest.yaml (pii_plane.vllm-l3). Overridable via VLLM_L3_IMAGE.
    image: "${VLLM_L3_IMAGE:-vllm/vllm-openai:v0.10.2@sha256:607442e407b0fea97f8a132a78b787c121a996dd4de181fa08e8da06e71ec2db}"
    logging: *default-logging
    environment:
      # Force vLLM/transformers to load the pre-staged weights from the mounted
      # HF cache and NEVER dial Hugging Face at boot. Required because this
      # service is on the internal:true identity net (no egress) — a boot-time HF
      # pull would fail and the profile would never start. The weights are
      # pre-staged into vllm-l3-model-store (see the block comment above +
      # docs/L3_VLLM_RUNTIME.md § "Pre-staging the model").
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    command:
      - "--model"
      - "Qwen/Qwen2.5-7B-Instruct-AWQ"
      # Bug-fix (2026-07-23): the sanitizer sends the SHARED config `model:`
      # value in the OpenAI request body — config/default-sanitizer.yaml
      # llm_scan.model = "qwen2.5:7b" (the ollama-identity default). Without an
      # alias, vLLM answers ONLY to "Qwen/Qwen2.5-7B-Instruct-AWQ" → 404 model
      # not found → the sanitizer fail-closes 503 on EVERY request. Serve the
      # SAME name the config sends so ollama-identity + vllm-l3 both work off
      # `model: qwen2.5:7b` (no per-runtime model field needed). BOTH names are
      # served — `--served-model-name` REPLACES the default API id, so we also
      # list the HF repo id so the throughput benchmark (tools/l3_throughput_bench.py,
      # default --model Qwen/Qwen2.5-7B-Instruct-AWQ) and any direct caller keep
      # working. Still loads the ONE pinned `--model` + `--revision` below.
      - "--served-model-name"
      - "qwen2.5:7b"
      - "Qwen/Qwen2.5-7B-Instruct-AWQ"
      # B-E2: pin the MODEL revision. The image digest does NOT pin the weights
      # vLLM pulls from HF at boot — an upstream re-upload of the AWQ repo would
      # silently change the artifact the recall gate blessed. This HF commit sha
      # was resolved 2026-07-23 (HF API). Re-pin at the digest-pin ceremony if
      # the recall gate is re-run against a newer revision.
      - "--revision"
      - "b25037543e9394b818fdfca67ab2a00ecc7dd641"
      - "--quantization"
      - "awq"
      - "--dtype"
      - "float16"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--max-model-len"
      - "8192"
      - "--enforce-eager"
      # B-E1 (top leak pick): the vllm-openai server logs request CONTENT by
      # default → raw PRE-REDACTION PII at rest in this container's logs on the
      # customer host (log shippers / backups pick it up — the L3-cache
      # PII-at-rest lesson replayed on the ops plane). Disable request-content
      # logging. Acceptance: after a redaction round-trip, grepping this
      # container's logs for the raw fixture PII = ZERO hits.
      - "--disable-log-requests"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    # GPU reservation. vLLM is native-Linux-GPU-only; the host needs the NVIDIA
    # Container Toolkit. `bin/lucairn doctor` pre-flights GPU/driver/WSL2 before
    # this ever serves traffic (fails loud with the Ollama-fallback instruction).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    volumes:
      # Pre-staged HF weight cache (populated ONCE via the throwaway
      # egress-enabled step — see docs/L3_VLLM_RUNTIME.md). With
      # HF_HUB_OFFLINE=1 above, vLLM reads the pinned revision from here and
      # never needs egress — which the internal:true identity net forbids anyway.
      - vllm-l3-model-store:/root/.cache/huggingface
    networks:
      dsa-model-runtime-identity:
        aliases:
          # The sanitizer dials l3_base_url: http://vllm-l3:8000 (set in
          # config/default-sanitizer.yaml when the profile is active). On the
          # identity-only net that alias resolves HERE — NOT to `ollama` (the
          # ollama-identity L3 default) and NOT to the AI-plane inference runtimes.
          - vllm-l3
    restart: on-failure

  model-runtime-onnxruntime:
    profiles: ["onnxruntime"]
    image: "${ONNXRUNTIME_OPENAI_IMAGE:-ghcr.io/declade/openai-compatible-onnxruntime:latest}"
    logging: *default-logging
    volumes:
      - ${LUCAIRN_MODEL_DIR:-../models}:/models:ro
    networks:
      dsa-model-runtime:
        aliases:
          - model-runtime
    restart: on-failure

  model-runtime-triton:
    profiles: ["triton"]
    image: "${TRITON_OPENAI_IMAGE:-ghcr.io/declade/openai-compatible-triton:latest}"
    logging: *default-logging
    volumes:
      - ${LUCAIRN_MODEL_DIR:-../models}:/models:ro
    networks:
      dsa-model-runtime:
        aliases:
          - model-runtime
    restart: on-failure

  model-runtime-custom:
    profiles: ["custom-runtime"]
    image: "${MODEL_RUNTIME_IMAGE:-ghcr.io/declade/openai-compatible-runtime:latest}"
    logging: *default-logging
    command: ${MODEL_RUNTIME_COMMAND:-}
    environment:
      MODEL_DIR: "/models"
      MODEL_NAME: "${MODEL_NAME:-customer-model}"
      MODEL_FILE: "${MODEL_FILE:-}"
      MODEL_PATH: "${MODEL_PATH:-}"
      MODEL_CONTEXT_WINDOW: "${MODEL_CONTEXT_WINDOW:-8192}"
    volumes:
      - ${LUCAIRN_MODEL_DIR:-../models}:/models:ro
    networks:
      dsa-model-runtime:
        aliases:
          - model-runtime
    restart: on-failure

  # ── Lucairn Enterprise Dashboard (self-hosted) ──────────────────
  # Mirror of the dashboard block in docker-compose.customer.yml. Same
  # OPT-IN model: `--profile dashboard`. Self-hosted installs share the
  # identical dashboard binary + env var contract; the only difference is
  # which compose file the operator started from.
  lucairn-dashboard:
    profiles: ["dashboard"]
    image: "${LUCAIRN_IMAGE_REGISTRY:-ghcr.io/declade}/lucairn-dashboard:${LUCAIRN_DASHBOARD_IMAGE_TAG:-0.8.2}"
    logging: *default-logging
    restart: unless-stopped
    environment:
      LUCAIRN_DASHBOARD_LISTEN_ADDR: "${LUCAIRN_DASHBOARD_LISTEN_ADDR:-0.0.0.0:8443}"
      LUCAIRN_DASHBOARD_BOOTSTRAP_EMAIL: "${LUCAIRN_DASHBOARD_BOOTSTRAP_EMAIL:-admin@lucairn.local}"
      # Compose v2 evaluates ${VAR:?...} at config-load time across ALL
      # service definitions — `profiles:` does NOT scope env interpolation.
      # Using `:?` here would block `docker compose up -d` (no dashboard
      # profile) on a stock kit install. The dashboard binary itself
      # fail-fasts at startup if BootstrapPassword is empty (see
      # apps/dashboard/internal/config/config.go:179-180), so security
      # regression is impossible — the dashboard container only starts
      # when the profile is explicitly activated, and refuses to boot
      # with an unset password.
      LUCAIRN_DASHBOARD_BOOTSTRAP_PASSWORD: "${LUCAIRN_DASHBOARD_BOOTSTRAP_PASSWORD:-}"
      LUCAIRN_DASHBOARD_SESSION_SECRET: "${LUCAIRN_DASHBOARD_SESSION_SECRET:-}"
      LUCAIRN_DASHBOARD_OIDC_ENABLED: "${LUCAIRN_DASHBOARD_OIDC_ENABLED:-false}"
      LUCAIRN_DASHBOARD_OIDC_ISSUER_URL: "${LUCAIRN_DASHBOARD_OIDC_ISSUER_URL:-}"
      LUCAIRN_DASHBOARD_OIDC_CLIENT_ID: "${LUCAIRN_DASHBOARD_OIDC_CLIENT_ID:-}"
      LUCAIRN_DASHBOARD_OIDC_CLIENT_SECRET: "${LUCAIRN_DASHBOARD_OIDC_CLIENT_SECRET:-}"
      LUCAIRN_DASHBOARD_OIDC_ADMIN_GROUP: "${LUCAIRN_DASHBOARD_OIDC_ADMIN_GROUP:-}"
      LUCAIRN_DASHBOARD_OIDC_VIEWER_GROUP: "${LUCAIRN_DASHBOARD_OIDC_VIEWER_GROUP:-}"
      LUCAIRN_DASHBOARD_OIDC_GROUPS_CLAIM: "${LUCAIRN_DASHBOARD_OIDC_GROUPS_CLAIM:-groups}"
      LUCAIRN_DASHBOARD_OIDC_PUBLIC_URL: "${LUCAIRN_DASHBOARD_OIDC_PUBLIC_URL:-}"
      LUCAIRN_DASHBOARD_OIDC_CALLBACK_URL: "${LUCAIRN_DASHBOARD_OIDC_CALLBACK_URL:-}"
      # Slice 3 cert surface: cert browser + inspector + validator.
      # Dashboard 0.8.2 enables the cert browser by default — see the
      # rationale in docker-compose.customer.yml. Operators can pin a
      # dedicated read-only role by overriding LUCAIRN_DASHBOARD_AUDIT_DB_URL.
      LUCAIRN_DASHBOARD_AUDIT_DB_URL: "${LUCAIRN_DASHBOARD_AUDIT_DB_URL:-postgres://veil_app:${VEIL_APP_PASSWORD:?VEIL_APP_PASSWORD must be set (no weak default; see customer.env)}@postgres-veil:5432/veil?sslmode=${POSTGRES_SSLMODE:-disable}}"
      LUCAIRN_DASHBOARD_WITNESS_ENDPOINT: "${LUCAIRN_DASHBOARD_WITNESS_ENDPOINT:-veil-witness:50058}"
      LUCAIRN_DASHBOARD_WITNESS_TLS_ENABLED: "${LUCAIRN_DASHBOARD_WITNESS_TLS_ENABLED:-false}"
      # Slice 4: server-health overview + Grafana embedding plumbing.
      LUCAIRN_DASHBOARD_HEALTH_SERVICES: "${LUCAIRN_DASHBOARD_HEALTH_SERVICES:-}"
      LUCAIRN_DASHBOARD_HEALTH_POLL_INTERVAL_SECONDS: "${LUCAIRN_DASHBOARD_HEALTH_POLL_INTERVAL_SECONDS:-10}"
      LUCAIRN_DASHBOARD_GRAFANA_URL: "${LUCAIRN_DASHBOARD_GRAFANA_URL:-}"
      LUCAIRN_DASHBOARD_GRAFANA_JWT_SECRET: "${LUCAIRN_DASHBOARD_GRAFANA_JWT_SECRET:-}"
      LUCAIRN_DASHBOARD_GRAFANA_PANEL_GATEWAY_THROUGHPUT_UID: "${LUCAIRN_DASHBOARD_GRAFANA_PANEL_GATEWAY_THROUGHPUT_UID:-}"
      LUCAIRN_DASHBOARD_GRAFANA_PANEL_SANITIZER_HIT_RATES_UID: "${LUCAIRN_DASHBOARD_GRAFANA_PANEL_SANITIZER_HIT_RATES_UID:-}"
      LUCAIRN_DASHBOARD_GRAFANA_PANEL_WITNESS_VERIFY_RATE_UID: "${LUCAIRN_DASHBOARD_GRAFANA_PANEL_WITNESS_VERIFY_RATE_UID:-}"
      LUCAIRN_DASHBOARD_GRAFANA_PANEL_AUDIT_LOG_VOLUME_UID: "${LUCAIRN_DASHBOARD_GRAFANA_PANEL_AUDIT_LOG_VOLUME_UID:-}"
      # Slice 5: API key management. Both must be set together.
      LUCAIRN_DASHBOARD_GATEWAY_ADMIN_URL: "${LUCAIRN_DASHBOARD_GATEWAY_ADMIN_URL:-}"
      LUCAIRN_DASHBOARD_GATEWAY_ADMIN_TOKEN: "${LUCAIRN_DASHBOARD_GATEWAY_ADMIN_TOKEN:-}"
      # Slice 6: audit log browser. The env var name is DISTINCT from
      # LUCAIRN_DASHBOARD_AUDIT_DB_URL (Slice 3); this one points at
      # postgres-audit (event log). Empty = /audit renders the "not
      # configured" explainer.
      LUCAIRN_DASHBOARD_AUDIT_LOG_DB_URL: "${LUCAIRN_DASHBOARD_AUDIT_LOG_DB_URL:-}"
      LUCAIRN_DASHBOARD_AUDIT_LOG_SAVED_FILTERS_DB_URL: "${LUCAIRN_DASHBOARD_AUDIT_LOG_SAVED_FILTERS_DB_URL:-}"
      # Compliance PDF export. Admin-only + always-on surface.
      LUCAIRN_DASHBOARD_COMPLIANCE_MAX_WINDOW_DAYS: "${LUCAIRN_DASHBOARD_COMPLIANCE_MAX_WINDOW_DAYS:-365}"
      LUCAIRN_DASHBOARD_COMPLIANCE_DEFAULT_CUSTOMER_NAME: "${LUCAIRN_DASHBOARD_COMPLIANCE_DEFAULT_CUSTOMER_NAME:-}"
      # Dashboard 0.8.0 — demo mode (boot-time store swap) + per-user
      # demo-toggle (cookie-scoped header switch on home page). Both OFF
      # by default. See customer.env.example for full documentation.
      LUCAIRN_DASHBOARD_DEMO_MODE: "${LUCAIRN_DASHBOARD_DEMO_MODE:-}"
      LUCAIRN_DASHBOARD_DEMO_TOGGLE_ENABLED: "${LUCAIRN_DASHBOARD_DEMO_TOGGLE_ENABLED:-}"
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8443/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

