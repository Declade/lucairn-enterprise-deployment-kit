# Product default — deployed to every customer.
# Conservative: catches more PII, no safe patterns.
# Customers configure field_routing to classify which fields are
# identity (→ Sandbox A), freetext (→ Sanitizer), or passthrough (→ Sandbox B).
# Unclassified fields default to freetext (fail-closed).

# Field routing — customers edit this section to match their data sources.
# See ./starter-templates/ for vertical-specific examples (finance, government,
# healthcare, itsm).
gateway:
  field_routing:
    default:
      identity: []
      freetext: []       # all unclassified fields also land here (fail-closed)
      passthrough: []

sanitizer:
  freetext_fields: []
  # W5+ Phase 1 (2026-05-09) toggles — credential-class + adversarial-input
  # hardening. Both default ON; operators can flip to false per environment.
  # NOTE (r1 fix, TOB-160-001): the third toggle
  # `documented_placeholder_suppression_enabled` was removed because the
  # filter created an exploitable real-credential-leak path. The yaml loader
  # silently ignores any leftover key in customer config files.
  detect_secrets_enabled: true
  adversarial_normalization_enabled: true
  known_entity_matching:
    enabled: true
    strategies: [exact, cologne_phonetics, levenshtein]
    levenshtein_max_distance: 2
    location_context_window: 50
    # Customer-scoped PERSON name supplement. Empty by default — operators add
    # names here that are deliberately excluded from the global german-names.txt
    # list (e.g. surnames that collide with common German words). Word-boundary
    # matched, so compound words like "Vogelgrippe" are NOT matched.
    extra_person_names: []
  presidio:
    language_detection: auto
    default_language: de
    supported_languages: [de, en]
    confidence_threshold: 0.35
    custom_recognizers:
      - sozialversicherungsnummer
      - us_ssn
      - steuer_id
      - personalausweisnummer
      - german_zip_code
      - credit_card_extended
      - phone_extended
      - german_names
      - german_street
      - date_of_birth
      - account_number
      - fallnummer
      - vin
      - license_plate
      - swift_bic
      - passport_number
      - drivers_license
      - street_address
      - password
      - krankenversichertennummer
      # W5+ Phase 1 (2026-05-09) — high-value SaaS secret prefixes + partial
      # credit-card-suffix idiom. Yelp detect-secrets is wired separately in
      # app.py (config flag: sanitizer.detect_secrets_enabled).
      - openai_api_key
      - anthropic_api_key
      - stripe_webhook_secret
      - jwt_token
      - github_pat
      - credit_card_suffix_idiom
      # Phase 3 (2026-05-09) — domain coverage expansion. German court
      # Aktenzeichen recognizer closes the gov/legal recall gap (was 67.5%);
      # 5 international PII recognizers (ES DNI/NIE, FR INSEE, IT Codice
      # Fiscale, BE RNN, NL BSN) close the international recall gap (was
      # 66.7%); generic order-number recognizer closes the customer-service
      # recall gap (was 74%).
      - german_aktenzeichen
      - spanish_dni
      - french_insee
      - italian_codice_fiscale
      - belgian_rnn
      - dutch_bsn
      - order_number
    safe_terms_file: /config/medical-terms.txt
    # Strict whole-span-exact safe list (v0.5.1). Suppresses Presidio/spaCy
    # PERSON false positives on product vocabulary (Claude/signable/…) where
    # the ENTIRE detected span exactly equals the safe term. Does NOT suppress
    # multi-token spans like "Claude Müller" — those still redact the surname.
    # See config/safe-terms-strict.txt for the term list and semantics.
    strict_safe_terms_file: /config/safe-terms-strict.txt
    # A6 (over-redaction tuning, v0.5.2): drop spaCy-NER LOCATION false positives
    # on a curated stop-list of common English words ("West"/"Loop"/…) that the
    # `en` SpacyRecognizer mis-tags as LOCATION in messy agentic/ITSM prose. A
    # detection is dropped ONLY when entity_type == LOCATION on a single whole
    # token present in this list — longer tokens, PERSON spans, and real
    # surnames-in-identity (L1) stay untouched. The 0.5.2 sanitizer image carries
    # the matching presidio_scan._is_spacy_location_stopword path.
    # See config/safe-terms-strict-location.txt for the term list and semantics.
    spacy_location_stop_terms_file: /config/safe-terms-strict-location.txt
    safe_patterns:
      # GPS/decimal coordinates: digits with 4+ decimal places (32.85768, -97.3 etc.)
      - '-?\d{1,3}\.\d{4,}'
  llm_scan:
    enabled: true
    ollama_url: http://ollama:11434
    # ⛔ DO NOT BUMP WITHOUT THE PER-ARTIFACT RECALL GATE (T-370).
    #
    #   gemma4:31b requires the per-artifact recall gate (T-370 / PRD
    #   prd-2026-07-31-l3-rebuild-recoverable-truncation-gemma4.md Slice 3) to
    #   pass on YOUR runtime's artifact before flipping this value; the
    #   2026-07-31 validation covered the Ollama Q4_K_M lane at ceiling on a
    #   saturated corpus — it is not transferable.
    #
    # Quantization is part of the artifact: the Ollama Q4_K_M GGUF and a vLLM
    # AWQ / W4A16 / FP8 build of the same upstream weights are DIFFERENT
    # artifacts. Nothing enforces this gate — read docs/L3_MODEL_UPGRADE.md
    # before changing this line (§ 1 lists the kit-side runtime blockers, § 4
    # the upgrade + rollback procedure and the fail-closed pull window).
    #
    # This key is also load-bearing in a way that is easy to miss: the
    # sanitizer IMAGE's own default for llm_scan.model is no longer
    # qwen2.5:7b, so it is THIS explicit pin that keeps a newer sanitizer
    # image serving the model the kit actually stages. Do not delete it.
    model: qwen2.5:7b
    # ── Fast vLLM L3 runtime (OPT-IN, native-Linux GPU only — see docs/L3_VLLM_RUNTIME.md) ──
    # Ollama above stays the default + universal fallback. To route L3 through the
    # pinned `vllm-l3` compose profile instead:
    #   1. activate the profile:  COMPOSE_PROFILES=<existing>,vllm-l3
    #   2. uncomment the two lines below. `vllm-l3` is a single-label internal alias
    #      (no dot) so it classifies as internal — no l3_allow_external_base_url opt-in needed.
    # l3_runtime: vllm
    # l3_base_url: http://vllm-l3:8000
    #
    # ── OPTION B: SPLIT L3 POOL (remote shared GPU — see docs/L3_SPLIT_POOL.md) ──
    # Same `l3_runtime: vllm` switch, but l3_base_url points at ONE shared GPU host
    # on YOUR PRIVATE NETWORK instead of an in-box container, so several small
    # gateway boxes share one GPU. On a split-pool box you do NOT add the vllm-l3
    # profile (there is no local vLLM container here) and you DO set
    # LUCAIRN_L3_SPLIT_POOL=true in customer.env so `bin/lucairn doctor` runs the
    # split-pool preflight instead of the in-box GPU checks.
    # Uncomment EXACTLY ONE option's two lines (A or B), never both. These sit at
    # the same indentation as Option A / `ollama_url` above: uncommenting strips
    # only the leading "# " and must leave the key at 4 spaces, or the sanitizer
    # fails to parse its config at boot.
    # l3_runtime: vllm
    # l3_base_url: http://10.0.0.10:8000     # RFC1918 / private-DNS ONLY
    # An RFC1918 address classifies as INTERNAL in the sanitizer's own allowlist
    # (dual-sandbox-architecture services/sanitizer/llm_scan.py:431-492, IP branch
    # at :484-492), so no l3_allow_external_base_url opt-in is needed or used. A
    # PUBLIC host would be BLOCKED at boot (services/sanitizer/config.py:1507-1533).
    timeout_seconds: 30
    # FAIL-01 (PRD prd-2026-05-29-fail-safe-scrubber): fail-CLOSED — block the
    # request with a 503 l3_scrubber_unavailable when the L3 deep PII shield is
    # unavailable rather than silently shipping L1+L2-only coverage. Overridable
    # per deployment via the LUCAIRN_L3_REQUIRED env var (default true).
    fallback_on_error: reject
    # Phase 3 (2026-05-09) added "ensemble" mode for L3 reversals. Default
    # stays "sequential" so existing customers see ZERO behavior drift on
    # this PR's deploy. (TOB-003 fix, 2026-05-09 — earlier draft flipped the
    # default to ensemble, which silently changed cert payload shape and
    # invoked a different code path / timeout / fallback profile across
    # ALL customers regardless of their per-request `enable_l3_reversals`
    # flag. Reverted.)
    #
    # Pro/Enterprise overlays MUST explicitly set:
    #     mode: ensemble
    # to opt into the L3 reversal path. The per-request
    # `enable_l3_reversals` flag is request-scoped; the `mode: ensemble`
    # switch is config-scoped (operator-set). Both must be present for
    # reversals to fire.
    mode: sequential
    # Calibrated against the 12-corpus domain bench to hit news-journalism
    # FP < 9% without leaking patient names. Lowered from 0.9 -> 0.85;
    # tighten back to 0.9 only if false-reversal cases observed in the
    # `compliance_trace.l3_reversals` audit log.
    restore_threshold: 0.85
  llm_audit:
    enabled: false

  # ──────────────────────────────────────────────────────────────────
  # Phase 7 — ML PII scanners (Piiranha + GLiNER), served by the pii-ml
  # gRPC sidecar. DISABLED by default as of kit v1.7.1 (2026-06-10) for
  # performance: the ML sidecar saturates CPU and overloads on large
  # prompts (~147KB routed Claude Code turns), which induced ~90s/turn
  # latency and a fail-closed refusal on the pilot. The deterministic
  # layers above (known_entity_matching + Presidio L1/L2) remain active.
  #
  # The sanitizer's pii_ml_client.py only dials the pii-ml sidecar when
  # these layer flags are true, so with both false the sidecar is never
  # contacted and the LUCAIRN_PII_ML_ADDR endpoint can be absent/idle.
  #
  # To re-enable Phase 7: set piiranha.enabled=true + gliner.enabled=true
  # here AND ensure the pii-ml sidecar is deployed (Compose: bring the stack
  # up with `--profile phase7`; Helm: also set pii-ml.enabled=true).
  # See INSTALL.md § "Re-enabling Phase 7".
  # ──────────────────────────────────────────────────────────────────
  piiranha:
    enabled: false
  gliner:
    enabled: false

qi_engine:
  # Controlled at runtime via QI_ENGINE_ENABLED, QI_ENGINE_THRESHOLD, QI_ENGINE_ACTION env vars.
  # Defaults shown here for reference:
  enabled: false
  threshold: 0.25
  action: generalize
