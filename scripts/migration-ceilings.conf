# Migration version ceilings for the Compose install path (board T-350).
#
# THIS FILE IS PART OF THE KIT RELEASE, NOT OPERATOR CONFIGURATION.
#
# Each value is the highest migration version THIS kit release has reviewed for
# personal-data retention impact, per database. `scripts/migrate-capped.sh`
# refuses to migrate past it, and refuses outright if this file is missing or
# says something different from what the Compose file passed in.
#
# It exists as a separate mounted file because the previous design read the
# ceiling from the container environment — and a Compose `environment:` value is
# overridable by a second `-f` overlay or by `docker compose run -e`. That made
# the ceiling a convention rather than a control: `MIGRATE_KNOWN_SAFE_MAX=99`
# applied migrations 11 and 12 while the log line still said "capped".
#
# The Helm path has no equivalent hole — there the ceiling is a Go-template
# literal that `--set` and `-f` cannot reach.
#
# ⛔ Do NOT edit these numbers to make an install proceed. Raising a ceiling is a
# kit-release decision gated by docs/RELEASING.md § "Migration review", which
# requires stating each new migration's retention impact and blocking on the
# absence of a deletion path. If you have made that judgement yourself and accept
# the consequences, use the documented escape hatch instead — it is loud, it is
# per-service, and it leaves a banner in the logs:
#   LUCAIRN_MIGRATE_UNSAFE_ACKNOWLEDGE_OPEN_ENDED_MIGRATE_UP_<SERVICE>=true
#
# Values below = the last version in each migrations/<tree>/ directory shipped
# with this kit.

CEILING_VEIL_WITNESS=10
CEILING_AUDIT=6
CEILING_ID_BRIDGE=4
CEILING_SANDBOX_A=8
