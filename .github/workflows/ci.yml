name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # dashboard-go — the Go test suite for apps/dashboard.
  # ---------------------------------------------------------------------------
  #
  # ⚑ WHY THIS IS A SEPARATE JOB, NOT A STEP IN `Kit test harness`.
  #
  # Until this job existed, NOTHING in CI ran `go test`: the harness job runs
  # `make test`, the root Makefile has no Go target, and apps/dashboard/Makefile
  # is only ever invoked by hand. Every Go assertion in apps/dashboard — the
  # witness verify client, the cert inspector renders, the claim-ceiling wording
  # guards — was unenforced on every PR and every push to main. A test suite
  # nobody runs is documentation.
  #
  # It is a SEPARATE job because the harness job depends on the public container
  # registry: `doctor --strict` resolves third-party image digests
  # (postgres:16-alpine, redis:7-alpine) and fails closed when an upstream tag is
  # re-pointed — which is a real supply-chain control, and also a red that has
  # nothing to do with any given PR's diff (board T-831). Folding `go test` into
  # that job would let an unrelated registry event mask a genuine Go failure, and
  # would make a Go failure look like an infrastructure flake. Two jobs, two
  # independent verdicts.
  #
  # No registry, no Docker, no Helm: this job needs a Go toolchain and nothing
  # else, so it finishes in well under a minute.
  dashboard-go:
    name: Dashboard Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go-version-file pins the toolchain to apps/dashboard/go.mod rather than
      # a literal here, so a future `go` directive bump does not silently keep
      # testing on the old toolchain.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/dashboard/go.mod
          cache-dependency-path: apps/dashboard/go.sum

      - name: go vet
        working-directory: apps/dashboard
        run: go vet ./...

      # Matches `make -C apps/dashboard test`. Kept as an explicit `go test` so
      # the CI verdict does not depend on a Makefile target continuing to mean
      # what it means today.
      - name: go test
        working-directory: apps/dashboard
        run: go test ./...

  test:
    name: Kit test harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install CI tools into a runner-writable directory.  GitHub-hosted
      # ubuntu-latest runners execute workflow steps as the unprivileged
      # "runner" user; /usr/local/bin is root-owned and not writable without
      # sudo.  We use $RUNNER_TEMP/bin (always writable by the runner user)
      # and register it via $GITHUB_PATH so subsequent steps find the
      # binaries on PATH.
      #
      # Pinned versions (linux-amd64 builds):
      #   helm        v3.16.4  — stable Helm 3 LTS; chart uses apiVersion: v2.
      #                          Local dev uses v4.1.3 (renders identically on
      #                          all tested assertions); bump pin if Helm 4
      #                          features are ever required.
      #   kubeconform v0.7.0   — validates rendered K8s manifests; matches
      #                          local version.
      #
      # cosign is intentionally NOT installed here.  tests/test_sbom.sh
      # assertion 6 tests the missing-cosign fast-fail path: it uses
      # `if command -v cosign` and SKIPS when cosign is on PATH.  Installing
      # cosign would cause that regression path to be silently un-exercised in
      # CI.  No other test needs a real cosign binary: test_check_updates.sh
      # and test_sbom.sh assertion 7 each use a local shim/stub that does not
      # require the real binary.  The full fetch+verify path (real cosign +
      # GHCR) is covered by the post-merge edge-verify, not the unit harness.
      - name: Install CI tools (helm v3.16.4, kubeconform v0.7.0, strace, pyyaml)
        run: |
          TOOL_DIR="$RUNNER_TEMP/bin"
          mkdir -p "$TOOL_DIR"

          # The full-doctor custody test requires Linux execve/open tracing;
          # do not allow a green CI run to silently skip that proof.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          command -v strace

          # tests/test_netpol_hardening.sh evaluates NetworkPolicy label
          # selectors and CIDR sets, which grep cannot do correctly. It FAILS
          # CLOSED without PyYAML rather than skipping (a skipped security
          # control reads as a pass), so the dependency is provisioned here
          # instead of being assumed from the runner image.
          sudo apt-get install -y --no-install-recommends python3-yaml
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)'

          # helm v3.16.4 — linux-amd64
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C "$TOOL_DIR" linux-amd64/helm

          # kubeconform v0.7.0 — linux-amd64
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$TOOL_DIR" kubeconform

          chmod +x "$TOOL_DIR/helm" "$TOOL_DIR/kubeconform"

          # Register for subsequent steps (GITHUB_PATH affects steps AFTER this one)
          echo "$TOOL_DIR" >> "$GITHUB_PATH"

          # Smoke-check versions (uses absolute paths since PATH not yet updated)
          "$TOOL_DIR/helm" version --short
          "$TOOL_DIR/kubeconform" -v

      - name: Run make test
        run: make test
