# Lucairn image manifest — the tested set of container image versions
# this kit release was validated against.
#
# Why this file exists:
#   Sim 2 surfaced three coupling bugs between the kit and the container
#   images it pulls:
#
#   1. The kit's customer.env.example shipped `LUCAIRN_IMAGE_TAG=1.0.0` long
#      after the highest published image was `0.3.1`. Pulls failed with
#      `manifest unknown` on every service. (Closed by PR #4.)
#   2. The kit's `config/default-sanitizer.yaml` listed 14 recognizers that
#      the 0.3.1 sanitizer image does not ship; sanitizer crash-looped on
#      `ValueError: Unknown recognizer`. The kit's config tree had drifted
#      ahead of the image-side recognizer registry.
#   3. The gateway image's BYOK forwarding adapter changed shape between
#      0.3.1 and main; older images return 401 from Anthropic native
#      messages despite a byte-identical upstream key.
#
# In each case the root cause is "no artifact pins the kit-version-to-image-
# version contract, so they can drift independently and the operator has
# no way to tell which combination was tested." This manifest is that
# artifact.
#
# What this file does NOT do:
#   - It does not OVERRIDE the env var `LUCAIRN_IMAGE_TAG`. Operators can
#     still pin to whatever tag they want via customer.env or via
#     per-service tag overrides in a compose override file.
#   - It does not pull or verify images directly. `bin/lucairn doctor`
#     reads this manifest and warns when env-resolved tags differ from
#     the pinned set, but never blocks the install.
#
# To update for a new kit release:
#   1. Bump `kit_version` to match `VERSION`.
#   2. Bump `default_lucairn_image_tag` to the new known-good tag.
#   3. Add or update entries in `services:` for any service whose tag is
#      pinned independently (override of the default tag).
#   4. Run `bin/lucairn doctor` against a fresh deploy with the new tag
#      to confirm the manifest is internally consistent.

# Kit release this manifest was tested for. Must match VERSION at the
# repo root. doctor warns when the values diverge.
kit_version: "1.9.5"

# Default tag applied to every dsa-* image unless a per-service override
# exists in `services:` below. Operators set LUCAIRN_IMAGE_TAG in customer.env
# to use a different default; doctor warns when env != this manifest value.
# ⛔ T-1102: do not bump this to a gateway tag whose source contains
#    services/gateway/cmd/server/ai_key_separation.go (DSA main after PR #681)
#    without the CHANGELOG release-ordering note (key removal BEFORE upgrade;
#    Sensitive Mode certs read failed; desktop chip version). Check by content:
#    `git grep -q checkNoAISigningKey services/gateway/cmd/server/main.go` at the tag's source.
#    0.5.5 IS such a tag (built from DSA main f70d0fe8 or later, which carries
#    checkNoAISigningKey); its release-ordering note is in CHANGELOG.md [1.9.5].
default_lucairn_image_tag: "0.5.5"

# Registry the kit was validated against. doctor warns when env's
# LUCAIRN_IMAGE_REGISTRY differs.
default_lucairn_image_registry: "ghcr.io/declade"

# Per-service tag pins. Each entry overrides default_lucairn_image_tag for
# that specific service. Leave empty (or omit the service entirely) to
# inherit the default.
#
# When proto / signable / canonical-payload contracts change in a way that
# requires a coordinated upgrade across multiple services, those services
# should be pinned together here so an operator pulling the kit cannot
# accidentally mix incompatible versions.
# NOTE FOR AIR-GAP MIRROR OPERATORS — mirror ALL signed artifacts, not just
# the services listed below. The `services:` block covers only the 8 images
# that the default Compose stack actually pulls. Five additional images are
# cosign-signed and published alongside every release but are NOT pulled by
# the default compose path — they are optional or deployment-specific:
#
#   dsa-reid-guard    (L4 Re-ID guard — pulled when reid-guard profile enabled)
#   dsa-admin         (admin API service — pulled when admin profile enabled)
#   dsa-demo          (demo portal — pulled when demo profile enabled)
#   dsa-ingest        (data ingest service — reserved, not wired by default)
#   dsa-llm-auditor   (LLM audit service — pulled when llm-auditor profile enabled)
#
# A mirror sized from `services:` alone (8 images) will be MISSING these 5
# artifacts. Size your mirror from the `signed_artifacts:` block below (13
# Lucairn images + lucairn-dashboard) to ensure every cosign-verified image
# is available offline. The `optional_services:` block (lucairn-dashboard,
# dsa-cert-builder, dsa-cert-portal) contains further images used only with
# specific profiles.
services:
  dsa-audit:
    image_tag: ""    # inherits default
  dsa-id-bridge:
    image_tag: ""
  dsa-sandbox-a:
    image_tag: ""
  dsa-sandbox-b:
    image_tag: ""
  dsa-sanitizer:
    image_tag: ""
    # The sanitizer's recognizer registry must match the kit's
    # config/default-sanitizer.yaml. Bumping the sanitizer tag without
    # syncing config/default-sanitizer.yaml is the Sim 2 F3 failure mode.
    sanitizer_config_path: "config/default-sanitizer.yaml"
    sanitizer_config_compat: "0.5.x"   # version line the config is targeting
  dsa-pii-ml:
    # Phase 7 ML sidecar (Piiranha + GLiNER). Shipped at PR #240 production-
    # path follow-up. The HF revision SHAs the image is built against are
    # baked into the image's own config (verified via the
    # LUCAIRN_PII_ML_PIIRANHA_REVISION + LUCAIRN_PII_ML_GLINER_REVISION env
    # vars in the Helm subchart). The kit's pii-ml.hfRevisions block in
    # charts/lucairn/values.yaml MUST stay in lockstep with these — Sim 2
    # F3-class drift surface.
    #
    # PINNED to 0.5.1 explicitly. The sidecar has an INDEPENDENT release
    # cadence (tied to PR #240 production-path follow-up, not the umbrella
    # cycle). Operators MUST mirror dsa-pii-ml:0.5.1 specifically; bumping
    # LUCAIRN_IMAGE_TAG does NOT cascade to this service.
    # `bin/lucairn doctor --strict` enforces the pin against the recorded
    # digest below.
    image_tag: "0.5.1"
  dsa-veil-witness:
    image_tag: ""
  dsa-gateway:
    image_tag: ""

# Optional images used only when `--profile certification` or
# `--profile dashboard` is activated. These pull from the same registry but
# their tag publication cadence may differ. doctor does not warn on these
# unless the matching profile is selected.
#
# The dashboard ships on an INDEPENDENT release cadence from the dsa-*
# services. Operators MAY override the bundled default by exporting
# LUCAIRN_DASHBOARD_IMAGE_TAG in customer.env; doctor surfaces a warning if
# the env-resolved tag differs from the value pinned here.
optional_services:
  dsa-cert-builder:
    image_tag: ""
  dsa-cert-portal:
    image_tag: ""
  lucairn-dashboard:
    image_tag: "0.8.2"

# -----------------------------------------------------------------------------
# Digest pins (B1 Slice 3 — supply-chain provenance).
#
# Each entry records the exact `@sha256:` content digest the release was built +
# (for the signed Lucairn images) cosign-signed against. This block answers the
# procurement question "are your images digest-pinned and enforced?" WITHOUT
# rewriting compose/helm refs to `@sha256:` — that would break the operator's
# `LUCAIRN_IMAGE_TAG` / per-image-tag override ergonomics. Instead:
#
#   - compose/helm keep their `repository:tag` refs (override-friendly);
#   - `bin/lucairn doctor`           WARNS when an env-resolved tag's CURRENT
#                                    registry digest differs from the recorded
#                                    digest below (today's warn-only posture);
#   - `bin/lucairn doctor --strict`  BLOCKS (non-zero exit) on any such mismatch,
#                                    so a re-pointed / substituted / downgraded
#                                    tag fails the gate. `--strict` is the
#                                    enforcement switch; plain `doctor` never
#                                    blocks on a digest mismatch (back-compat).
#
# A digest mismatch under --strict means the mutable tag no longer points at the
# bytes this kit release was validated + signed against (tag re-point / image
# substitution / accidental downgrade). Resolution needs a registry digest
# resolver on PATH (docker buildx imagetools / crane / skopeo); --strict on a
# host with no resolver HARD-ERRORS (non-zero) — it refuses to report a green
# run it could not verify. (Plain `doctor` with no resolver SKIPS warn-only.)
#
# `signed_artifacts` digests are the SAME values recorded in
# keys/image-digests-<tag>.txt (the cosign-sign + `verify-images` source of
# truth); they are kept in lockstep. `verify-images` proves the SIGNATURE over
# the digest; `doctor --strict` proves the deployed TAG still resolves to that
# digest — complementary checks.
#
# `pending: true` entries have a schema slot but no recorded digest yet (filled
# during the digest-pin ceremony — see OPS.md § "Digest-pin enforcement
# (doctor --strict)"). doctor --strict SKIPS pending entries (warn, never
# block) so a fresh install is never broken by an un-filled slot.
#
# Format per entry:
#   <key>:
#     ref: "<repo>:<tag>"          # the mutable ref operators actually pull
#     digest: "sha256:<64hex>"     # the recorded content digest (or omit if pending)
#     pending: true                # OPTIONAL — schema-only slot, --strict skips
image_digests:
  # --- Signed Lucairn images (13 artifacts; cosign-signed + Rekor-logged;
  # --- digests mirror keys/image-digests-0.5.5.txt). doctor --strict
  # --- ENFORCES these (resolve tag->digest, block on mismatch).
  signed_artifacts:
    # Full 0.5.5 umbrella — all 12 dsa-* rebuilt multi-arch + cosign-signed
    # (GHCR + Rekor) from DSA main 168874d8 (2026-10-04); digests mirror
    # keys/image-digests-0.5.5.txt; verify with `lucairn verify-images --tag 0.5.5`.
    # (dsa-pii-ml stays pinned at 0.5.1 — independent release cadence;
    # lucairn-dashboard stays at 0.8.2.)
    dsa-gateway:
      ref: "ghcr.io/declade/dsa-gateway:0.5.5"
      digest: "sha256:b153d7582bfc3ffcfd88b8468b3d80236613aacac93a8bac4b4ce274fa641ae5"
    dsa-sanitizer:
      ref: "ghcr.io/declade/dsa-sanitizer:0.5.5"
      digest: "sha256:7a550230b2d47fbaec66d1066b25cc6c659c3a53d6ef19733d2c8970e63a8fb0"
    dsa-audit:
      ref: "ghcr.io/declade/dsa-audit:0.5.5"
      digest: "sha256:4e298c9a289ccd8e7ae8be07f70b97e842737e2599301f7acbe9630c067a2296"
    dsa-id-bridge:
      ref: "ghcr.io/declade/dsa-id-bridge:0.5.5"
      digest: "sha256:54127f714e2fdb864f266919da9f914fe155d2f0d131eea11857bed4112042cf"
    dsa-sandbox-a:
      ref: "ghcr.io/declade/dsa-sandbox-a:0.5.5"
      digest: "sha256:12224a7c1992e4d6170d9fb89212b3f5eefa0008a1b02445e92cbf8342daa66e"
    dsa-sandbox-b:
      ref: "ghcr.io/declade/dsa-sandbox-b:0.5.5"
      digest: "sha256:d50522bca7a60cced4da8514834892581cc0110ae88c98ed9b1bc8a9245926eb"
    dsa-pii-ml:
      # Multi-arch manifest list (linux/amd64 + linux/arm64) published from
      # PR #241's final state (commit 0cb627c, review round 1 fix-ups). Built on
      # the Hetzner pilot builder (lucairn-multiarch) 2026-06-07. Per-arch
      # manifest digests: amd64=sha256:7201de66279104328a8458478575ea603c00f5de35279be2f782544d41f7fce3,
      # arm64=sha256:6ef424e6ca467c240df622fa37b39bcee7b2aa2a602e2de8e10a405c07e2f09e.
      ref: "ghcr.io/declade/dsa-pii-ml:0.5.1"
      digest: "sha256:5cc46f58db9f0c84f6a8ed9428fe91a2a481ae0c6a3dfa3f02e4a607da80d1cc"
    dsa-veil-witness:
      ref: "ghcr.io/declade/dsa-veil-witness:0.5.5"
      digest: "sha256:2314d971d0cbccdbb63e6d5547a93c82ed634f8cafb0d5fd0bc55d6957d4f5ac"
    dsa-reid-guard:
      ref: "ghcr.io/declade/dsa-reid-guard:0.5.5"
      digest: "sha256:9f6525ef7c1eb643f286737c5c41ce7543062957ea8c3fe7f770999f8742b9c5"
    dsa-admin:
      ref: "ghcr.io/declade/dsa-admin:0.5.5"
      digest: "sha256:813d53a3aa2c35cb9fb7e08b1246f8d6deb15d8c543f682950a2805dc9cf7679"
    dsa-demo:
      ref: "ghcr.io/declade/dsa-demo:0.5.5"
      digest: "sha256:839250e15e86d83af4c8a9620c14c23309aec143d43c4a98356a55113c1f0773"
    dsa-ingest:
      ref: "ghcr.io/declade/dsa-ingest:0.5.5"
      digest: "sha256:a339a270150e6378029b3153567abcc5aee8ae26383d0c55f22d6938a485578b"
    dsa-llm-auditor:
      ref: "ghcr.io/declade/dsa-llm-auditor:0.5.5"
      digest: "sha256:ab97c803d10fd0957a25838f60ab80c15a42c818a1a740b92d5b291be80e7a9a"
    lucairn-dashboard:
      ref: "ghcr.io/declade/lucairn-dashboard:0.8.2"
      digest: "sha256:a586b88991ac5d71cf6523b833462648775b1e97a66cbee67876e9f992f0387e"
  # --- PII-plane runtime (sandbox-a / sandbox-b L3 shield). ollama-identity is
  # --- the load-bearing L3 image and is ALSO digest-pinned in the chart
  # --- (charts/lucairn/charts/sandbox-a/values.yaml ollamaIdentity.image.digest);
  # --- the value here is the SAME multi-arch index digest. The L3 MODEL
  # --- (qwen2.5:7b) is an Ollama model manifest, not an OCI image — its digest
  # --- comes from `ollama pull qwen2.5:7b` at ceremony time, so it is pending.
  pii_plane:
    ollama-identity:
      ref: "ollama/ollama:0.6.2"
      digest: "sha256:74a0929e1e082a09e4fdeef8594b8f4537f661366a04080e600c90ea9f712721"
    qwen2.5-7b-model:
      ref: "ollama://qwen2.5:7b"
      pending: true   # Ollama model digest — fill via `ollama pull qwen2.5:7b` at the digest-pin ceremony
    # PRD B — FAST L3 runtime (docker-compose.self-hosted.yml
    # model-runtime-vllm-l3, profiles: ["vllm-l3"]). OPT-IN native-Linux-GPU
    # alternative to ollama-identity for the sanitizer's L3 shield. Pinned by
    # DIGEST (official vLLM image bundles matched CUDA/torch/kernels). Unlike the
    # AI-plane `runtime.vllm` entry below (mutable :latest, operator-selected
    # inference model), this identity-plane entry is a KNOWN, digest-pinned L3
    # shield image. The MODEL is a Hugging Face repo pinned by revision, NOT an
    # OCI image, so the digest-checker treats its `hf://` entry as informational/
    # pending. Instead, `bin/lucairn doctor --strict` asserts (B-E2) that the
    # `revision:` below byte-equals the compose `--revision` on the
    # model-runtime-vllm-l3 service — a static compose↔manifest consistency check
    # that fails closed on drift (the served revision can't be probed; the
    # endpoint is on the internal net).
    vllm-l3:
      ref: "vllm/vllm-openai:v0.10.2"
      digest: "sha256:607442e407b0fea97f8a132a78b787c121a996dd4de181fa08e8da06e71ec2db"
    qwen2.5-7b-awq-model:
      ref: "hf://Qwen/Qwen2.5-7B-Instruct-AWQ"
      # HF commit revision the vllm-l3 runtime pulls (--revision). Resolved
      # 2026-07-23 via the HF API. MUST byte-equal the compose `--revision` on
      # model-runtime-vllm-l3 (doctor --strict B-E2 enforces this). Re-pin BOTH
      # together at the digest-pin ceremony if the recall gate is re-run against a
      # newer revision. Pinned to an exact commit, not a floating branch.
      revision: "b25037543e9394b818fdfca67ab2a00ecc7dd641"
  # --- Enterprise Kind default-topology dependencies. These are the exact
  # third-party OCI index digests used by the disposable Helm mTLS acceptance
  # render; the preloader verifies each resolved tag against this release
  # record before it permits docker save or Kind import.
  enterprise_kind:
    postgres:
      ref: "postgres:16-alpine"
      # RE-PINNED 2026-09-19 (T-791): upstream re-pointed the moving
      # `16-alpine` tag (previous index digest
      # sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777).
      # This is a RE-PIN to what upstream publishes today, NOT a re-validation:
      # the kit's acceptance suite has not been re-run against these bytes.
      # Resolved independently via the Docker Registry v2 API (anonymous pull
      # token + Accept: application/vnd.oci.image.index.v1+json — the same
      # multi-arch index digest `docker buildx imagetools inspect` reports) and
      # cross-checked against the Docker Hub v2 tags API (identical digest,
      # last_pushed 2026-09-18). Image config env PG_VERSION=16.15 confirms
      # this is the genuine official PostgreSQL 16.15 minor release (upstream
      # released 2026-08-13: https://www.postgresql.org/docs/16/release-16-15.html),
      # repackaged onto the moving `16-alpine` Alpine base by Docker Official
      # Images (`library/postgres` namespace).
      # RE-PINNED 2026-09-22 (T-831): upstream re-pointed the moving `16-alpine`
      # tag again on 2026-09-21 (previous index digest sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb).
      # This is a RE-PIN to what upstream publishes today, NOT a re-validation:
      # the kit's acceptance suite has not been re-run against these bytes.
      # Resolved from three matching observations against ONE trust authority,
      # Docker Hub (not independent sources): `docker buildx imagetools
      # inspect`, the Docker Hub v2 tags API (last_updated
      # 2026-09-21T04:07Z), and the kit CI's own resolver log. Image config env
      # PG_VERSION=16.15 read via the Docker Registry v2 API (library/postgres).
      digest: "sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
    redis:
      ref: "redis:7-alpine"
      # RE-PINNED 2026-09-19 (T-791): upstream re-pointed the moving `7-alpine`
      # tag AGAIN (previous index digest
      # sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2,
      # itself the 2026-07-27 re-pin from board T-159). Resolved + cross-checked
      # the same way as postgres above (Docker Registry v2 API + Docker Hub v2
      # tags API agree; last_pushed 2026-09-18). Image config env
      # REDIS_VERSION=7.4.11 confirms this is the genuine official Redis 7.4.11
      # SECURITY release (upstream released 2026-08-17 — use-after-free / ACL
      # bypass / RCE-class fixes:
      # https://raw.githubusercontent.com/redis/redis/7.4/00-RELEASENOTES),
      # repackaged onto the moving `7-alpine` Alpine base by Docker Official
      # Images (`library/redis` namespace).
      # NOTE: `7-alpine` and `16-alpine` are moving tags by design, so both
      # pins WILL drift again on the next upstream patch and redden CI until
      # re-pinned (migrate is version-pinned and stable). See board T-791.
      # RE-PINNED 2026-09-22 (T-831): upstream re-pointed the moving `7-alpine`
      # tag again on 2026-09-21 (previous index digest sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7).
      # This is a RE-PIN to what upstream publishes today, NOT a re-validation.
      # Resolved from three matching observations against ONE trust authority,
      # Docker Hub (not independent sources): `docker buildx imagetools
      # inspect`, the Docker Hub v2 tags API (last_updated
      # 2026-09-21T12:04Z), and the kit CI's own resolver log. Image config env
      # REDIS_VERSION=7.4.11 read via the Docker Registry v2 API (library/redis).
      digest: "sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"
    migrate:
      ref: "migrate/migrate:v4.17.0"
      digest: "sha256:4d017c6fb5997127093648cab09e63d377997125c3d3dcca18e5d1c847da49fa"
  # --- Self-hosted runtime alternatives (docker-compose.self-hosted.yml). These
  # --- are OPT-IN (the operator selects ONE) and several float a mutable :latest
