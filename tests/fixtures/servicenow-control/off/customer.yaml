  sanitizer-core:
    cap_drop:
      - ALL
    command:
      - serve
      - --listen=sanitizer-core:8790
      - --registry-dsn-file=/run/secrets/sanitizer-core/registry-dsn
      - --sidecar=http://127.0.0.1:8765
    depends_on:
      postgres-sanitizer-core:
        condition: service_healthy
        required: true
      sanitizer-core-sidecar:
        condition: service_healthy
        required: true
      witness-egress-guard:
        condition: service_completed_successfully
        required: true
    deploy:
      resources:
        limits:
          memory: "1073741824"
    entrypoint:
      - /bin/sh
      - -c
      - |
        h=http://127.0.0.1:8765/v1/health
        trap 'exit 0' TERM INT
        n=0
        until wget -q -T 5 -O /dev/null "$$h"; do
          [ $$((n % 15)) -eq 0 ] && echo "core-entrypoint: waiting for the model sidecar ($$h)" >&2
          n=$$((n + 1)); sleep 2
        done
        echo "core-entrypoint: sidecar answers, starting the core" >&2
        sanitizer-core "$$@" &
        pid=$$!
        stop=0
        trap 'stop=1; kill -TERM $$pid 2>/dev/null' TERM INT
        i=0; miss=0
        while [ $$stop -eq 0 ] && kill -0 $$pid 2>/dev/null; do
          sleep 2 & wait $$!
          i=$$((i + 1)); [ $$((i % 5)) -eq 0 ] || continue
          if wget -q -T 5 -O /dev/null "$$h"; then miss=0; else miss=$$((miss + 1)); fi
          if [ $$miss -ge 3 ]; then
            echo "core-entrypoint: sidecar unreachable 3 checks in a row - stopping the core (the restart re-joins the sidecar)" >&2
            kill -TERM $$pid 2>/dev/null; wait $$pid; exit 70
          fi
        done
        wait $$pid
      - sanitizer-core-entrypoint
    environment:
      DSA_ENV: production
      DSA_SANITIZER_CORE_REGISTRY_KEY: k1-synthetic
