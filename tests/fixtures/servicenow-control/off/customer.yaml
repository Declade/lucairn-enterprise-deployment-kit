name: k1-off
services:
  audit:
    depends_on:
      migrate-audit:
        condition: service_completed_successfully
        required: true
      witness-egress-guard:
        condition: service_completed_successfully
        required: true
    environment:
      AUDIT_DATABASE_URL: postgres://audit_app:k1-synthetic@postgres-audit:5432/audit?sslmode=disable
      DSA_ENV: production
      DSA_SERVICE_TOKEN: k1-synthetic
      GRPC_TLS_ENABLED: "true"
      LCR_ENABLED: "true"
      LCR_SIGNING_KEY: ""
      LCR_WITNESS_ADDR: veil-witness:50057
      LCR_WITNESS_MTLS_CA_BUNDLE_PATH: ""
      LCR_WITNESS_MTLS_CLIENT_CERT_PATH: ""
      LCR_WITNESS_MTLS_CLIENT_KEY_PATH: ""
      LCR_WITNESS_REQUIRE_MTLS: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8081/healthz || exit 1
      timeout: 3s
      interval: 5s
      retries: 10
    image: ghcr.io/declade/dsa-audit:1.1.0
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-audit: null
      dsa-audit-identity: null
      dsa-witness-audit: null
    restart: on-failure
  audit-claim-delivery-retention:
    cap_drop:
      - ALL
    depends_on:
      migrate-audit:
        condition: service_completed_successfully
        required: true
    entrypoint:
      - /bin/sh
      - /scripts/audit-claim-delivery-retention.sh
    environment:
      HOME: /tmp
      LUCAIRN_AUDIT_CLAIM_DELIVERY_RETENTION_DAYS: "30"
      LUCAIRN_AUDIT_CLAIM_DELIVERY_RETENTION_ENABLED: "true"
      LUCAIRN_AUDIT_CLAIM_DELIVERY_RETENTION_INTERVAL_SECONDS: "86400"
      PGDATABASE: audit
      PGHOST: postgres-audit
      PGPASSWORD: k1-synthetic
      PGPORT: "5432"
      PGSSLMODE: disable
      PGUSER: dsa
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-audit: null
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: 65534:65534
    volumes:
      - type: bind
        source: ./scripts/audit-claim-delivery-retention.sh
        target: /scripts/audit-claim-delivery-retention.sh
        read_only: true
        bind: {}
  gateway:
    depends_on:
      id-bridge:
        condition: service_healthy
        required: true
      sandbox-a:
        condition: service_healthy
        required: true
      sanitizer-core:
        condition: service_healthy
        required: true
      witness-egress-guard:
        condition: service_completed_successfully
        required: true
    environment:
      AUDIT_SERVICE_ADDR: audit:50051
      BRIDGE_HEALTH_ADDR: id-bridge:8082
      BRIDGE_SERVICE_ADDR: id-bridge:50052
      CANARY_HMAC_KEY: k1-synthetic
      DSA_ADMIN_KEY: k1-synthetic
      DSA_ENV: production
      DSA_LICENSE_KEY: ""
      DSA_LICENSE_SIGNING_KEY: ""
      DSA_SERVICE_TOKEN: k1-synthetic
      GATEWAY_ADDED_PARTS_PLACEMENT: message
      GATEWAY_BASE_URL: http://localhost:8080
      GATEWAY_KEYSTORE_KEY: k1-synthetic
      GATEWAY_KEYSTORE_PATH: /data/keystore.json
      GATEWAY_SANITIZER_GATE_POSTURE: enforce
      GATEWAY_SANITIZER_GATE_ROUTE_POSTURE: observe
      GATEWAY_SANITIZER_PROTOCOL: delta
      GATEWAY_TMS_TRUST_ZONES: ""
      GATEWAY_TOOL_SCHEMA_GUARD: refuse
      GATEWAY_TRUSTED_PROXY_CIDRS: ""
      GATEWAY_USER_UNREDACTED_ENABLED: "false"
      GATEWAY_VERTICALS_DIR: /etc/dsa/starter-templates
      GATEWAY_WAIT_TIMEOUT: "120"
      GRPC_TLS_ENABLED: "true"
      IDENTITY_SERVICE_ADDR: sandbox-a:50053
      LCR_AUDIT_PUBLIC_KEY: ""
      LCR_BRIDGE_PUBLIC_KEY: ""
      LCR_ENABLED: "true"
      LCR_GATEWAY_MANIFEST_PUBLIC_KEY: ""
      LCR_GATEWAY_PUBLIC_KEY: ""
      LCR_GATEWAY_SIGNING_KEY: ""
      LCR_ISSUER: Lucairn Veil Witness
      LCR_MANIFEST_SIGNING_KEY: ""
      LCR_MANIFEST_SIGNING_KEY_ID: gateway_manifest_v1
      LCR_SANDBOX_B_PUBLIC_KEY: ""
      LCR_SANITIZER_PUBLIC_KEY: ""
      LCR_WITNESS_ADDR: veil-witness:50057
      LCR_WITNESS_CERT_ADDR: veil-witness:50058
      LCR_WITNESS_MANIFEST_PUBLIC_KEY: ""
      LCR_WITNESS_MTLS_CA_BUNDLE_PATH: ""
      LCR_WITNESS_MTLS_CLIENT_CERT_PATH: ""
      LCR_WITNESS_MTLS_CLIENT_KEY_PATH: ""
      LCR_WITNESS_PUBLIC_KEY: ""
      LCR_WITNESS_REQUIRE_MTLS: "false"
      LCR_WITNESS_SIGNED_MANIFEST_PATH: /certs/witness-signed-manifest.json
      LUCAIRN_LICENSE_GRACE_DAYS: "14"
      LUCAIRN_LICENSE_KEY: ""
      LUCAIRN_LICENSE_PUBLIC_KEY: ""
      LUCAIRN_RESOURCE_BASE_URL: ""
      SANDBOX_A_INVARIANT_URL: http://sandbox-a:8083/invariant
      SANDBOX_B_API_KEY: ""
      SANDBOX_B_CA_CERT: ""
      SANDBOX_B_CLIENT_CERT: ""
      SANDBOX_B_CLIENT_KEY: ""
      SANDBOX_B_MESSAGES_JSON_MAX_BYTES: ""
      SANDBOX_B_REMOTE_ENDPOINT: ""
      SANITIZE_CACHE_ENABLED: "false"
      SANITIZER_CORE_MTLS_CA_BUNDLE_PATH: /etc/sanitizer-core-mtls/ca.crt
      SANITIZER_CORE_MTLS_CLIENT_CERT_PATH: /etc/sanitizer-core-mtls/dsa-gateway.crt
      SANITIZER_CORE_MTLS_CLIENT_KEY_PATH: /etc/sanitizer-core-mtls/dsa-gateway.key
      SANITIZER_CORE_URL: https://sanitizer-core:8790
      SANITIZER_URL: http://sanitizer:8086
      STREAMING_ENABLED: "false"
      SUPABASE_URL: ""
      WITNESS_MTLS_CA_BUNDLE_PATH: ""
      WITNESS_MTLS_CLIENT_CERT_PATH: ""
      WITNESS_MTLS_CLIENT_KEY_PATH: ""
      WITNESS_MTLS_SERVER_NAME: witness
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8085/healthz || exit 1
      timeout: 3s
      interval: 5s
      retries: 10
    image: ghcr.io/declade/dsa-gateway:1.1.0
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-audit-identity: null
      dsa-bridge: null
      dsa-identity: null
      dsa-sanitizer-core-ingress: null
      dsa-witness-edge: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "8080"
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8085
        published: "8085"
        protocol: tcp
    restart: on-failure
    volumes:
      - type: bind
        source: ./starter-templates
        target: /etc/dsa/starter-templates
        read_only: true
        bind: {}
      - type: volume
        source: gateway-data
        target: /data
        volume: {}
      - type: bind
        source: ./.certs
        target: /certs
        read_only: true
        bind: {}
      - type: bind
        source: ./.certs/witness-mtls
        target: /etc/witness-mtls
        read_only: true
        bind: {}
      - type: bind
        source: ./.certs/sanitizer-core-mtls/gateway
        target: /etc/sanitizer-core-mtls
        read_only: true
        bind: {}
  id-bridge:
    depends_on:
      audit:
        condition: service_healthy
        required: true
      migrate-bridge:
        condition: service_completed_successfully
        required: true
      witness-egress-guard:
        condition: service_completed_successfully
        required: true
    environment:
      BRIDGE_DATABASE_URL: postgres://dsa:k1-synthetic@postgres-bridge:5432/bridge?sslmode=disable
      BRIDGE_EPHEMERAL: "true"
      BRIDGE_MASTER_KEY: ""
      DSA_BRIDGE_ENCRYPTION_KEY: k1-synthetic
      DSA_ENV: production
      DSA_SERVICE_TOKEN: k1-synthetic
      GRPC_TLS_ENABLED: "true"
      LCR_ENABLED: "true"
      LCR_SIGNING_KEY: ""
      LCR_WITNESS_ADDR: veil-witness:50057
      LCR_WITNESS_MTLS_CA_BUNDLE_PATH: ""
      LCR_WITNESS_MTLS_CLIENT_CERT_PATH: ""
      LCR_WITNESS_MTLS_CLIENT_KEY_PATH: ""
      LCR_WITNESS_REQUIRE_MTLS: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8082/healthz || exit 1
      timeout: 3s
      interval: 5s
      retries: 10
    image: ghcr.io/declade/dsa-id-bridge:1.1.0
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-bridge: null
      dsa-witness-bridge: null
    restart: on-failure
  migrate-audit:
    depends_on:
      postgres-audit:
        condition: service_healthy
        required: true
      prep-migrations:
        condition: service_completed_successfully
        required: true
    entrypoint:
      - /bin/sh
      - /scripts/migrate-capped.sh
    environment:
      DATABASE_URL: postgres://dsa:k1-synthetic@postgres-audit:5432/audit?sslmode=disable
      MIGRATE_CEILING_FILE: /scripts/migration-ceilings.conf
      MIGRATE_CEILING_KEY: AUDIT
      MIGRATE_LABEL: migrate-audit
      MIGRATE_PATH: /migrations/audit
      MIGRATE_TARGET_VERSION: "7"
      MIGRATE_UNSAFE_ACKNOWLEDGE_OPEN_ENDED_MIGRATE_UP: "false"
    image: migrate/migrate:v4.17.0@sha256:4d017c6fb5997127093648cab09e63d377997125c3d3dcca18e5d1c847da49fa
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-audit: null
    restart: 'no'
    volumes:
      - type: volume
        source: rendered-migrations
        target: /migrations
        read_only: true
        volume: {}
      - type: bind
        source: ./scripts/migrate-capped.sh
        target: /scripts/migrate-capped.sh
        read_only: true
        bind: {}
      - type: bind
        source: ./scripts/migration-ceilings.conf
        target: /scripts/migration-ceilings.conf
        read_only: true
        bind: {}
  migrate-bridge:
    depends_on:
      postgres-bridge:
        condition: service_healthy
        required: true
      prep-migrations:
        condition: service_completed_successfully
        required: true
    entrypoint:
      - /bin/sh
      - /scripts/migrate-capped.sh
    environment:
      DATABASE_URL: postgres://dsa:k1-synthetic@postgres-bridge:5432/bridge?sslmode=disable
      MIGRATE_CEILING_FILE: /scripts/migration-ceilings.conf
      MIGRATE_CEILING_KEY: ID_BRIDGE
      MIGRATE_LABEL: migrate-bridge
      MIGRATE_PATH: /migrations/id-bridge
      MIGRATE_TARGET_VERSION: "4"
      MIGRATE_UNSAFE_ACKNOWLEDGE_OPEN_ENDED_MIGRATE_UP: "false"
    image: migrate/migrate:v4.17.0@sha256:4d017c6fb5997127093648cab09e63d377997125c3d3dcca18e5d1c847da49fa
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-bridge: null
    restart: 'no'
    volumes:
      - type: volume
        source: rendered-migrations
        target: /migrations
        read_only: true
        volume: {}
      - type: bind
        source: ./scripts/migrate-capped.sh
        target: /scripts/migrate-capped.sh
        read_only: true
        bind: {}
      - type: bind
        source: ./scripts/migration-ceilings.conf
        target: /scripts/migration-ceilings.conf
        read_only: true
        bind: {}
  migrate-sandbox-a:
    depends_on:
      postgres-sandbox-a:
        condition: service_healthy
        required: true
      prep-migrations:
        condition: service_completed_successfully
        required: true
    entrypoint:
      - /bin/sh
      - /scripts/migrate-capped.sh
    environment:
      DATABASE_URL: postgres://dsa:k1-synthetic@postgres-sandbox-a:5432/sandbox_a?sslmode=disable
      MIGRATE_CEILING_FILE: /scripts/migration-ceilings.conf
      MIGRATE_CEILING_KEY: SANDBOX_A
      MIGRATE_LABEL: migrate-sandbox-a
      MIGRATE_PATH: /migrations/sandbox-a
      MIGRATE_TARGET_VERSION: "8"
      MIGRATE_UNSAFE_ACKNOWLEDGE_OPEN_ENDED_MIGRATE_UP: "false"
    image: migrate/migrate:v4.17.0@sha256:4d017c6fb5997127093648cab09e63d377997125c3d3dcca18e5d1c847da49fa
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-identity: null
    restart: 'no'
    volumes:
      - type: volume
        source: rendered-migrations
        target: /migrations
        read_only: true
        volume: {}
      - type: bind
        source: ./scripts/migrate-capped.sh
        target: /scripts/migrate-capped.sh
        read_only: true
        bind: {}
      - type: bind
        source: ./scripts/migration-ceilings.conf
        target: /scripts/migration-ceilings.conf
        read_only: true
        bind: {}
  migrate-veil:
    depends_on:
      postgres-veil:
        condition: service_healthy
        required: true
      prep-migrations:
        condition: service_completed_successfully
        required: true
    entrypoint:
      - /bin/sh
      - /scripts/migrate-capped.sh
    environment:
      DATABASE_URL: postgres://veil:k1-synthetic@postgres-veil:5432/veil?sslmode=disable
      MIGRATE_CEILING_FILE: /scripts/migration-ceilings.conf
      MIGRATE_CEILING_KEY: VEIL_WITNESS
      MIGRATE_LABEL: migrate-veil
      MIGRATE_PATH: /migrations/veil-witness
      MIGRATE_TARGET_VERSION: "10"
      MIGRATE_UNSAFE_ACKNOWLEDGE_OPEN_ENDED_MIGRATE_UP: "false"
    image: migrate/migrate:v4.17.0@sha256:4d017c6fb5997127093648cab09e63d377997125c3d3dcca18e5d1c847da49fa
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-witness: null
    restart: 'no'
    volumes:
      - type: volume
        source: rendered-migrations
        target: /migrations
        read_only: true
        volume: {}
      - type: bind
        source: ./scripts/migrate-capped.sh
        target: /scripts/migrate-capped.sh
        read_only: true
        bind: {}
      - type: bind
        source: ./scripts/migration-ceilings.conf
        target: /scripts/migration-ceilings.conf
        read_only: true
        bind: {}
  postgres-audit:
    environment:
      POSTGRES_DB: audit
      POSTGRES_PASSWORD: k1-synthetic
      POSTGRES_USER: dsa
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dsa -d audit
      timeout: 3s
      interval: 5s
      retries: 10
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-audit: null
    volumes:
      - type: volume
        source: pg-audit-data
        target: /var/lib/postgresql/data
        volume: {}
  postgres-bridge:
    environment:
      POSTGRES_DB: bridge
      POSTGRES_PASSWORD: k1-synthetic
      POSTGRES_USER: dsa
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dsa -d bridge
      timeout: 3s
      interval: 5s
      retries: 10
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-bridge: null
    volumes:
      - type: volume
        source: pg-bridge-data
        target: /var/lib/postgresql/data
        volume: {}
  postgres-sandbox-a:
    environment:
      POSTGRES_DB: sandbox_a
      POSTGRES_PASSWORD: k1-synthetic
      POSTGRES_USER: dsa
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dsa -d sandbox_a
      timeout: 3s
      interval: 5s
      retries: 10
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-identity: null
    volumes:
      - type: volume
        source: pg-sandbox-a-data
        target: /var/lib/postgresql/data
        volume: {}
  postgres-sanitizer-core:
    environment:
      POSTGRES_DB: sanitizer_core
      POSTGRES_PASSWORD: k1-synthetic
      POSTGRES_USER: dsa
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dsa -d sanitizer_core
      timeout: 3s
      interval: 5s
      retries: 10
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-sanitizer-core: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: pg-sanitizer-core-data
        target: /var/lib/postgresql/data
        volume: {}
  postgres-veil:
    environment:
      POSTGRES_DB: veil
      POSTGRES_PASSWORD: k1-synthetic
      POSTGRES_USER: veil
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U veil
      timeout: 3s
      interval: 5s
      retries: 5
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-witness: null
    volumes:
      - type: volume
        source: postgres-veil-data
        target: /var/lib/postgresql/data
        volume: {}
  prep-migrations:
    command:
      - /bin/sh
      - /scripts/render-migrations.sh
    environment:
      AUDIT_APP_PASSWORD: k1-synthetic
      VEIL_APP_PASSWORD: k1-synthetic
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      default: null
    restart: 'no'
    volumes:
      - type: bind
        source: ./migrations
        target: /migrations-src
        read_only: true
        bind: {}
      - type: bind
        source: ./scripts/render-migrations.sh
        target: /scripts/render-migrations.sh
        read_only: true
        bind: {}
      - type: volume
        source: rendered-migrations
        target: /migrations-rendered
        volume: {}
  redis-sanitizer:
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
      interval: 5s
      retries: 5
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-identity: null
    restart: on-failure
  redis-sanitizer-cache:
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
      interval: 5s
      retries: 5
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-identity: null
    restart: on-failure
  sandbox-a:
    depends_on:
      audit:
        condition: service_healthy
        required: true
      migrate-sandbox-a:
        condition: service_completed_successfully
        required: true
    environment:
      AUDIT_SERVICE_ADDR: audit:50051
      DSA_ADMIN_KEY: k1-synthetic
      DSA_ENV: production
      DSA_SERVICE_TOKEN: k1-synthetic
      GRPC_TLS_ENABLED: "true"
      SANDBOX_A_DATABASE_URL: postgres://dsa:k1-synthetic@postgres-sandbox-a:5432/sandbox_a?sslmode=disable
      SANDBOX_A_ENCRYPTION_KEY: ""
      SANDBOX_A_EPHEMERAL: "true"
      SANITIZER_ADDR: http://sanitizer:8086
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8083/healthz || exit 1
      timeout: 3s
      interval: 5s
      retries: 10
    image: ghcr.io/declade/dsa-sandbox-a:1.1.0
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 50m
    networks:
      dsa-audit-identity: null
      dsa-identity: null
    restart: on-failure
  sanitizer:
    depends_on:
      sandbox-a:
        condition: service_healthy
        required: true
      witness-egress-guard:
        condition: service_completed_successfully
        required: true
    deploy:
      resources:
        limits:
          memory: "4294967296"
    environment:
      CANARY_HMAC_KEY: k1-synthetic
      DP_BUDGET_REDIS_URL: redis://redis-sanitizer:6379/0
      DSA_ENV: production
      GUNICORN_TIMEOUT: "120"
      LCR_ENABLED: "true"
      LCR_SIGNING_KEY: ""
      LCR_WITNESS_ADDR: veil-witness:50057
      LCR_WITNESS_MTLS_CA_BUNDLE_PATH: ""
      LCR_WITNESS_MTLS_CLIENT_CERT_PATH: ""
