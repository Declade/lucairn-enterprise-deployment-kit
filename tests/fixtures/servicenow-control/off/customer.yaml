      SANITIZER_CORE_MTLS_SERVER_CERT_PATH: /etc/sanitizer-core-mtls/dsa-sanitizer-core.crt
      SANITIZER_CORE_MTLS_SERVER_KEY_PATH: /etc/sanitizer-core-mtls/dsa-sanitizer-core.key
