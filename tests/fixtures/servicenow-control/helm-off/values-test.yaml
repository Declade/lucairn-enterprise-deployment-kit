# Source: lucairn/charts/audit/templates/migration-job.yaml
# Migration Job uses .Release.Revision-suffixed name so each helm release
# creates a NEW Job resource. Kubernetes treats Job spec.template as
# immutable for existing resources; versioned names sidestep the
# immutability constraint while keeping migrations as normal resources
# that apply in the regular install order (after Secrets + Postgres +
# Phase-2 imagePullSecret replication).
apiVersion: batch/v1
kind: Job
metadata:
  name: audit-migrate-r1
  namespace: dsa-audit
  labels:
    app.kubernetes.io/name: audit-migrate
    app.kubernetes.io/part-of: dsa
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-migrate
    spec:
      # NET-05: this pod never calls the Kubernetes API; using the
      # namespace default ServiceAccount it would still auto-mount an
      # unused token. Disable the mount at the pod level.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      initContainers:
        - name: render-migrations
          # Run from the audit image so the baked-in /migrations source tree
          # is available. cp into the shared volume, then sed-substitute the
          # historical literal 'audit_app_password' with the operator-supplied
          # value. Mirrors scripts/render-migrations.sh in the Compose path.
          image: "ghcr.io/declade/dsa-audit:0.1.0"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -z "${AUDIT_APP_PASSWORD:-}" ]; then
                echo "render-migrations: AUDIT_APP_PASSWORD is empty — refusing to render" >&2
                exit 2
              fi
              case "${AUDIT_APP_PASSWORD}" in
                *\'*) echo "render-migrations: AUDIT_APP_PASSWORD contains a single quote — refusing (would break SQL string / open SQL injection)" >&2; exit 3 ;;
              esac
              case "${AUDIT_APP_PASSWORD}" in
                *\\*) echo "render-migrations: AUDIT_APP_PASSWORD contains a backslash — refusing (would break SQL string-escape)" >&2; exit 3 ;;
              esac
              cp -r /migrations /shared/migrations
              # `|` delimiter avoids the `/` collision; trailing-g unnecessary
              # because the literal appears at most twice (one CREATE + one
              # ALTER) and both should be substituted.
              sed -i "s|'audit_app_password'|'${AUDIT_APP_PASSWORD}'|g" \
                /shared/migrations/000003_least_privilege_role.up.sql
              echo "render-migrations: audit rendered" >&2
          env:
            - name: AUDIT_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-credentials
                  key: AUDIT_APP_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /shared
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: wait-and-migrate
          image: migrate/migrate:v4.17.0
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Waiting for PostgreSQL..."
              until nc -z audit-postgresql 5432; do
                sleep 2
              done
              echo "PostgreSQL ready."
              
              # ── T-350 migration version cap ────────────────────────────────────────────
              # Rendered from audit.migrations (chart ceiling: 7).
              # The Job spec sets no MIGRATE_PATH env, so in a cluster this is always the
              # literal below. The indirection exists so the guard suite can execute THIS
              # rendered body verbatim against a fixture directory — the Helm body is a second
              # hand-maintained copy of the algorithm and a grep cannot prove it runs.
              MIGRATE_PATH="${MIGRATE_PATH:-/shared/migrations}"
              highest_on_disk="$(ls "$MIGRATE_PATH" 2>/dev/null | grep -E '^[0-9]{6}_.*\.up\.sql$' | cut -c1-6 | sort -n | tail -1 | sed 's/^0*//')"
              [ -n "$highest_on_disk" ] || highest_on_disk=0
              
              MIGRATE_TARGET_VERSION='7'
              
              # Fail-closed: anything unparseable applies NOTHING. It never degrades to `up`.
              case "$MIGRATE_TARGET_VERSION" in
                ''|*[!0-9]*)
                  echo "FATAL: audit.migrations.targetVersion is not a positive integer (got '${MIGRATE_TARGET_VERSION}'). Applying NO migrations. See docs/RELEASING.md § Migration review (T-350)." >&2
                  exit 90 ;;
              esac
              # `|| fatal` rather than `if [ ... -lt 1 ]`: an errored `[` (a value the shell
              # cannot compare) makes the `if` FALSE and falls THROUGH to the migrate call,
              # whereas the `||` form fires. The Compose twin already used this shape; the two
              # are supposed to be behaviourally identical and were not.
              [ "$MIGRATE_TARGET_VERSION" -ge 1 ] || {
                echo "FATAL: audit.migrations.targetVersion must be >= 1 (got '${MIGRATE_TARGET_VERSION}'). Applying NO migrations. See docs/RELEASING.md § Migration review (T-350)." >&2
                exit 90
              }
              
              # `migrate version` writes to stdout or stderr depending on build/verbosity and
              # exits non-zero on a fresh database, so capture both streams and never let it
              # trip `set -e`.
              ver_out="$(migrate -path="$MIGRATE_PATH" -database="$DATABASE_URL" version 2>&1 || true)"
              # Measured: on a URL-parse error `migrate version` echoes the DSN back verbatim,
              # password and all (e.g. `parse "postgres://veil:SUPER SECRET PW@host:5432/db":
              # net/url: invalid userinfo`). Every branch below quotes $ver_out into a log
              # line, so scrub any `scheme://user:pass@` credential before it can be printed.
              ver_out="$(printf '%s' "$ver_out" | sed 's#://[^/]*@#://***:***@#g')"
              
              # Match the LEDGER STATE, not a substring. golang-migrate renders a dirty
              # ledger as `<N> (dirty)`; a query-level failure renders as
              # `<err> in line 0: <sql>` and that SQL contains the column name `dirty`
              # (measured: `pq: permission denied ... (version bigint ..., dirty boolean ...)`).
              # A substring match therefore reported every permission/timeout/reset error as a
              # dirty ledger and told the operator to run `migrate force`, which rewrites the
              # ledger without running anything. Query errors now fall through to the
              # unparseable branch below and exit 93 instead.
              case "$ver_out" in
                *[0-9]" (dirty)"*|*[0-9]" (Dirty)"*|*[0-9]" (DIRTY)"*)
                  echo "FATAL: schema_migrations is DIRTY ('${ver_out}'). A previous migration failed half-way. Applying NO migrations — resolve the dirty state deliberately (migrate force <version>) before re-running. (T-350)" >&2
                  exit 92 ;;
              esac
              
              current="$(printf '%s' "$ver_out" | tr -d '[:space:]')"
              case "$current" in
                ''|*[!0-9]*)
                  case "$ver_out" in
                    *"no migration"*|*"No migration"*|*"nil version"*) current=0 ;;
                    *)
                      echo "FATAL: cannot determine the current schema version; 'migrate version' said: '${ver_out}'. Applying NO migrations. (T-350)" >&2
                      exit 93 ;;
                  esac ;;
                *)
                  current="$(printf '%s' "$current" | sed 's/^0*//')"
                  [ -n "$current" ] || current=0 ;;
              esac
              
              if [ "$highest_on_disk" -gt "$MIGRATE_TARGET_VERSION" ]; then
                echo "NOTICE: the service image ships migrations up to version ${highest_on_disk}, but this kit release is capped at ${MIGRATE_TARGET_VERSION}. Versions above the cap will NOT be applied — that is deliberate (board T-350). Raising the cap is a kit-release decision that requires reviewing their personal-data retention impact first: see docs/RELEASING.md § Migration review." >&2
              fi
              
              if [ "$current" -ge "$MIGRATE_TARGET_VERSION" ]; then
                echo "Schema is at version ${current}; cap is ${MIGRATE_TARGET_VERSION}. Nothing to apply. This job NEVER migrates down."
                exit 0
              fi
              
              if [ "$MIGRATE_TARGET_VERSION" -gt "$highest_on_disk" ]; then
                echo "FATAL: cap is ${MIGRATE_TARGET_VERSION} but the service image's migrations directory only reaches version ${highest_on_disk}. Chart and image disagree — applying NO migrations rather than guessing. Pin an image that carries the migrations this chart expects, or lower audit.migrations.targetVersion. (T-350)" >&2
                exit 94
              fi
              
              echo "Applying migrations ${current} -> ${MIGRATE_TARGET_VERSION} (capped; open-ended migration is disabled — T-350)."
              exec migrate -path="$MIGRATE_PATH" -database="$DATABASE_URL" goto "$MIGRATE_TARGET_VERSION"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: audit-credentials
                  key: DATABASE_URL
          volumeMounts:
            - name: migrations
              mountPath: /shared
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: migrations
          emptyDir: {}
      restartPolicy: Never
---
