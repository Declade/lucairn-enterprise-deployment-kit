apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: witness-egress
  namespace: dsa-witness
  labels:
    app.kubernetes.io/part-of: dsa
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # External HTTPS only (TSA + Rekor transparency log)
    # Private IPs excluded — Witness cannot reach internal services
    - to:
        - ipBlock:
