        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: dsa
      ports:
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8084
          protocol: TCP
        - port: 8085
          protocol: TCP
        # Veil Witness health/metrics port
        - port: 50059
          protocol: TCP
    # Intra-namespace (Grafana → Loki, Grafana → Tempo)
    - to:
        - podSelector: {}
    # → Kubernetes API (Promtail pod discovery + label enrichment)
    # Broad destination because K8s API and service ClusterIPs are virtual
    # IPs that ipBlock/podSelector can't reliably match before DNAT.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # → Loki + Tempo via ClusterIP (podSelector doesn't match pre-DNAT)
    - ports:
        - port: 3100
          protocol: TCP
        - port: 3200
          protocol: TCP
    # → DNS (CoreDNS for service resolution)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
