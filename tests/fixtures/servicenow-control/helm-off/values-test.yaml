apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-a
  namespace: dsa-identity
  labels:
    app.kubernetes.io/name: sandbox-a
    app.kubernetes.io/part-of: dsa
spec:
  replicas: 1
  selector:
    matchLabels:
