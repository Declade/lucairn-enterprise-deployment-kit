# Source: lucairn/charts/infrastructure/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-ingress
  namespace: dsa-identity
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # From dsa-edge (Gateway — gRPC, Sanitizer HTTP, health/invariant poller)
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: edge
      ports:
        - port: 50053
          protocol: TCP
        - port: 8086
          protocol: TCP
        - port: 8083
          protocol: TCP
    # From dsa-bridge (token revocation callbacks)
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: bridge
      ports:
        - port: 50053
          protocol: TCP
    # From dsa-ingest (future)
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: ingest
      ports:
        - port: 50053
          protocol: TCP
    # From dsa-observability (Prometheus / OTel scrape of HTTP health
    # + sanitizer + invariant ports). observability-egress in this same
    # file already permits 8083 + 8086 toward all part-of=dsa
    # namespaces; the destination side needs the matching ingress.
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: observability
      ports:
        - port: 8083
          protocol: TCP
        - port: 8086
          protocol: TCP
    # Intra-namespace (PostgreSQL ← app, migrations; pii-ml gRPC ← sanitizer).
    #
    # T-389: this rule used to carry NO `ports:` key, which in NetworkPolicy
    # means EVERY port — including 11434 on ollama-identity. Because policies
    # are unioned, that blanket allowance would have silently re-opened the
    # Ollama API to every identity-plane pod no matter how tightly the dedicated
    # `identity-ollama-ingress` policy above was written. The port list is now
    # explicit.
    #
    # This is behaviour-preserving for every flow that actually works today:
    # `identity-egress` already restricts intra-namespace EGRESS to
    # {5432, 50056} (11434 now being client-scoped), and a connection needs BOTH
    # sides to allow it. So no intra-namespace flow on any other port was
    # reachable before this change either.
    #
    # NOTE (pre-existing, deliberately NOT widened here): the sanitizer content
    # cache Redis (`sandbox-a-sanitizer-cache`, port 6379) ships enabled by
    # default but 6379 appears in NO identity-namespace policy on either side,
    # so that connection is already blocked and the sanitizer falls back to its
    # in-process LRU (fail-OPEN). Adding 6379 is an egress WIDENING and belongs
    # to its own change, not to this hardening pass.
    - from:
        - podSelector: {}
      ports:
        - port: 5432
          protocol: TCP
        - port: 50056
          protocol: TCP

