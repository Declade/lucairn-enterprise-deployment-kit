            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["ollama", "list"]
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["ollama", "list"]
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              # FIX-A (full-stack-test-results-2026-05-29): exposed as a chart
              # value. The L3 PII shield (qwen2.5:7b) needs ~6-8Gi resident;
              # the default 10Gi limit already fits it (the OOMKill BLOCKER was
              # on sandbox-b's bundled ollama at 2Gi, fixed there too).
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 10Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # T-370: was a hardcoded 10Gi. The default is UNCHANGED — the
