apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-egress
  namespace: dsa-observability
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Scrape health/metrics ports from all DSA namespaces
