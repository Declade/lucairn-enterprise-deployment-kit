              - 127.0.0.0/8     # T-390: loopback
              - 169.254.0.0/16  # Block cloud metadata endpoint
      ports:
        - port: 443
          protocol: TCP
    # Intra-namespace (app → PostgreSQL)
    - to:
        - podSelector: {}
      ports:
        - port: 5432
          protocol: TCP
