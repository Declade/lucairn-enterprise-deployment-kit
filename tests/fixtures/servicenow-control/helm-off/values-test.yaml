# Source: lucairn/charts/sandbox-b/templates/ollama-model-pull-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-b-ollama-pull
  namespace: dsa-ai
  labels:
    app.kubernetes.io/name: sandbox-b-ollama-pull
    app.kubernetes.io/part-of: dsa
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-b-ollama-pull
        dsa.io/model-pull: "true"
    spec:
      # NET-05: this pod never calls the Kubernetes API; using the
      # namespace default ServiceAccount it would still auto-mount an
      # unused token. Disable the mount at the pod level.
      automountServiceAccountToken: false
      containers:
        - name: pull
          image: "ollama/ollama:0.6.2"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              echo "Starting Ollama server for model pull..."
              ollama serve &
              SERVE_PID=$!
              # Wait for server to be ready
              until ollama list >/dev/null 2>&1; do
                sleep 2
              done
              echo "Pulling model tinyllama..."
              # T-375 item 5 (SEC-003): quoted so a model name carrying
              # shell metacharacters cannot break out of the pull command.
              # (No `default` needed here — the whole template is gated on
              # `.Values.ollama.model` being truthy at line 1.)
              ollama pull "tinyllama"
              echo "Model pull complete. Stopping server..."
              kill $SERVE_PID
              wait $SERVE_PID 2>/dev/null || true
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sandbox-b-ollama-data
