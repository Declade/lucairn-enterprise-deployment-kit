# Source: lucairn/charts/infrastructure/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-ingress
  namespace: dsa-bridge
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # From dsa-edge (Gateway — gRPC 50052 + HTTP /readyz 8082 for the
    # dependency-aware /healthz check via BRIDGE_HEALTH_ADDR).
    # Without port 8082 the gateway TCP-connect to id-bridge:8082 times
    # out and /healthz returns 503 (bridge check status=fail) which
    # crash-loops the gateway under Kubernetes liveness. See Sim 5
    # Helm Gap #7 / Vast diagnostic.
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: edge
      ports:
        - port: 50052
          protocol: TCP
        - port: 8082
          protocol: TCP
    # From dsa-identity (token revocation)
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: identity
      ports:
        - port: 50052
          protocol: TCP
    # From dsa-ai (Sandbox B — pull-based token rotation via BRIDGE_ADDR).
    # Sandbox B subscribes to bridge on port 50052 for token rotation
    # events. ai-egress in this same file already permits port 50052
    # toward dsa-bridge (and bridge-egress permits 50052 toward dsa-ai
    # for the symmetric direction); the destination side here needs
    # the matching ingress so the connection actually establishes.
    # Without this rule the TCP connect to id-bridge:50052 from
    # sandbox-b times out → token rotation stalls → inference 503s
    # under load. [Sim 5 Helm cascade F — surfaced on Vast fix-up #13.]
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: ai
      ports:
        - port: 50052
          protocol: TCP
    # From dsa-ingest (future: token generation, redaction maps)
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: ingest
      ports:
        - port: 50052
          protocol: TCP
    # From dsa-observability (Prometheus / OTel scrape of the HTTP
    # /readyz + /metrics endpoint on port 8082). observability-egress
    # in this same file already permits 8082 toward all
    # app.kubernetes.io/part-of=dsa namespaces; the destination side
    # needs the matching ingress rule for scraping to land.
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: observability
      ports:
        - port: 8082
          protocol: TCP
    # Intra-namespace
    - from:
        - podSelector: {}

