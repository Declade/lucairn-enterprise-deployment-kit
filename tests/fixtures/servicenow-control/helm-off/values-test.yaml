# Source: lucairn/charts/veil-witness/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: witness-ingress
  namespace: dsa-witness
  labels:
    app.kubernetes.io/part-of: dsa
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Claim submission from pipeline services (port 50057)
    # From dsa-bridge (ID Bridge)
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: bridge
      ports:
        - port: 50057
          protocol: TCP
    # From dsa-identity (Sanitizer)
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: identity
      ports:
        - port: 50057
          protocol: TCP
    # From dsa-ai (Sandbox B)
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: ai
      ports:
        - port: 50057
          protocol: TCP
    # From dsa-audit (Audit Service)
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: audit
      ports:
        - port: 50057
          protocol: TCP
    # Gateway claim emission (50057) and certificate retrieval (50058).
    # Keep the edge namespace limited to these two witness RPC ports.
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: 50057
          protocol: TCP
        - port: 50058
          protocol: TCP
    # Certificate retrieval + postgres read-only browse from the operator
    # dashboard (.Values.dashboardIngress.namespace, default "lucairn").
    # The dashboard's cert-browser surface (PR #39) reads veil_certificates
    # rows directly from postgres-veil on 5432 with a read-only role, AND
    # verifies certificates by hitting the witness gRPC service on 50058.
    # The lucairn namespace has no `dsa.io/namespace=…` label so the
    # existing edge rule above misses it. The combined namespaceSelector +
    # podSelector pins the rule to the dashboard pod so other lucairn
    # pods (future surfaces) cannot piggy-back on this allowance.
    #
    # Surfaced by the Helm UI verifier on PR #39 install: dashboard logs
    # showed `dial error: timeout` on 5432 + `i/o timeout` dialling
    # 50058, leaving the cert browser non-functional in the bundled-DB
    # default install. Ad-hoc NP was applied live to unblock; this
    # commit lands the same fix in the chart so fresh installs work
    # out-of-the-box.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "lucairn"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "lucairn-dashboard"
              app.kubernetes.io/component: dashboard
      ports:
        - port: 5432
          protocol: TCP
        - port: 50058
          protocol: TCP
    # From dsa-observability (Prometheus / OTel scrape of HTTP health
    # + metrics on 50059). observability-egress in
    # infrastructure/network-policies.yaml already permits 50059 toward
    # all part-of=dsa namespaces; the destination side needs the
    # matching ingress. [Sim 5 Helm Gap #7 proactive sweep]
    - from:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: observability
      ports:
        - port: 50059
          protocol: TCP
    # Intra-namespace (PostgreSQL ← app, migrations)
    - from:
        - podSelector: {}
