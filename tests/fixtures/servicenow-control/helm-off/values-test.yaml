# Source: lucairn/charts/veil-witness/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veil-witness
  namespace: dsa-witness
  labels:
    app.kubernetes.io/name: veil-witness
    app.kubernetes.io/part-of: dsa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: veil-witness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veil-witness
        app.kubernetes.io/part-of: dsa
    spec:
      serviceAccountName: veil-witness
      # Graceful connection draining on rolling restart / node drain (HA-04).
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Migration-completion gate (rehearsal fix 2026-06-19). The runtime
        # witness connects as the restricted `veil_app` role (LCR_DB_URL =
        # DATABASE_URL_APP), which does not exist until the
        # 000002_restrict_veil_role migration Job runs CREATE ROLE. Without this
        # gate the witness Deployment starts before the migration and
        # CrashLoopBackOffs with `password authentication failed for user
        # "veil_app"` until the migration completes, then self-heals — a
        # scary-but-transient CrashLoopBackOff on a no-shell-access deliverable.
        # Same dependency class + same fix as the audit subchart. Block startup
        # until an AUTHENTICATED connection as veil_app succeeds (proves postgres
        # is up AND the migration created+granted the role — stronger than
        # pg_isready). Mirrors the gateway wait-for-postgres initContainer.
        - name: wait-for-migration
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for veil-witness migration (veil_app role) to be ready..."
              for i in $(seq 1 150); do
                if psql "$DATABASE_URL_APP" -tAc 'SELECT 1' >/dev/null 2>&1; then
                  echo "veil_app role ready — migration complete."
                  exit 0
                fi
                sleep 2
              done
              echo "veil_app role not ready after 5 min — failing initContainer." >&2
              exit 1
          env:
            - name: DATABASE_URL_APP
              valueFrom:
                secretKeyRef:
                  name: veil-witness-credentials
                  key: DATABASE_URL_APP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: veil-witness
          image: "ghcr.io/declade/dsa-veil-witness:0.1.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: LCR_DB_URL
              valueFrom:
                secretKeyRef:
                  name: veil-witness-credentials
                  # INT-001 least-privilege: runtime connects as the restricted
                  # veil_app role, NOT the migrate-only superuser DATABASE_URL.
                  key: DATABASE_URL_APP
            # T-555 — DUAL-EMIT, and the direction of the compatibility matters.
            #
            # WHAT THE IMAGE ACTUALLY DOES — the witness image's server
            # entrypoint (main.go) resolves the DSN as:
            #   dbURL := requireEnvCompat("LCR_DB_URL", "VEIL_DB_URL")
            # envcompat (pkg/envcompat/envcompat.go) reads the CANONICAL name
            # first and falls back to the LEGACY name. That protects an OLD
            # VEIL_-named Secret against a NEW image. It does NOT protect a NEW
            # LCR_-only render against an OLD image: an image built before the
            # 2026-06-02 Stage 3 rename (commit 5eaabf8d9) calls plain
            # requireEnv("VEIL_DB_URL") and has never heard of LCR_DB_URL.
            #
            # MEASURED, not assumed — found in a clean-room install
            # rehearsal, 2026-08-04:
            # `helm upgrade --set global.imageTag=latest` CrashLooped this pod
            # with `required environment variable VEIL_DB_URL is not set` — the
            # requireEnv error string, NOT requireEnvCompat's
            # "LCR_DB_URL (or legacy VEIL_DB_URL)". That error string is the
            # proof `:latest` is a pre-rename build.
            #
            # So the chart emits BOTH names, same secret key. On any pinned
            # (manifest-listed) image this is inert — envcompat takes the
            # canonical LCR_ value and never consults the legacy one.
            #
            # ⚠️ This does NOT make `:latest` a supported tag. A pre-rename
            # image ALSO requires VEIL_BRIDGE_PUBLIC_KEY / VEIL_SANITIZER_
            # PUBLIC_KEY, which arrive here via `envFrom` from
            # veil-witness-config whose keys are LCR_-named (configmap.yaml
            # :13-14). Only tags recorded in image-manifest.yaml are validated
            # against this chart; `bin/lucairn doctor --values` warns when
            # global.imageTag drifts off that pin (T-554).
            - name: VEIL_DB_URL
              valueFrom:
                secretKeyRef:
                  name: veil-witness-credentials
                  key: DATABASE_URL_APP
            # Stage 3 gateway rebrand: env-var names renamed VEIL_ → LCR_.
            # The veil-witness image reads each setting under its LCR_ name and
            # falls back to the legacy VEIL_ name (envcompat), so legacy
            # operator-managed Secrets with VEIL_ keys are still readable by a
            # current image. See the direction caveat above — the fallback runs
            # inside the image, so it cannot help an image that predates it.
            - name: LCR_WITNESS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: veil-witness-credentials
                  key: LCR_WITNESS_SIGNING_KEY
            - name: LCR_WITNESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: veil-witness-credentials
                  key: LCR_WITNESS_KEY_ID
            # ── L3 CERTIFICATE-HONESTY POSTURE (T-393 / T-385) ────────────────
            #
            # The witness owns ONE L3 question and only one: what the CERTIFICATE
            # claims when the deep PII shield did not run. It has no 503 path —
            # whether a REQUEST survives an L3 outage is the sanitizer's
            # (sandbox-a's) concern, and the two are now separate flags. See
            # PRD prd-2026-08-01-l3-availability-vs-certificate-honesty-split.md.
            #
            # ⚠️ WHY BOTH ENTRIES BELOW ARE CONDITIONAL — THIS IS THE T-393 FIX.
            # LUCAIRN_L3_REQUIRED used to render UNCONDITIONALLY here (an `else`
            # branch emitted "false" when global.l3Required was absent, and the
            # umbrella's own values.yaml supplied the key anyway, so the `else`
            # was unreachable and the env was ALWAYS present). The witness image
            # that carries the posture split treats a set legacy flag beside an
            # unset LUCAIRN_L3_COMPLETENESS_POSTURE as an un-migrated deployment
            # and REFUSES TO START with a migration message
            # (services/veil-witness/internal/verifier/l3_posture.go, the
            # `posture == ""` branch). Rendering the retired flag on every
            # install therefore CrashLooped the witness on 100% of kit installs
            # from an image bump alone. Neither variable is emitted now unless
            # the operator actually chose it, so a stock render hands the image
            # NOTHING and the image's own default applies: "partial" — an
            # L3-absent chain certifies COMPLETENESS_PARTIAL.
            #
            # FIX A (review round 1 P2, 2026-06-19) still applies to both entries: they
            # live in the POD SPEC, NOT the ConfigMap consumed via envFrom. An
            # envFrom-sourced value does NOT update in-place when `helm upgrade`
            # changes the ConfigMap (no pod-template change ⇒ no rollout), so the
            # witness would keep the OLD posture until a manual restart. In the
            # pod spec, a posture change rolls the pod.
            #
            # hasKey (NOT `| default`) so an explicit `false` is honored —
            # Sprig's `default` treats boolean false as empty.
          envFrom:
            - configMapRef:
                name: veil-witness-config
          ports:
            - name: claim
              containerPort: 50057
              protocol: TCP
            - name: cert
              containerPort: 50058
              protocol: TCP
            - name: health
              containerPort: 50059
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          # preStop drain delay (HA-04): hold the container open while
          # kube-proxy removes this pod from Service endpoints, so in-flight
          # requests are not dropped on rolling restart / node drain. The
          # runtime image is alpine, so /bin/sh + sleep are available.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
