            # container runs with containerSecurityContext.readOnlyRootFilesystem
            # =true, so WITHOUT the volume mounted below the path is unopenable
            # and the pod comes up 1/1 Ready anyway: under the LOG posture every
            # request is admitted and NOTHING is recorded (silent), under
            # ENFORCE all healthy traffic is refused.
            #
            # This value and the volumeMount's mountPath are BOTH derived from
            # .Values.evidenceGap.* so they cannot drift apart;
            # tests/test_gateway_evidence_gap_volume.sh asserts that on the
            # rendered manifest.
            - name: GATEWAY_EVIDENCE_GAP_PATH
              value: "/data/evidence-gaps.jsonl"
            - name: GATEWAY_EVIDENCE_ADMISSION_POSTURE
              value: "log"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8085
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: verticals
              mountPath: /etc/dsa/verticals
              readOnly: true
            # v1.0 keystore writable mount. The container's root FS stays
            # read-only (containerSecurityContext.readOnlyRootFilesystem=true);
            # only this PVC-backed mount is writable, so keystore writes
            # succeed without relaxing the hardened FS posture.
            #
            # Mount the PVC at the PARENT directory of keystorePath. The
            # gateway binary calls os.ReadFile(keystorePath) on the full
            # file path, so the mount must be at the parent dir (NOT
            # keystorePath itself, which would make the path a directory
            # on a fresh PVC). This matches the Compose model where the
            # host volume is the parent dir and the gateway creates
            # keystore.json inside it on first run.
            #
            # NOTE: subPath does NOT work for projecting a single file
            # out of a `persistentVolumeClaim` (empty) volume — kubelet
            # creates a DIRECTORY at the subPath inside the volume and
            # bind-mounts that directory into the container, leaving the
            # gateway with the same "is a directory" error. (Fix-up #8
            # used subPath and was ineffective; fix-up #9 mounts the
            # parent dir instead. Closes Vast-verify BLOCKER-1.)
            - name: keystore
              mountPath: /etc/dsa/keystore-dir
            # T-573 evidence gap store. Deliberately NOT readOnly (that is the
            # defect being fixed) and deliberately mounted at the PARENT
            # DIRECTORY of the gap file, because the gateway creates the file
            # inside it — the same reason the keystore mount above is the
            # parent dir rather than the file path.
            - name: evidence-gap
              mountPath: "/data"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          # preStop drain delay (HA-04): hold the container open while
          # kube-proxy removes this pod from Service endpoints, so in-flight
          # requests are not dropped on rolling restart / node drain. The
          # runtime image is alpine, so /bin/sh + sleep are available.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: verticals
          projected:
            sources:
        - name: keystore
          persistentVolumeClaim:
            claimName: gateway-keystore
        # T-573 evidence gap store backing volume.
        #
        # ⚠️ HONEST DEFAULT: emptyDir. It is WRITABLE — which is the whole
        # point, the store could not be opened AT ALL before — and it survives
        # a container CRASH-RESTART, but NOT pod rescheduling. Gap records are
        # ENRICHMENT by design: the guarantee is the certificate sealing
        # PARTIAL against the witness-side anchor, which lives in the witness
        # database and is unaffected. So the emptyDir default trades some
        # explanations for not forcing every install to provision storage. Set
        # evidenceGap.persistence.enabled=true for a PVC-backed store that
        # survives rescheduling.
        #
        # ⛔ A PVC with the default ReadWriteOnce access mode does NOT work
        # with replicaCount>1 or the HPA — evidence-gap-pvc.yaml aborts the
        # render on that combination rather than letting pods sit Pending, or
        # (worse) letting two writers destroy each other's records on a shared
        # volume.
        - name: evidence-gap
          emptyDir:
            sizeLimit: "64Mi"
