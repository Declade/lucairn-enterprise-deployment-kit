---
# Source: lucairn/charts/infrastructure/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-egress
  namespace: dsa-identity
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # → dsa-bridge (token revocation)
    - to:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: bridge
      ports:
        - port: 50052
          protocol: TCP
    # → dsa-audit
    - to:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: audit
      ports:
        - port: 50051
          protocol: TCP
    # → dsa-witness (Veil Witness claim submission)
    - to:
        - namespaceSelector:
            matchLabels:
              dsa.io/namespace: witness
      ports:
        - port: 50057
          protocol: TCP
    # Intra-namespace (app → PostgreSQL, sanitizer → pii-ml gRPC sidecar on
    # 50056). Closes review BLOCKER-4: Phase 7 (Piiranha + GLiNER) dials
    # pii-ml.<identity-ns>.svc on port 50056; without it the default-deny
    # applies and every Phase 7 scan times out at the gRPC deadline, opening
    # the circuit breaker.
    #
    # T-389: port 11434 (the ollama-identity L3 runtime) was REMOVED from this
    # namespace-wide rule. This policy's podSelector is `{}`, so 11434 here
    # meant EVERY pod in the identity namespace could dial the Ollama API —
    # which is unauthenticated and whose POST /api/pull accepts an arbitrary
    # registry host with `insecure: true`. Combined with the 443 egress the L3
    # runtime now holds (identity-model-registry-egress), any compromised
    # identity-plane pod could drive the Ollama server as a confused deputy and
    # exfiltrate over that 443 allowance. 11434 is now granted only to the
    # enumerated clients by `identity-ollama-client-egress` below.
    - to:
        - podSelector: {}
      ports:
        - port: 5432
          protocol: TCP
        - port: 50056
          protocol: TCP
    # DNS resolution (required for hostname lookups)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # T-375: the plaintext-HTTP egress hole to a hardcoded bare-IP GGUF server
    # (157.90.171.30:8443) that used to sit here is DELETED. It was granted
    # namespace-wide (this policy's podSelector is `{}`), so every pod in
    # dsa-identity — the sanitizer included — could reach it. The model is now
    # pulled by name from the official registry over HTTPS by the
    # ollama-identity server; that egress is granted by the dedicated,
    # pod-scoped `identity-model-registry-egress` policy in
    # model-pull-netpol.yaml, not here.
---
# Source: lucairn/charts/infrastructure/templates/network-policies.yaml
# T-389 — the ollama-identity API (11434) is reachable ONLY from its
# enumerated clients, on BOTH the egress and the ingress side.
#
# THREAT. The Ollama HTTP API has no authentication. `POST /api/pull` takes an
# arbitrary registry host and honours `insecure: true`, so a caller can make the
# server fetch from — and talk to — a host of the caller's choosing. Since
# `identity-model-registry-egress` grants the ollama-identity pod TCP/443 to the
# public internet, an attacker on ANY identity-plane pod could previously use
# the L3 runtime as a confused deputy: a clean exfiltration primitive out of the
# namespace that holds pre-redaction text.
#
# WHY TWO POLICIES. Kubernetes unions NetworkPolicies — an added policy can only
# ADD permission, never subtract it. So restricting 11434 required editing the
# two blanket rules that already granted it (the namespace-wide `podSelector: {}`
# egress rule above, and the all-ports intra-namespace ingress rule in
# identity-ingress below) and then re-granting the port narrowly here. Adding
# these two policies WITHOUT those two edits would have changed nothing.
#
# CLIENT LIST. `infrastructure.identityOllamaClients` — see that value for the
# enumeration and the evidence for each entry. Both directions read the SAME
# list, so a client can never be half-authorised.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-ollama-client-egress
  namespace: dsa-identity
  labels:
    app.kubernetes.io/part-of: dsa
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - "sandbox-a"
          - "ollama-identity-model-pull"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama-identity
      ports:
        - port: 11434
          protocol: TCP
---
