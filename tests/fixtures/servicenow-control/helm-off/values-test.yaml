# Dedicated Redis for the sanitizer content-addressed redaction cache.
# See INSTALL.md § "Sanitizer content cache (Redis — default ON)" for the
# operator runbook and disable/external-Redis instructions.
# Isolated from redis-sanitizer (DP-budget keys) so allkeys-lru eviction
# under cache pressure NEVER touches the DP-budget accounting.
# No published host port — internal-only (BSI 2026-04-29 port-bind policy).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sandbox-a-sanitizer-cache
  namespace: dsa-identity
  labels:
    app.kubernetes.io/name: sandbox-a-sanitizer-cache
    app.kubernetes.io/part-of: dsa
spec:
  serviceName: sandbox-a-sanitizer-cache
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-a-sanitizer-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-a-sanitizer-cache
        app.kubernetes.io/part-of: dsa
    spec:
      # This pod never calls the Kubernetes API; disable the auto-mounted
      # service account token (NET-05 pattern from sandbox-b redis).
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: "redis:7-alpine"
          imagePullPolicy: IfNotPresent
          args:
            - "--maxmemory"
            - "512mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli ping"
