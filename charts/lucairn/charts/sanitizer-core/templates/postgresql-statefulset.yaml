{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-sanitizer-core
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres-sanitizer-core
    app.kubernetes.io/part-of: dsa
spec:
  serviceName: postgres-sanitizer-core
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-sanitizer-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-sanitizer-core
        app.kubernetes.io/part-of: dsa
    spec:
      # NET-05: this pod never calls the Kubernetes API.
      automountServiceAccountToken: false
      # The postgres entrypoint reads POSTGRES_* variables; keep Service-link
      # variables of this namespace out of its environment.
      enableServiceLinks: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.global.nodeIsolation }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dsa.io/zone
                    operator: In
                    values:
                      - identity
      tolerations:
        - key: dsa.io/zone
          operator: Equal
          value: identity
          effect: NoSchedule
      {{- end }}
      containers:
        - name: postgresql
          image: {{ include "sanitizerCore.postgresImage" . | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            # The official image reads the password from this FILE (its
            # `_FILE` convention), so it is in no Pod spec, env var or
            # `kubectl describe` (kit 2.0 K-B fix round 1, sol r1 P2).
            # STATED LIMIT (fix rounds 3 + 4, sol r2 P2 / r3 P3): on EVERY
            # start the image's entrypoint (docker-library/postgres 4f9ced0,
            # 16/alpine3.24/docker-entrypoint.sh) exports the file's content
            # as POSTGRES_PASSWORD (file_env :23, called at :235 from :338),
            # so its helpers inherit it before the existing-database check
            # (`id`, the mkdir/chmod of :36, the gosu re-exec at :343); on the
            # FIRST boot of an empty volume it is also PGPASSWORD while it
            # initialises (:359, unset at :366), so initdb, the temporary
            # server and the psql of that bootstrap carry it. It unsets every
            # POSTGRES_* variable (:381) before it execs the real server: no
            # long-running process carries it. Those processes run inside this
            # container only (uid 999 after the re-exec), which reads the
            # mounted file anyway. Accepted
            # over the password-free alternative (POSTGRES_HOST_AUTH_METHOD=
            # trust + an init script that sets the password): that writes
            # `host all all all trust` into pg_hba.conf (:284), and a first
            # boot interrupted before the init script ran would leave a
            # database that serves TCP with no password at all.
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/sanitizer-core-db/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-password
              mountPath: /run/secrets/sanitizer-core-db
              readOnly: true
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-sanitizer-core-data
        # ONLY the DB password; group-readable for the postgres group (fsGroup).
        - name: db-password
          secret:
            secretName: {{ .Chart.Name }}-credentials
            defaultMode: 0440
            items:
              - key: POSTGRES_PASSWORD
                path: password
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
