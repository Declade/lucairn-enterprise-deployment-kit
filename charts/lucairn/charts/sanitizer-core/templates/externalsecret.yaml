{{- if ne .Values.secrets.backend "k8s-native" }}
{{- $backend := .Values.secrets.backend }}
{{- $remoteKey := "" }}
{{- if eq $backend "vault" }}{{- $remoteKey = .Values.secrets.vault.path }}
{{- else if eq $backend "aws" }}{{- $remoteKey = .Values.secrets.aws.name }}
{{- else if eq $backend "azure" }}{{- $remoteKey = .Values.secrets.azure.name }}
{{- end }}
# The core's credentials from the external secret store. Store the three
# properties below at sanitizer-core.secrets.<backend> (path / name):
#   registry_key   64 hex (openssl rand -hex 32), stable for the registry's life
#   password       the registry DB password, URL-safe (openssl rand -hex 24)
#   registry_dsn   postgres://dsa:<password>@postgres-sanitizer-core:5432/sanitizer_core?sslmode=disable
#                  (the SAME password; for an external DB its own host/user/db).
#                  URL form ONLY (the core refuses key=value text in a file);
#                  percent-encode / ? # @ : % and spaces in the password here
#                  (DSA #956 registry_dsn.go).
# REGISTRY_DSN is mounted into the core as a file (--registry-dsn-file), never
# passed on its command line.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dsa
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dsa-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Chart.Name }}-credentials
  data:
    - secretKey: DSA_SANITIZER_CORE_REGISTRY_KEY
      remoteRef:
        key: {{ $remoteKey }}
        property: registry_key
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ $remoteKey }}
        property: password
    - secretKey: REGISTRY_DSN
      remoteRef:
        key: {{ $remoteKey }}
        property: registry_dsn
{{- end }}
