{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-sanitizer-core-data
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres-sanitizer-core
    app.kubernetes.io/part-of: dsa
  annotations:
    # The sealed conversation registry: `helm uninstall` keeps it (delete by
    # hand for a full teardown). NOT in the backup CronJobs yet — see
    # INSTALL.md § "Sanitizer core (kit 2.0, Helm)".
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgresql.storageClass }}
  storageClassName: {{ .Values.postgresql.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.storageSize }}
{{- end }}
