{{- if eq .Values.secrets.backend "k8s-native" }}
{{- $sv := default dict .Values.secrets.values }}
{{- $pw := toString $sv.postgresPassword }}
# The core's credentials (k8s-native backend). Three keys:
#   DSA_SANITIZER_CORE_REGISTRY_KEY  env of the core (row sealing key)
#   POSTGRES_PASSWORD                the registry DB (StatefulSet, migration
#                                    Job, wait-for-migration init container)
#   REGISTRY_DSN                     mounted as a FILE into the core and read
#                                    with --registry-dsn-file: the password never
#                                    appears in the core's command line (ps /
#                                    /proc/<pid>/cmdline are world-readable).
# The DSN is built from the same password, so the two cannot disagree.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dsa
type: Opaque
stringData:
  DSA_SANITIZER_CORE_REGISTRY_KEY: {{ trim (toString $sv.registryKey) | quote }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  REGISTRY_DSN: {{ printf "postgres://%s:%s@%s:%s/%s?sslmode=%s" (include "sanitizerCore.pgUser" .) $pw (include "sanitizerCore.pgHost" .) (include "sanitizerCore.pgPort" .) (include "sanitizerCore.pgDatabase" .) (include "sanitizerCore.sslmode" .) | quote }}
{{- end }}
