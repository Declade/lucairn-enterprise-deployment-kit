{{/*
T-488 (2026-08-04): this chart used to have NO ExternalSecret template while
templates/deployment.yaml mounts the `admin-credentials` Secret unconditionally
via `envFrom.secretRef` — so `--set admin.secrets.backend=vault` (or aws/azure)
rendered a CLEAN manifest set, but nothing ever created the Secret the
Deployment depends on, and the pod landed in CreateContainerConfigError at
first schedule. Every other credential-bearing subchart (audit, id-bridge,
sandbox-a, sandbox-b, veil-witness, gateway, ingest) already has this file;
admin was the odd one out. See templates/_validate.tpl for the matching
backend-gated validation-guard change this file's addition requires.
*/}}
{{- if ne .Values.secrets.backend "k8s-native" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dsa
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dsa-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Chart.Name }}-credentials
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        {{- if eq .Values.secrets.backend "vault" }}
        key: {{ .Values.secrets.vault.path }}
        property: adminPassword
        {{- else if eq .Values.secrets.backend "aws" }}
        key: {{ .Values.secrets.aws.name }}
        property: adminPassword
        {{- else if eq .Values.secrets.backend "azure" }}
        key: {{ .Values.secrets.azure.name }}
        property: adminPassword
        {{- end }}
    {{- /* Prefer umbrella global.dsaServiceToken; fall back to per-subchart slot. Vast cascade BLOCKER D, 2026-05-26 — same rationale as secret.yaml. */}}
    - secretKey: DSA_SERVICE_TOKEN
      remoteRef:
        {{- if eq .Values.secrets.backend "vault" }}
        key: {{ .Values.secrets.vault.path }}
        property: dsaServiceToken
        {{- else if eq .Values.secrets.backend "aws" }}
        key: {{ .Values.secrets.aws.name }}
        property: dsaServiceToken
        {{- else if eq .Values.secrets.backend "azure" }}
        key: {{ .Values.secrets.azure.name }}
        property: dsaServiceToken
        {{- end }}
{{- end }}
