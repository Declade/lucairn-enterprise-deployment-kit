namespace: dsa-admin

replicaCount: 1

image:
  repository: dsa-admin
  tag: ""
  pullPolicy: IfNotPresent

service:
  webPort: 8090
  healthPort: 8091

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  enabled: false

pdb:
  enabled: false

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

auditServiceAddr: "audit.dsa-audit.svc:50051"
gatewayHealthURL: "http://gateway.dsa-edge.svc:8085/healthz"
gatewayReadyURL: "http://gateway.dsa-edge.svc:8085/readyz"
sandboxAHealthURL: "http://sandbox-a.dsa-identity.svc:8083/healthz"
sandboxAReadyURL: "http://sandbox-a.dsa-identity.svc:8083/readyz"
idBridgeHealthURL: "http://id-bridge.dsa-bridge.svc:8082/healthz"
idBridgeReadyURL: "http://id-bridge.dsa-bridge.svc:8082/readyz"
sandboxBHealthURL: "http://sandbox-b.dsa-ai.svc:8084/healthz"
sandboxBReadyURL: "http://sandbox-b.dsa-ai.svc:8084/readyz"
auditHealthURL: "http://audit.dsa-audit.svc:8081/healthz"
auditReadyURL: "http://audit.dsa-audit.svc:8081/readyz"
ingestHealthURL: "http://ingest.dsa-ingest.svc:8096/healthz"
ingestReadyURL: "http://ingest.dsa-ingest.svc:8096/readyz"

secrets:
  backend: k8s-native
  values:
    # REQUIRED — ships EMPTY on purpose (T-10). There is no working default:
    # templates/_validate.tpl hard-fails the render when this is empty or is
    # still a CHANGE-ME…-shaped placeholder, at every global.dsaEnv.
    #   --set "admin.secrets.values.adminPassword=$(openssl rand -base64 24)"
    # Or leave empty and set admin.secrets.backend to vault | aws | azure.
    # If you do not deploy the admin surface at all, set admin.enabled=false.
    adminPassword: ""
    dsaServiceToken: ""  # PRODUCTION: set via existingSecret or --set; dev: inline value
