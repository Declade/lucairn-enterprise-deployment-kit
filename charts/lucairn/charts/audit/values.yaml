namespace: dsa-audit

# v1.0 ships single-replica audit because the EVENTS_RECORDED veil-claim
# dedup winner-result map is in-memory per-pod (services/audit/internal/
# server/server.go:97 — `veilClaimSent sync.Map`). Multi-replica audit
# pods would split the same-request_id dedup state: pod A's losers block
# on pod A's winner, pod B's losers block on pod B's winner — both pods
# can emit the EVENTS_RECORDED veil claim for the same request_id,
# violating the F1 fail-closed uniformity invariant (locked by
# TestEmitEvent_PipelineCompletion_RetryAfterFailureDoesNotShortCircuit).
# Postgres backs the audit log itself but NOT the per-pod dedup channel
# coordination map. Compose works because it runs ONE audit container.
#
# Multi-replica audit is a v2.0 design (Postgres- or Redis-backed
# winner-result coordination). Until then, leave replicaCount=1 +
# hpa.enabled=false; the umbrella validator
# (validators.auditSingleReplica) fails-fast on any operator who flips
# either knob without the v2.0 backend ready.
#
# Vast cascade I sweep (fix-up #15, 2026-05-26): audit shares the
# veil-witness defect class — pod-local state cannot be safely split
# across replicas via standard K8s Service load-balancing.
replicaCount: 1

image:
  repository: dsa-audit
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

service:
  grpcPort: 50051
  healthPort: 8081

veilEnabled: "true"
veilWitnessAddr: "veil-witness.dsa-witness.svc.cluster.local:50057"
grpcTlsEnabled: "false"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# v1.0 ships HPA disabled — see replicaCount comment above. The
# veilClaimSent sync.Map is pod-local; HPA scaling beyond 1 replica
# breaks the F1 dedup invariant.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilization: 70

pdb:
  # v1.0 single-replica lock: the PDB only renders at replicaCount >= 2
  # (the v2.0 multi-replica unlock). On a single-replica workload a PDB
  # with minAvailable: 1 makes `kubectl drain` hang forever, so v1.0
  # renders no PDB. When 2+ replicas run, maxUnavailable lets drain evict
  # one pod at a time. See templates/pdb.yaml.
  enabled: true
  maxUnavailable: 1

# Graceful shutdown / connection draining on rolling restart + node drain
# (HA-04). On pod termination the kubelet sends SIGTERM and removes the pod
# from Service endpoints CONCURRENTLY — without a drain delay, in-flight
# requests routed just before endpoint removal are dropped. The preStop
# sleep holds the container open while kube-proxy propagates the endpoint
# removal across nodes, then the process exits gracefully.
# terminationGracePeriodSeconds MUST exceed preStopSleepSeconds.
gracefulShutdown:
  # Seconds to sleep in preStop before SIGTERM, letting endpoint removal
  # propagate. 0 disables the preStop hook entirely.
  preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# T-350: the migration Job applies migrations up to a PINNED TARGET VERSION and
# never further. It does not run an open-ended `migrate up`.
#
# Why this exists: the Job's migration files come from the service IMAGE
# (`cp -r /migrations /shared/migrations`), not from this repository, so a bare
# `up` let whichever image tag happened to be pinned decide which tables a
# customer install creates — including migrations this kit release has never
# reviewed for personal-data retention impact. Full rationale (and the
# veil-witness 000011/000012 case that prompted it) is in
# charts/lucairn/charts/audit/templates/_migration-cap.tpl.
#
# targetVersion is a migration VERSION (as in `migrate goto N`), not a count.
# The Job reads the current schema version first and exits 0 without doing
# anything when the database is already at or beyond the target: it NEVER
# migrates down.
#
# 6 = 000006_token_usage_columns. The chart also carries a hard ceiling of 6
# (charts/audit/templates/migration-job.yaml); a targetVersion above it is
# refused at render time. Raising both is a deliberate code change gated by
# docs/RELEASING.md § "Migration review".
#
# unsafeAcknowledgeOpenEndedMigrateUp is the only escape hatch. true restores
# the pre-T-350 open-ended `migrate up` AND bypasses the ceiling.
migrations:
  targetVersion: 6
  unsafeAcknowledgeOpenEndedMigrateUp: false

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  storageSize: 10Gi
  storageClass: ""
  # Superuser, used by the migration Job (CREATE ROLE / GRANT) and Postgres
  # bootstrap ONLY. The runtime audit deployment connects as `appUser`.
  user: dsa
  # Least-privilege role the runtime audit service connects as (INT-001).
  # Created + granted by the 000003_least_privilege_role migration (NOSUPERUSER,
  # append-only — INSERT but no DELETE/TRUNCATE on audit_events). Must match the
  # role literal the migration bakes (`audit_app`). The migrate Job still runs
  # as the `user` superuser above because it executes CREATE ROLE/GRANT/REVOKE
  # that the restricted role itself is not permitted to run.
  appUser: audit_app
  database: audit

external:
  databaseUrl: ""  # used when postgresql.enabled: false

secrets:
  backend: k8s-native  # k8s-native | vault | aws | azure
  values:
    # REQUIRED when postgresql.enabled — ships EMPTY on purpose (T-10). This is
    # the `dsa` superuser of the bundled audit Postgres. There is no working
    # default: templates/_validate.tpl hard-fails the render when this is empty
    # or is still a CHANGE-ME…-shaped placeholder, at every global.dsaEnv.
    #   --set "audit.secrets.values.postgresPassword=$(openssl rand -base64 24)"
    # Or leave empty and set audit.secrets.backend to vault | aws | azure.
    postgresPassword: ""
    # REQUIRED when postgresql.enabled — ships EMPTY on purpose (T-10).
    # Password for the least-privilege `audit_app` role that the audit service
    # connects as at runtime. Baked into the 000003_least_privilege_role
    # migration via the render init container. Compose-path equivalent:
    # AUDIT_APP_PASSWORD in customer.env. Refuses to render with an empty
    # value, a CHANGE-ME…-shaped placeholder, a single-quote, or a backslash
    # (SQL-injection guard).
    #   --set "audit.secrets.values.auditAppPassword=$(openssl rand -base64 24)"
    auditAppPassword: ""
    veilSigningKey: ""
    dsaServiceToken: ""  # PRODUCTION: set via existingSecret or --set; dev: inline value
  vault:
    path: "postgres-audit"
  aws:
    name: "dsa/postgres-audit"
  azure:
    name: "dsa-postgres-audit"
