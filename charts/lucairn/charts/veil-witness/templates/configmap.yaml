apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dsa
data:
  LCR_CLAIM_TIMEOUT: {{ .Values.config.claimTimeout | quote }}
  LCR_TSA_URL: {{ .Values.config.tsaUrl | quote }}
  LCR_REKOR_URL: {{ .Values.config.rekorUrl | quote }}
  LCR_BRIDGE_PUBLIC_KEY: {{ .Values.config.bridgePublicKey | quote }}
  LCR_SANITIZER_PUBLIC_KEY: {{ .Values.config.sanitizerPublicKey | quote }}
  LCR_SANDBOX_B_PUBLIC_KEY: {{ .Values.config.sandboxBPublicKey | quote }}
  LCR_AUDIT_PUBLIC_KEY: {{ .Values.config.auditPublicKey | quote }}
  LCR_PROOF_SPEC_PATH: {{ .Values.config.proofSpecPath | quote }}
  LCR_PROOF_OUTPUT_PATH: {{ .Values.config.proofOutputPath | quote }}
  LCR_PROOF_MODEL_VERSION: {{ .Values.config.proofModelVersion | quote }}
  INSECURE_DEV_MODE: {{ .Values.config.insecureDevMode | quote }}
  # NOTE: the L3 certificate-honesty posture is intentionally NOT in this
  # ConfigMap. LUCAIRN_L3_COMPLETENESS_POSTURE (and the retired
  # LUCAIRN_L3_REQUIRED, when an operator still sets it) live DIRECTLY in the
  # witness Deployment pod spec env (veil-witness/templates/deployment.yaml).
  #
  # FIX A (Codex r1 P2, 2026-06-19): a ConfigMap value consumed via
  # `envFrom: configMapRef` does NOT roll the pod on `helm upgrade` when the
  # value changes (no pod-template change), so the witness would keep the OLD
  # posture until someone restarted it by hand — a certificate posture change
  # that silently does not take effect. In the pod spec, changing it rolls the
  # pod.
  #
  # T-393: neither variable is rendered at all unless the operator sets the
  # matching key (global.l3CompletenessPosture / global.l3Required). The
  # witness image refuses to start when it sees the retired flag beside an
  # unset posture, so an unconditional render CrashLooped every kit install.
