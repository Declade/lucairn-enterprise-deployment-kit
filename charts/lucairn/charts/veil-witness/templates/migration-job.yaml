{{- if .Values.postgresql.enabled }}
{{- /*
  T-350 migration version cap. `knownSafeMax` is the highest veil-witness
  migration version THIS kit release has reviewed for personal-data retention
  impact — deliberately baked into the template, not into values, so raising it
  is a code change gated by docs/RELEASING.md § "Migration review".

  10 = 000010_conversation_id, the last version in this repo's own
  migrations/veil-witness/ mirror. The next two versions in the service image
  are exactly the ones T-350 is about:
    000011_certificate_persistence_outbox
    000012_witness_claim_receipts
  Both create tables holding un-redacted personal data for which this kit ships
  NO deletion path. They are unreachable from this Job unless an operator sets
  veil-witness.migrations.unsafeAcknowledgeOpenEndedMigrateUp=true.
*/ -}}
{{- $knownSafeMax := 10 }}
{{- include "lucairn.migrationCap.validate" (dict "path" "veil-witness" "migrations" .Values.migrations "knownSafeMax" $knownSafeMax) }}
# Migration Job uses .Release.Revision-suffixed name so each helm release
# creates a NEW Job resource. Kubernetes treats Job spec.template as
# immutable for existing resources; versioned names sidestep the
# immutability constraint while keeping migrations as normal resources
# that apply in the regular install order (after Secrets + Postgres +
# Phase-2 imagePullSecret replication).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-migrate-r{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-migrate
    app.kubernetes.io/part-of: dsa
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-migrate
    spec:
      # NET-05: this pod never calls the Kubernetes API; using the
      # namespace default ServiceAccount it would still auto-mount an
      # unused token. Disable the mount at the pod level.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      initContainers:
        - name: render-migrations
          # Run from the veil-witness image so the baked-in /migrations source
          # tree is available. cp into the shared volume, then sed-substitute
          # the historical literal 'veil_app_password' with the operator-
          # supplied value. Mirrors scripts/render-migrations.sh in the
          # Compose path.
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -z "${VEIL_APP_PASSWORD:-}" ]; then
                echo "render-migrations: VEIL_APP_PASSWORD is empty — refusing to render" >&2
                exit 2
              fi
              case "${VEIL_APP_PASSWORD}" in
                *\'*) echo "render-migrations: VEIL_APP_PASSWORD contains a single quote — refusing (would break SQL string / open SQL injection)" >&2; exit 3 ;;
              esac
              case "${VEIL_APP_PASSWORD}" in
                *\\*) echo "render-migrations: VEIL_APP_PASSWORD contains a backslash — refusing (would break SQL string-escape)" >&2; exit 3 ;;
              esac
              cp -r /migrations /shared/migrations
              sed -i "s|'veil_app_password'|'${VEIL_APP_PASSWORD}'|g" \
                /shared/migrations/000002_restrict_veil_role.up.sql
              echo "render-migrations: veil-witness rendered" >&2
          env:
            - name: VEIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: VEIL_APP_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /shared
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: wait-and-migrate
          image: migrate/migrate:v4.17.0
          command:
            - sh
            - -c
            - |
              {{- include "lucairn.migrationCap.script" (dict "path" "veil-witness" "waitHost" (printf "%s-postgresql" .Chart.Name) "migrations" .Values.migrations "knownSafeMax" $knownSafeMax) | nindent 14 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: DATABASE_URL
          volumeMounts:
            - name: migrations
              mountPath: /shared
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: migrations
          emptyDir: {}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
{{- end }}
