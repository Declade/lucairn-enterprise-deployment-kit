{{- $mtlsEnabled := and (kindIs "bool" .Values.global.mtls.enabled) .Values.global.mtls.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dsa
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/part-of: dsa
    spec:
      serviceAccountName: {{ .Chart.Name }}
      # Graceful connection draining on rolling restart / node drain (HA-04).
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        # Migration-completion gate (rehearsal fix 2026-06-19). The runtime
        # witness connects as the restricted `veil_app` role (LCR_DB_URL =
        # DATABASE_URL_APP), which does not exist until the
        # 000002_restrict_veil_role migration Job runs CREATE ROLE. Without this
        # gate the witness Deployment starts before the migration and
        # CrashLoopBackOffs with `password authentication failed for user
        # "veil_app"` until the migration completes, then self-heals — a
        # scary-but-transient CrashLoopBackOff on a no-shell-access deliverable.
        # Same dependency class + same fix as the audit subchart. Block startup
        # until an AUTHENTICATED connection as veil_app succeeds (proves postgres
        # is up AND the migration created+granted the role — stronger than
        # pg_isready). Mirrors the gateway wait-for-postgres initContainer.
        - name: wait-for-migration
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for veil-witness migration (veil_app role) to be ready..."
              for i in $(seq 1 150); do
                if psql "$DATABASE_URL_APP" -tAc 'SELECT 1' >/dev/null 2>&1; then
                  echo "veil_app role ready — migration complete."
                  exit 0
                fi
                sleep 2
              done
              echo "veil_app role not ready after 5 min — failing initContainer." >&2
              exit 1
          env:
            - name: DATABASE_URL_APP
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: DATABASE_URL_APP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if $mtlsEnabled }}
            # The claim-intake server (:50057) uses the verified DSA mesh.
            - name: GRPC_TLS_ENABLED
              value: "true"
            - name: DSA_MTLS_CA_BUNDLE_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.caBundleKey }}"
            - name: DSA_MTLS_SERVER_CERT_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.certKey }}"
            - name: DSA_MTLS_SERVER_KEY_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.keyKey }}"
            - name: DSA_MTLS_CLIENT_CERT_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.certKey }}"
            - name: DSA_MTLS_CLIENT_KEY_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.keyKey }}"
            - name: DSA_MTLS_SERVER_NAME
              value: "dsa-veil-witness"
            # Certificate retrieval (:50058) intentionally retains its own
            # WITNESS_MTLS_* runtime contract; use the same leaf and canonical
            # SAN so the chart does not introduce a second credential store.
            - name: WITNESS_MTLS_CA_BUNDLE_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.caBundleKey }}"
            - name: WITNESS_MTLS_SERVER_CERT_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.certKey }}"
            - name: WITNESS_MTLS_SERVER_KEY_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.keyKey }}"
            {{- end }}
            - name: LCR_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  # INT-001 least-privilege: runtime connects as the restricted
                  # veil_app role, NOT the migrate-only superuser DATABASE_URL.
                  key: DATABASE_URL_APP
            # Stage 3 gateway rebrand: env-var names renamed VEIL_ → LCR_.
            # The veil-witness image (v0.5.0+) accepts both forms via envcompat
            # fallback at boot, so legacy operator-managed Secrets with VEIL_
            # keys are still readable; new chart-rendered Secrets emit LCR_.
            - name: LCR_WITNESS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: LCR_WITNESS_SIGNING_KEY
            - name: LCR_WITNESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: LCR_WITNESS_KEY_ID
            # ── L3 CERTIFICATE-HONESTY POSTURE (T-393 / T-385) ────────────────
            #
            # The witness owns ONE L3 question and only one: what the CERTIFICATE
            # claims when the deep PII shield did not run. It has no 503 path —
            # whether a REQUEST survives an L3 outage is the sanitizer's
            # (sandbox-a's) concern, and the two are now separate flags. See
            # PRD prd-2026-08-01-l3-availability-vs-certificate-honesty-split.md.
            #
            # ⚠️ WHY BOTH ENTRIES BELOW ARE CONDITIONAL — THIS IS THE T-393 FIX.
            # LUCAIRN_L3_REQUIRED used to render UNCONDITIONALLY here (an `else`
            # branch emitted "false" when global.l3Required was absent, and the
            # umbrella's own values.yaml supplied the key anyway, so the `else`
            # was unreachable and the env was ALWAYS present). The witness image
            # that carries the posture split treats a set legacy flag beside an
            # unset LUCAIRN_L3_COMPLETENESS_POSTURE as an un-migrated deployment
            # and REFUSES TO START with a migration message
            # (services/veil-witness/internal/verifier/l3_posture.go, the
            # `posture == ""` branch). Rendering the retired flag on every
            # install therefore CrashLooped the witness on 100% of kit installs
            # from an image bump alone. Neither variable is emitted now unless
            # the operator actually chose it, so a stock render hands the image
            # NOTHING and the image's own default applies: "partial" — an
            # L3-absent chain certifies COMPLETENESS_PARTIAL.
            #
            # FIX A (Codex r1 P2, 2026-06-19) still applies to both entries: they
            # live in the POD SPEC, NOT the ConfigMap consumed via envFrom. An
            # envFrom-sourced value does NOT update in-place when `helm upgrade`
            # changes the ConfigMap (no pod-template change ⇒ no rollout), so the
            # witness would keep the OLD posture until a manual restart. In the
            # pod spec, a posture change rolls the pod.
            #
            # hasKey (NOT `| default`) so an explicit `false` is honored —
            # Sprig's `default` treats boolean false as empty.
            {{- $g := (default dict .Values.global) }}
            {{- /*
                 MIRROR of validators.l3LegacyFlagWithoutPosture, deliberately
                 duplicated here rather than trusted to the umbrella (T-393
                 review, MEDIUM-5). The umbrella validator reads `.Values.global`
                 at UMBRELLA scope; this template reads the SUBCHART's coalesced
                 `.Values.global`, and the two are not the same map — Helm
                 propagates `global` asymmetrically, and a values file that sets
                 `veil-witness.global.l3Required` reaches THIS map without ever
                 passing the umbrella guard. Verified reachable:
                 `--set veil-witness.global.l3Required=true` rendered the retired
                 flag with no posture, i.e. the exact CrashLoop state T-393
                 exists to prevent. A guard has to live where the render happens.
            */}}
            {{- /*
                 The ENUM half of the same mirror. `validators.l3PostureValues`
                 also reads umbrella scope, so `--set
                 veil-witness.global.l3CompletenessPosture=PARTIALLY` rendered
                 straight through to a pod the image refuses to boot. Both
                 halves have to be mirrored or the bypass just moves from one
                 guard to the other.
                 Empty/null is ABSENCE (the image applies its default);
                 whitespace-only is a value and is refused, exactly as
                 services/veil-witness/internal/verifier/l3_posture.go
                 `parseL3CompletenessPosture` does.
            */}}
            {{- if hasKey $g "l3CompletenessPosture" }}
            {{- $raw := toString (default "" $g.l3CompletenessPosture) }}
            {{- if and (ne $raw "") (not (has (lower (trim $raw)) (list "partial" "full"))) }}
            {{- fail "veil-witness: global.l3CompletenessPosture must be \"partial\" or \"full\" (value withheld). The veil-witness refuses to start on an off-allowlist posture, so this render would CrashLoopBackOff. \"partial\" is the image default and the honest posture; \"full\" reproduces the retired global.l3Required=false over-claim (board T-385). Omit the key entirely to take the image default. NOTE: if you set this under a subchart key (veil-witness.global.*) rather than the umbrella global, set the umbrella key instead — a subchart-scoped global bypasses the chart's umbrella validators." }}
            {{- end }}
            {{- end }}
            {{- if and (hasKey $g "l3Required") (not (hasKey $g "l3CompletenessPosture")) }}
            {{- fail "veil-witness: l3Required is set in this pod's resolved `global` without l3CompletenessPosture. LUCAIRN_L3_REQUIRED is RETIRED (T-393) and the witness image REFUSES TO START when it sees the retired flag beside an unset LUCAIRN_L3_COMPLETENESS_POSTURE — this render would produce a CrashLoopBackOff. Set global.l3CompletenessPosture=partial|full (what the CERTIFICATE claims when L3 did not run; `partial` is the default and the honest posture, `full` reproduces the retired false behaviour of claiming COMPLETENESS_FULL for a request the deep PII shield never saw — board T-385), then delete l3Required. Leaving both unset is supported and is what the kit ships. NOTE: if you set this under a subchart key (veil-witness.global.*) rather than the umbrella global, set the umbrella key instead — a subchart-scoped global bypasses the chart's other L3 guards." }}
            {{- end }}
            {{- if hasKey $g "l3CompletenessPosture" }}
            # "partial" (image default) — a chain that only ran L1+L2 certifies
            # COMPLETENESS_PARTIAL. "full" reproduces the retired
            # LUCAIRN_L3_REQUIRED=false behaviour, which claims COMPLETENESS_FULL
            # for a request the deep PII shield never saw (board T-385).
            - name: LUCAIRN_L3_COMPLETENESS_POSTURE
              value: {{ $g.l3CompletenessPosture | quote }}
            {{- end }}
            {{- if hasKey $g "l3Required" }}
            # RETIRED. Emitted only because the operator still sets
            # global.l3Required, so an image that still reads it keeps behaving
            # as before. On the posture-split image this is a migration
            # tripwire, and validators.l3LegacyFlagWithoutPosture
            # (charts/lucairn/templates/_validators.tpl) refuses the render
            # unless both replacement postures are set alongside it.
            - name: LUCAIRN_L3_REQUIRED
              value: {{ $g.l3Required | quote }}
            {{- end }}
            {{- if and (not $mtlsEnabled) .Values.witnessMtls.serverSecret }}
            # TOB-S009 / fable HIGH (2026-06-10): opt-in witness server-side mTLS.
            # When witnessMtls.serverSecret is set the witness reads these three
            # paths to enable mutual-TLS on the cert RPC port (:50058).
            # When unset the witness degrades gracefully to unauthenticated
            # (mirrors docker-compose.customer.yml:596-610 graceful-degradation
            # comment). LCR_WITNESS_SIGNING_KEY is defined above in the same
            # env: block — there is exactly ONE env: key on this container.
            - name: WITNESS_MTLS_CA_BUNDLE_PATH
              value: "{{ .Values.witnessMtls.mountPath }}/{{ .Values.witnessMtls.caBundle }}"
            - name: WITNESS_MTLS_SERVER_CERT_PATH
              value: "{{ .Values.witnessMtls.mountPath }}/{{ .Values.witnessMtls.serverCert }}"
            - name: WITNESS_MTLS_SERVER_KEY_PATH
              value: "{{ .Values.witnessMtls.mountPath }}/{{ .Values.witnessMtls.serverKey }}"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
          ports:
            - name: claim
              containerPort: {{ .Values.service.claimPort }}
              protocol: TCP
            - name: cert
              containerPort: {{ .Values.service.certPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if and .Values.gracefulShutdown (gt (int (.Values.gracefulShutdown.preStopSleepSeconds | default 0)) 0) }}
          # preStop drain delay (HA-04): hold the container open while
          # kube-proxy removes this pod from Service endpoints, so in-flight
          # requests are not dropped on rolling restart / node drain. The
          # runtime image is alpine, so /bin/sh + sleep are available.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ int .Values.gracefulShutdown.preStopSleepSeconds }}"]
          {{- end }}
          {{- if and (not $mtlsEnabled) .Values.witnessMtls.serverSecret }}
          volumeMounts:
            - name: witness-mtls-certs
              mountPath: {{ .Values.witnessMtls.mountPath | quote }}
              readOnly: true
          {{- end }}
          {{- if $mtlsEnabled }}
          volumeMounts:
            - name: enterprise-mtls
              mountPath: {{ .Values.global.mtls.mountPath | quote }}
              readOnly: true
          {{- end }}
      {{- if and (not $mtlsEnabled) .Values.witnessMtls.serverSecret }}
      volumes:
        - name: witness-mtls-certs
          secret:
            secretName: {{ .Values.witnessMtls.serverSecret }}
      {{- end }}
      {{- if $mtlsEnabled }}
      volumes:
        - name: enterprise-mtls
          secret:
            secretName: {{ .Values.global.mtls.secrets.veilWitness }}
            items:
              - key: {{ .Values.global.mtls.caBundleKey }}
                path: {{ .Values.global.mtls.caBundleKey }}
              - key: {{ .Values.global.mtls.certKey }}
                path: {{ .Values.global.mtls.certKey }}
              - key: {{ .Values.global.mtls.keyKey }}
                path: {{ .Values.global.mtls.keyKey }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
