    # another image needs its own digest, or digest: "" for the tag.
    repository: grafana/promtail
    tag: "3.3.0"
    digest: "sha256:5aa128328d6b0b47a41e1fedd3e5e599c02203c0368d2a2ffc736785ba5a22a3"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
