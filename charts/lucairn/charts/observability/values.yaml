tempo:
  image:
    # Pinned by the digest image-manifest.yaml records
    # (image_digests.kit_third_party.tempo); re-pin both together. A
    # byte-identical mirror (repository override) keeps the digest;
    # another image needs its own digest, or digest: "" for the tag.
    repository: grafana/tempo
    tag: "2.6.0"
    digest: "sha256:f55a8a1937fff0af3a760d376b476c8327fb30e432d5e7630d7938b67691e822"
  retention: "168h"  # 7 days
  storageSize: 10Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

serviceMonitors:
  enabled: false  # Requires Prometheus Operator CRDs

secrets:
  backend: k8s-native
  values:
    # REQUIRED — ships EMPTY on purpose (T-10). This is the Grafana admin
    # login password (GF_SECURITY_ADMIN_PASSWORD). There is no working default:
    # templates/_validate.tpl hard-fails the render when this is empty or is
    # still a CHANGE-ME…-shaped placeholder, at every global.dsaEnv.
    #   --set "observability.secrets.values.grafanaAdminPassword=$(openssl rand -base64 24)"
    # This chart ships no ExternalSecret, so the guard is not backend-gated:
    # set observability.enabled=false if you run Grafana outside the release.
    grafanaAdminPassword: ""
