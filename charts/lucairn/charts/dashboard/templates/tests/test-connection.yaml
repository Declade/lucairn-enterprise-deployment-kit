apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "dashboard.fullname" . }}-test-connection"
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      {{- /* The digest image-manifest.yaml records (image_digests.kit_third_party.curl). */}}
      image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
      command: ["sh", "-c"]
      args:
        - >
          curl -fsS
          http://{{ include "dashboard.fullname" . }}:{{ .Values.service.port }}/healthz
