{{- $core := include "infrastructure.sanitizerCoreEnabled" . -}}
{{- range .Values.namespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .name }}
  labels:
    app.kubernetes.io/part-of: dsa
spec:
{{- if and $core (eq (toString .label) "identity") }}
  # Kit 2.0 K-B fix round 1 (sol r1 P2): policies are unioned, so the core
  # and its registry DB must be carved out HERE. The registry DB gets no DNS
  # at all; the core resolves through the cluster resolver only
  # (identity-sanitizer-core-egress in network-policies.yaml).
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - sanitizer-core
          - postgres-sanitizer-core
{{- else }}
  podSelector: {}
{{- end }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
