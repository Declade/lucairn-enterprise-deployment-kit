{{- if .Values.global.dnsRestriction }}
# ==========================================================================
# DNS Side-Channel Mitigation — Cilium CiliumNetworkPolicy
#
# These policies restrict which internal DNS names each namespace can resolve.
# This prevents dsa-ai from discovering dsa-identity service names (and vice
# versa), closing the DNS side-channel identified in red team finding #1.
#
# REQUIREMENT: Cilium CNI must be installed. These resources are no-ops if
# the CiliumNetworkPolicy CRD is not registered. Set global.dnsRestriction=false
# for non-Cilium clusters (Kind, vanilla Calico, etc.).
#
# The resolver Pods are selected by global.clusterDNS.podLabels (default
# k8s-app=kube-dns), the same labels as the Kubernetes DNS rules
# (infrastructure.clusterDNSPodLabels; kit 2.0 K-B fix round 3, sol r2 P2:
# these selectors were hardcoded to kube-dns).
# ==========================================================================

# --- dsa-ai: can only resolve own namespace + audit + external DNS ---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-restrict-ai
  namespace: {{ include "infrastructure.namespaceFor" (dict "root" $ "label" "ai") }}
  labels:
    app.kubernetes.io/part-of: dsa
    dsa.io/purpose: dns-restriction
spec:
  endpointSelector: {}
  egress:
    # Allow DNS to kube-dns, but restrict which names can be resolved
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            {{- include "infrastructure.clusterDNSPodLabels" $ | nindent 12 }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              # Own namespace
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "ai") }}.svc.cluster.local"
              # Audit (all services need this)
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "audit") }}.svc.cluster.local"
              # Bridge (rotation consumer needs to reach Bridge)
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "bridge") }}.svc.cluster.local"
{{- if .Values.global.llmEgressEnabled }}
              # External LLM provider DNS (when hosted LLMs are enabled)
              - matchPattern: "api.anthropic.com"
              - matchPattern: "api.openai.com"
              - matchPattern: "api.mistral.ai"
{{- end }}
---
# --- dsa-identity: can only resolve own namespace + bridge + audit ---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-restrict-identity
  namespace: {{ include "infrastructure.namespaceFor" (dict "root" $ "label" "identity") }}
  labels:
    app.kubernetes.io/part-of: dsa
    dsa.io/purpose: dns-restriction
spec:
{{- if include "infrastructure.sanitizerCoreEnabled" . }}
  # Kit 2.0 K-B fix round 3 (sol r2 P2): Cilium policies are additive, so
  # this namespace-wide grant must carve out the core and its registry DB
  # exactly like allow-dns (dns-egress.yaml). The registry DB resolves
  # nothing; the core resolves only what dns-restrict-identity-sanitizer-core
  # (below) lists.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - sanitizer-core
          - postgres-sanitizer-core
{{- else }}
  endpointSelector: {}
{{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            {{- include "infrastructure.clusterDNSPodLabels" $ | nindent 12 }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              # Own namespace
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "identity") }}.svc.cluster.local"
              # Bridge (token revocation)
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "bridge") }}.svc.cluster.local"
              # Audit
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "audit") }}.svc.cluster.local"
{{- if include "infrastructure.sanitizerCoreEnabled" . }}
---
# --- Kit 2.0: the sanitizer core Pod resolves its namespace + the witness ---
# Pod-scoped and the core's ONLY DNS policy (it is carved out of
# dns-restrict-identity above): its own namespace (the registry DB) and the
# witness by exact name. The registry DB is selected by no DNS policy at all.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-restrict-identity-sanitizer-core
  namespace: {{ include "infrastructure.namespaceFor" (dict "root" $ "label" "identity") }}
  labels:
    app.kubernetes.io/part-of: dsa
    dsa.io/purpose: dns-restriction
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sanitizer-core
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            {{- include "infrastructure.clusterDNSPodLabels" $ | nindent 12 }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              # Own namespace (its registry DB) — repeated so this policy is
              # complete on its own.
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "identity") }}.svc.cluster.local"
              # The witness claim port, by exact name only.
              - matchName: "veil-witness.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "witness") }}.svc.cluster.local"
{{- end }}
---
# --- dsa-bridge: can resolve own namespace + identity + ai + audit ---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-restrict-bridge
  namespace: {{ include "infrastructure.namespaceFor" (dict "root" $ "label" "bridge") }}
  labels:
    app.kubernetes.io/part-of: dsa
    dsa.io/purpose: dns-restriction
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            {{- include "infrastructure.clusterDNSPodLabels" $ | nindent 12 }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "bridge") }}.svc.cluster.local"
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "identity") }}.svc.cluster.local"
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "ai") }}.svc.cluster.local"
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "audit") }}.svc.cluster.local"
---
# --- dsa-edge (Gateway): can resolve all DSA namespaces ---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-restrict-edge
  namespace: {{ include "infrastructure.namespaceFor" (dict "root" $ "label" "edge") }}
  labels:
    app.kubernetes.io/part-of: dsa
    dsa.io/purpose: dns-restriction
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            {{- include "infrastructure.clusterDNSPodLabels" $ | nindent 12 }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "edge") }}.svc.cluster.local"
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "identity") }}.svc.cluster.local"
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "bridge") }}.svc.cluster.local"
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "ai") }}.svc.cluster.local"
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "audit") }}.svc.cluster.local"
---
# --- dsa-audit: can only resolve own namespace (no egress) ---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-restrict-audit
  namespace: {{ include "infrastructure.namespaceFor" (dict "root" $ "label" "audit") }}
  labels:
    app.kubernetes.io/part-of: dsa
    dsa.io/purpose: dns-restriction
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            {{- include "infrastructure.clusterDNSPodLabels" $ | nindent 12 }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.{{ include "infrastructure.namespaceFor" (dict "root" $ "label" "audit") }}.svc.cluster.local"
{{- end }}
