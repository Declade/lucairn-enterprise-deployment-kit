apiVersion: v1
kind: ConfigMap
metadata:
  name: sanitizer-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dsa
data:
  config.yaml: |
    sanitizer:
      freetext_fields: []
      # W5+ Phase 1 (2026-05-09) toggles — credential-class + adversarial-input
      # hardening. Both default ON. An unrecognised key is generally ignored by
      # the loader, so legacy `documented_placeholder_suppression_enabled`
      # (removed in TOB-160-001 to close a real-credential-leak path) is
      # silently dropped.
      #
      # ⚠️ "unrecognised keys are ignored" is NOT universally true, and
      # believing it is what shipped T-576. A key the sanitizer deliberately
      # RETIRED can be a boot REFUSAL rather than a no-op: config.py's
      # `_reject_retired_presidio_keys` raises on `presidio.strict_safe_terms_file`
      # and `presidio.gliner_stop_terms_file` so a still-set file cannot be
      # silently dropped into over-redaction. Never add a sanitizer key to this
      # ConfigMap without checking it against the image's config.py loader —
      # tests/test_sanitizer_retired_config_keys.sh guards the two known ones.
      detect_secrets_enabled: true
      adversarial_normalization_enabled: true
      # ── Consolidated never-redact surface ──────────────────────────────
      # T-576. Until kit 1.9.4 the strict whole-span-exact safe list rode
      # `presidio.strict_safe_terms_file: /config/safe-terms-strict.txt`. DSA
      # RETIRED that key (services/sanitizer/config.py:3181-3204, commit
      # 811ef43b0 2026-07-25, "consolidate 3 FP never-redact surfaces into
      # redaction_policy") and now REFUSES BOOT on it, with the migration
      # spelled out in the error text: move the terms to
      # `redaction_policy.stop_terms` with `surface: l1_strict`. The old key
      # therefore CrashLoopBackOffs the sanitizer sidecar on any sanitizer
      # image built after that commit → sandbox-a never Ready → the gateway's
      # isolation-invariant poller never verifies → the gateway restart-loops
      # on its own startup probe. A whole clean install fails to come up.
      #
      # `enabled` is deliberately LEFT UNSET (loader default false). The
      # l1_strict list is consumed unconditionally by the scanner
      # (presidio_scan.py:1598 unions `redaction_policy.l1_strict_terms` into
      # `_strict_safe_terms`, no `enabled` check), while `enabled: true` would
      # additionally activate the per-zone layer policy — a behaviour change
      # this chart has never shipped. Terms below are the verbatim contents of
      # the retired kit file: semantics are byte-identical (whole detected
      # span, lowercased + stripped, exact match, ANY entity type), so
      # "Claude" alone is suppressed while "Claude Müller" still redacts.
      #
      # ⛔ DO NOT add real given names or surnames here — that is an
      # under-redaction (a real identity would stop being redacted). DSA's
      # test_shipped_strict_safe_list_has_no_real_names enforces the same rule
      # upstream.
      redaction_policy:
        stop_terms:
          - {term: "Claude", surface: l1_strict}
          - {term: "Opus", surface: l1_strict}
          - {term: "Sonnet", surface: l1_strict}
          - {term: "Haiku", surface: l1_strict}
          - {term: "Anthropic", surface: l1_strict}
          - {term: "Lucairn", surface: l1_strict}
          - {term: "Codex", surface: l1_strict}
          - {term: "Veil", surface: l1_strict}
          - {term: "signable", surface: l1_strict}
          - {term: "Remedy", surface: l1_strict}
          {{- /*
            Operator extension point. The retired file was operator-editable
            (a replacement ConfigMap, or SANITIZER_STRICT_SAFE_TERMS_FILE on
            the Compose lane); this list is the replacement for that
            capability. Same shape as .Values.sanitizer.safePatterns below.
          */}}
          {{- range .Values.sanitizer.strictSafeTerms | default (list) }}
          - {term: {{ . | quote }}, surface: l1_strict}
          {{- end }}
      known_entity_matching:
        enabled: true
        strategies: [exact, cologne_phonetics, levenshtein]
        levenshtein_max_distance: 2
        location_context_window: 50
        # Customer-scoped PERSON name supplement. Override per-environment via
        # additional ConfigMap if surnames in the global german-names.txt
        # collide with common German words in your corpus.
        extra_person_names: []
      presidio:
        language_detection: auto
        default_language: de
        supported_languages: [de, en]
        # T-562 sweep — hasKey (NOT `| default`), same Sprig-0 trap as T-472
        # above: an explicit 0 is a schema-legitimate confidence floor (see
        # values.schema.json), but `default` would silently rewrite it to
        # 0.35. Pinned pre-fix by test_sanitizer_confidence_threshold_schema.sh
        # (T-517); that suite's 0-boundary assertion is updated in lockstep.
        {{- if hasKey (default dict .Values.sanitizer) "confidenceThreshold" }}
        confidence_threshold: {{ .Values.sanitizer.confidenceThreshold }}
        {{- else }}
        confidence_threshold: 0.35
        {{- end }}
        custom_recognizers:
          - sozialversicherungsnummer
          - us_ssn
          - steuer_id
          - personalausweisnummer
          - german_zip_code
          - credit_card_extended
          - phone_extended
          - german_names
          - german_street
          - date_of_birth
          - account_number
          - fallnummer
          - vin
          - license_plate
          - swift_bic
          - passport_number
          - drivers_license
          - street_address
          - password
          - krankenversichertennummer
          # W5+ Phase 1 (2026-05-09) — high-value SaaS secret prefixes + partial
          # credit-card-suffix idiom. Yelp detect-secrets is wired separately
          # in app.py via sanitizer.detect_secrets_enabled.
          - openai_api_key
          - anthropic_api_key
          - stripe_webhook_secret
          - jwt_token
          - github_pat
          - credit_card_suffix_idiom
          # Phase 3 (2026-05-09) — domain coverage expansion. German court
          # Aktenzeichen recognizer closes the gov/legal recall gap (was
          # 67.5%); 5 international PII recognizers (ES DNI/NIE, FR INSEE,
          # IT Codice Fiscale, BE RNN, NL BSN) close the international recall
          # gap (was 66.7%); generic order-number recognizer closes the
          # customer-service recall gap (was 74%).
          - german_aktenzeichen
          - spanish_dni
          - french_insee
          - italian_codice_fiscale
          - belgian_rnn
          - dutch_bsn
          - order_number
        # safe_terms_file: operators wanting any-word safe-terms suppression
        # must supply their own ConfigMap (e.g. medical-terms.txt) and mount
        # it at /config/medical-terms.txt, then uncomment the line below. The
        # default kit ConfigMap intentionally omits this to avoid a
        # missing-file warning on a clean install.
        # safe_terms_file: /config/medical-terms.txt
        # ⛔ NO `strict_safe_terms_file` HERE (T-576). The strict whole-span-
        # exact safe list now rides `sanitizer.redaction_policy.stop_terms`
        # (surface: l1_strict) above — see the note there. Re-adding this key
        # is a sanitizer BOOT REFUSAL, not a no-op.
        #
        # `spacy_location_stop_terms_file` below is NOT retired: config.py's
        # docstring at :3196-3198 names it and `safe_terms_file` as the two
        # file-based keys that stay VALID. Only strict_safe_terms_file and
        # gliner_stop_terms_file were consolidated away.
        #
        # A6 strict LOCATION stop-list (v0.5.2). Drops spaCy-NER LOCATION false
        # positives on common English words ("West"/"Loop"/…) mis-tagged in
        # messy ITSM/ServiceNow prose. Dropped ONLY when entity_type == LOCATION
        # on a single whole token present in the list — longer tokens, PERSON
        # spans, and real surnames-in-identity (L1) untouched. Delivered as the
        # `safe-terms-strict-location.txt` key in this ConfigMap (mounted at
        # /config/safe-terms-strict-location.txt by the /config volume binding).
        spacy_location_stop_terms_file: /config/safe-terms-strict-location.txt
        safe_patterns:
          # GPS / decimal coordinates: digits with 4+ decimal places.
          - '-?\d{1,3}\.\d{4,}'
          {{- range .Values.sanitizer.safePatterns | default (list) }}
          - {{ . | quote }}
          {{- end }}
      llm_audit:
        enabled: {{ .Values.sanitizer.llmAuditEnabled | default false }}
      llm_scan:
        enabled: {{ .Values.sanitizer.llmScanEnabled | default false }}
        ollama_url: "http://ollama-identity:11434"
        # T-375: SAME value the model-pull Job pulls
        # (ollama-identity-model-job.yaml). Hardcoding it here while the Job
        # created a differently-named model is exactly how this chart ended up
        # asking ollama-identity for `qwen2.5:7b` that nothing ever pulled.
        # Bumping to gemma4 is T-370 (gated on its own recall gate).
        #
        # If this model is absent from ollama-identity, the effective behaviour
        # is set by the AVAILABILITY POSTURE, not by `fallback_on_error` below
        # (T-393; the retired LUCAIRN_L3_REQUIRED used to decide it). The chart
        # sets no posture, so the sanitizer image's default applies: `degrade`
        # — L1+L2 served, llm_pii_scan dropped, and the witness independently
        # certifies COMPLETENESS_PARTIAL. Set
        # `global.l3AvailabilityPosture: reject` to fail closed.
        model: {{ .Values.sanitizer.llmScanModel | default "qwen2.5:7b" | quote }}
        # T-562 sweep — hasKey (NOT `| default`), same Sprig-0 trap as T-472
        # below: an explicit 0 must reach the sanitizer, which refuses it
        # loudly at boot (config.py: timeout_seconds must be > 0).
        {{- if hasKey (default dict .Values.sanitizer) "llmScanTimeout" }}
        timeout_seconds: {{ .Values.sanitizer.llmScanTimeout }}
        {{- else }}
        timeout_seconds: 30
        {{- end }}
        # T-472 — TOTAL request budget across every L3 call in one request.
        # `timeout_seconds` above bounds ONE call; without this a request that
        # makes many calls stays inside the per-call timeout while blowing far
        # past the worker timeout. The default matches the sanitizer image
        # default so a stock render is behaviour-neutral. Bound: the image
        # refuses to boot unless the value is finite, positive, and
        # <= GUNICORN_TIMEOUT - 25s.
        #
        # ⚠️ hasKey, NOT `| default 90` — Sprig's `default` treats an explicit
        # 0 as EMPTY, so `--set sandbox-a.sanitizer.llmScanRequestBudgetSeconds=0`
        # would silently render 90: the chart would swallow an invalid operator
        # input and boot a budget the operator never asked for, instead of
        # letting the sanitizer's boot validation reject it loudly. A rendered
        # 0 MUST reach the image. Same trap the veil-witness posture flags
        # document for boolean false.
        {{- if hasKey (default dict .Values.sanitizer) "llmScanRequestBudgetSeconds" }}
        request_budget_seconds: {{ .Values.sanitizer.llmScanRequestBudgetSeconds }}
        {{- else }}
        request_budget_seconds: 90
        {{- end }}
        # FAIL-01 (PRD prd-2026-05-29-fail-safe-scrubber): fail-CLOSED. When the
        # L3 deep PII shield (on-device Qwen via Ollama) is unavailable, the
        # sanitizer returns a 503 l3_scrubber_unavailable rather than silently
        # shipping a request with only L1+L2 coverage. The effective fail-mode
        # is governed by the LUCAIRN_L3_AVAILABILITY_POSTURE env var (T-393;
        # image default `degrade` → continue on L1+L2). Operators set
        # `global.l3AvailabilityPosture: reject` to restore this 503.
        fallback_on_error: "reject"
        # Default sequential (TOB-003 fix, 2026-05-09): "ensemble" silently
        # changes cert payload shape across ALL customers regardless of the
        # per-request enable_l3_reversals flag. Pro/Enterprise overlays opt in
        # explicitly via .Values.sanitizer.llmScanMode = "ensemble".
        mode: {{ .Values.sanitizer.llmScanMode | default "sequential" | quote }}
        # Calibrated against the 12-corpus domain bench to hit news-journalism
        # FP < 9% without leaking patient names.
        #
        # T-562 sweep — hasKey (NOT `| default`): an explicit 0 must reach the
        # sanitizer. In `mode: ensemble` config.py rejects it at boot
        # (restore_threshold must be in [0.5, 1.0]); in the default
        # `sequential` mode it is accepted with a log warning, not an error —
        # preserve-zero regardless, per the consuming-service-decides default.
        {{- if hasKey (default dict .Values.sanitizer) "llmScanRestoreThreshold" }}
        restore_threshold: {{ .Values.sanitizer.llmScanRestoreThreshold }}
        {{- else }}
        restore_threshold: 0.85
        {{- end }}

      # ──────────────────────────────────────────────────────────────────
      # Phase 7 — ML PII scanners (Piiranha + GLiNER) extracted into the
      # pii-ml gRPC sidecar (PR #240 production-path follow-up, "A3 Proper").
      #
      # CRITICAL: these blocks MUST nest UNDER `sanitizer:` (NOT at the
      # top of config.yaml). Sanitizer's config.py:506-522 reads them via
      # `sanitizer_data.get("piiranha", {})`, `sanitizer_data.get("gliner", {})`,
      # etc. — top-level keys are silently ignored. r1 bug-hunter BLOCKER-3
      # caught this rendering at the wrong indentation; DO NOT outdent.
      #
      # The blocks have TWO independent enable gates:
      #   1. The umbrella chart's `pii-ml.enabled` flag controls whether the
      #      sidecar DEPLOYS at all.
      #   2. The sanitizer-side `piiranha.enabled` / `gliner.enabled` flags
      #      below control whether the sanitizer attempts to CALL the sidecar.
      #
      # Helm operators opt into Phase 7 ML by flipping BOTH gates on. The
      # half-enabled combos are NON-fatal (no fail-fast guard yet, future
      # work) but documented misconfigurations:
      #   - sanitizer layers enabled + sidecar disabled → sanitizer dials a
      #     nonexistent service every scan; circuit breaker opens within 3
      #     requests and Phase 7 stays dormant (functional but log-noisy)
      #   - sidecar enabled + sanitizer layers disabled → wasted resources,
      #     Phase 7 layers never fire
      #
      # Closes contract-drift-detector DRIFT-001 (PR #241): the in-tree
      # config/default-sanitizer.yaml grew Phase 7 sections at PR #240; the
      # Helm-rendered sanitizer ConfigMap fell behind. Default-OFF here to
      # match the in-tree default-sanitizer.yaml, which is ALSO Phase-7-OFF
      # by default (Phase 7 suspended by default as of chart v1.7.1).
      # ──────────────────────────────────────────────────────────────────
      piiranha:
        enabled: {{ .Values.sanitizer.piiranha.enabled | default false }}
        # gRPC deadline per scan call (seconds). The sidecar's eager-load
        # pre-warms inference; first-call latency should be < 5s.
        #
        # T-562 sweep — hasKey (NOT `| default`), same Sprig-0 trap as T-472.
        # NOTE: currently INERT — main's sanitizer config.py loader reads only
        # `piiranha.enabled`/`confidence_threshold` into PiiranhaConfig; this
        # key parses but has zero behavioural effect until a consumer reads
        # it (verified against origin/main 2026-08-06; own ticket, not this
        # sweep). Fixed anyway so the render is correct the day it IS wired up.
        {{- if hasKey (default dict .Values.sanitizer.piiranha) "grpcDeadlineSeconds" }}
        grpc_deadline_seconds: {{ .Values.sanitizer.piiranha.grpcDeadlineSeconds }}
        {{- else }}
        grpc_deadline_seconds: 5
        {{- end }}

      gliner:
        enabled: {{ .Values.sanitizer.gliner.enabled | default false }}
        # T-562 sweep — hasKey (NOT `| default`). Same INERT-today caveat as
        # piiranha.grpcDeadlineSeconds above applies to all three gliner knobs
        # below (skip_min_text_len / skip_max_entity_density likewise unread
        # by main's GlinerConfig loader).
        {{- if hasKey (default dict .Values.sanitizer.gliner) "grpcDeadlineSeconds" }}
        grpc_deadline_seconds: {{ .Values.sanitizer.gliner.grpcDeadlineSeconds }}
        {{- else }}
        grpc_deadline_seconds: 5
        {{- end }}
        # Adaptive-skip thresholds. Sanitizer passes l1_l2_entity_count +
        # text_len to the sidecar; the sidecar applies these to decide
        # whether to run GLiNER inference at all (skipped_short / skipped_dense).
        {{- if hasKey (default dict .Values.sanitizer.gliner) "skipMinTextLen" }}
        skip_min_text_len: {{ .Values.sanitizer.gliner.skipMinTextLen }}
        {{- else }}
        skip_min_text_len: 32
        {{- end }}
        {{- if hasKey (default dict .Values.sanitizer.gliner) "skipMaxEntityDensity" }}
        skip_max_entity_density: {{ .Values.sanitizer.gliner.skipMaxEntityDensity }}
        {{- else }}
        skip_max_entity_density: 0.30
        {{- end }}

      k_anonymity:
        # k-anonymity is pure math — stays in-process in sanitizer (NOT in
        # the pii-ml sidecar). Default OFF for Helm operators; flip on via
        # `.Values.sanitizer.kAnonymity.enabled`. See PRD § Out of scope.
        enabled: {{ .Values.sanitizer.kAnonymity.enabled | default false }}
        # T-562 sweep — hasKey (NOT `| default`). NOTE: currently INERT — main's
        # KAnonymityConfig loader reads only `enabled`/`threshold`, never `k`
        # (verified against origin/main 2026-08-06; own ticket, not this
        # sweep). Fixed anyway so the render is correct the day it IS wired up.
        {{- if hasKey (default dict .Values.sanitizer.kAnonymity) "k" }}
        k: {{ .Values.sanitizer.kAnonymity.k }}
        {{- else }}
        k: 5
        {{- end }}

      pii_ml_client:
        # gRPC endpoint for the pii-ml sidecar. The default resolves to the
        # pii-ml subchart's Service in the sandbox-a namespace (dsa-identity).
        # Sanitizer's pii_ml_client.py dials this on every Phase 7 scan.
        endpoint: "{{ .Values.sanitizer.piiMlClient.endpoint | default (printf "pii-ml.%s.svc.cluster.local:50056" .Values.namespace) }}"
        # Per-scan gRPC deadline. Sanitizer's config.py reads `deadline_seconds`
        # (flat field, NOT nested). Missing → defaults to 5.0 silently.
        #
        # T-562 sweep — SCHEMA-REJECT, not hasKey (values.schema.json requires
        # > 0). This is a raw wall-clock gRPC transport timeout, the same
        # knob class as `llm_scan.timeout_seconds` above — and DSA's
        # config.py already refuses THAT one at 0 for exactly this reason
        # (config.py:2208, T-474). `PiiMlClientConfig` has no boot validation
        # at all, so an explicit 0 passed through would boot clean and then
        # fail every Piiranha/GLiNER gRPC call at runtime (`timeout=0` is a
        # doomed deadline, not "no timeout") — a config error wearing an
        # infrastructure fault's clothes, the exact shape T-474 was written to
        # prevent. Rejecting it before it ever reaches this line is cheaper
        # than waiting for DSA to grow the same boot guard. preserve-zero
        # remains the default for the other 10 knobs in this sweep; this is
        # the one deliberate exception (see PR body for the full table).
        deadline_seconds: {{ .Values.sanitizer.piiMlClient.deadlineSeconds | default 5 }}
        # Circuit breaker: open after N consecutive failures, half-open after
        # half_open_seconds. r1 kit-config-image-drift BLOCKER-2: sanitizer's
        # config.py:595-606 reads `circuit_breaker_open_after` /
        # `circuit_breaker_half_open_seconds` as FLAT fields on `pii_ml_client`
        # (NOT nested under a `circuit_breaker:` sub-mapping). Helm operators
        # tune via `.sanitizer.piiMlClient.circuitBreaker.{...}` (camelCase
        # values-tree convention preserved); the template flattens at render.
        #
        # T-562 sweep — hasKey (NOT `| default`) for both: a circuit-breaker
        # trip count / backoff of 0 is an unusual but coherent operator
        # choice ("open on the first failure" / "retry immediately"), not a
        # doomed transport timeout, so preserve-zero applies.
        {{- if hasKey (default dict .Values.sanitizer.piiMlClient.circuitBreaker) "consecutiveFailures" }}
        circuit_breaker_open_after: {{ .Values.sanitizer.piiMlClient.circuitBreaker.consecutiveFailures }}
        {{- else }}
        circuit_breaker_open_after: 3
        {{- end }}
        {{- if hasKey (default dict .Values.sanitizer.piiMlClient.circuitBreaker) "halfOpenSeconds" }}
        circuit_breaker_half_open_seconds: {{ .Values.sanitizer.piiMlClient.circuitBreaker.halfOpenSeconds }}
        {{- else }}
        circuit_breaker_half_open_seconds: 30
        {{- end }}

    qi_engine:
      # Controlled at runtime via QI_ENGINE_ENABLED, QI_ENGINE_THRESHOLD,
      # QI_ENGINE_ACTION env vars. Defaults shown here for reference:
      enabled: false
      threshold: 0.25
      action: generalize
  # T-576: the `safe-terms-strict.txt` data key was DELETED here. It existed
  # only to back `presidio.strict_safe_terms_file`, which the sanitizer
  # retired (boot refusal). Its ten terms now live inline in config.yaml
  # under sanitizer.redaction_policy.stop_terms (surface: l1_strict), which
  # is where the current sanitizer reads them from. Leaving the key behind
  # would have mounted a file nothing reads.
  # A6 strict LOCATION stop-list (v0.5.2). Mounted alongside config.yaml in the
  # /config directory (sanitizer volumeMount: mountPath: /config). Referenced by
  # spacy_location_stop_terms_file: /config/safe-terms-strict-location.txt above.
  # Drops spaCy-NER LOCATION false positives on common English words mis-tagged
  # in messy ITSM/ServiceNow prose. A detection is dropped ONLY when ALL hold:
  # (1) entity_type == LOCATION, (2) the firing recognizer is spaCy's own NER
  # (never de_places/street_address/...), (3) the span is a SINGLE token, and
  # (4) the lowercased span exactly equals a term here. Multi-word places
  # ("West Berlin"), longer tokens ("Westminster"), PERSON-tagged "West", and L1
  # identity surnames are all untouched — recall-safe by construction. `de`
  # de_places (German text) is unaffected. `marc`/`grep`/`may` are deliberately
  # excluded as real-name/real-PII risks. Mirrors config/safe-terms-strict-location.txt.
  safe-terms-strict-location.txt: |
    # Strict whole-token LOCATION stop-list for the L2 spaCy NER (over-redaction
    # tuning workstream, A6 — PRD prd-2026-06-14-overredaction-tuning.md).
    #
    # SEMANTICS (recall-safe by construction — see presidio_scan._is_spacy_location_stopword):
    #   A spaCy-NER detection is dropped ONLY when ALL hold:
    #     1. entity_type == LOCATION, AND
    #     2. the firing recognizer is spaCy's own NER (`SpacyRecognizer`) — never
    #        a custom/structured recognizer (de_places, street_address, ...), AND
    #     3. the detected span is a SINGLE token (no internal whitespace), AND
    #     4. the lowercased span EXACTLY equals a term in this file.
    #
    #   Multi-word places ("West Berlin") are one span → condition (3) fails →
    #   still redacted. Longer single tokens ("Westminster") fail (4). A PERSON-
    #   tagged "West" fails (1). An identity surname "West" is caught by L1
    #   token_last_name BEFORE L2 runs. The `de` de_places list is UNTOUCHED.
    #
    # `west` and `for` are the two live-confirmed A6 false positives from the
    # real /lucairn-start run (conv 3cde524c); the rest are pre-vetted Slice-3
    # en-exclusion terms. `marc`, `grep`, and `may` are deliberately EXCLUDED as
    # real-name / real-PII risks. Errs toward over-redaction by design.
    #
    # Source: A6 of PRD prd-2026-06-14-overredaction-tuning.md.
    #
    below
    block
    bug
    bulk
    first
    for
    grill
    hub
    just
    last
    line
    list
    loop
    over
    plan
    rank
    see
    slop
    west
