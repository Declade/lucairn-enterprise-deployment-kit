{{- $mtlsEnabled := and (kindIs "bool" .Values.global.mtls.enabled) .Values.global.mtls.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dsa
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/part-of: dsa
    spec:
      serviceAccountName: {{ .Chart.Name }}
      # Graceful connection draining on rolling restart / node drain (HA-04).
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      # DNS search list workaround for the sandbox-a binary's hostname
      # regex, which rejects FQDNs (sandbox-b.dsa-ai.svc.cluster.local)
      # but accepts short hostnames. With this search list, the
      # SANDBOX_B_PROBE_TARGET="sandbox-b:50054" lookup below resolves
      # via dsa-ai.svc.cluster.local at DNS resolution time — short
      # hostname goes through the binary's regex, FQDN translation
      # happens at the resolver. (Vast-verify finding #6 chart-side
      # workaround. A DSA-side regex fix is the architectural answer
      # for v1.0.1; this closes the install gate today without an
      # image republish.)
      dnsConfig:
        searches:
          - dsa-ai.svc.cluster.local
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- if .Values.global.nodeIsolation }}
      # Node pool isolation: Sandbox A and Sandbox B must never share a node.
      # This prevents container-escape attacks from crossing the identity/AI boundary.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dsa.io/zone
                    operator: In
                    values:
                      - identity
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - sandbox-b
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: dsa.io/zone
          operator: Equal
          value: identity
          effect: NoSchedule
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-addr=:{{ .Values.service.grpcPort }}"
            - "-health-addr=:{{ .Values.service.healthPort }}"
          env:
            {{- if $mtlsEnabled }}
            - name: DSA_MTLS_CA_BUNDLE_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.caBundleKey }}"
            - name: DSA_MTLS_SERVER_CERT_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.certKey }}"
            - name: DSA_MTLS_SERVER_KEY_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.keyKey }}"
            - name: DSA_MTLS_CLIENT_CERT_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.certKey }}"
            - name: DSA_MTLS_CLIENT_KEY_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.keyKey }}"
            - name: DSA_MTLS_SERVER_NAME
              value: "dsa-sandbox-a"
            {{- end }}
            - name: SANDBOX_A_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: DATABASE_URL
            - name: SANDBOX_A_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: ENCRYPTION_KEY
            - name: AUDIT_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: AUDIT_SERVICE_ADDR
            - name: DSA_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: DSA_ADMIN_KEY
            - name: GRPC_TLS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: GRPC_TLS_ENABLED
            - name: SANDBOX_A_EPHEMERAL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: SANDBOX_A_EPHEMERAL
            - name: SANITIZER_ADDR
              value: "http://localhost:8086"
            - name: SANDBOX_B_PROBE_TARGET
              # SHORT hostname — the sandbox-a binary's input regex
              # rejects FQDNs. The pod's dnsConfig.searches above
              # (dsa-ai.svc.cluster.local) makes the kubelet resolver
              # try the full FQDN at lookup time. (Vast-verify finding #6
              # chart-side workaround.)
              value: "sandbox-b:50054"
            - name: DSA_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: DSA_ENV
            - name: DSA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: DSA_SERVICE_TOKEN
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if $mtlsEnabled }}
          volumeMounts:
            - name: enterprise-mtls-sandbox-a
              mountPath: {{ .Values.global.mtls.mountPath | quote }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if and .Values.gracefulShutdown (gt (int (.Values.gracefulShutdown.preStopSleepSeconds | default 0)) 0) }}
          # preStop drain delay (HA-04): hold the container open while
          # kube-proxy removes this pod from Service endpoints, so in-flight
          # requests are not dropped on rolling restart / node drain. The
          # runtime image is alpine, so /bin/sh + sleep are available.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ int .Values.gracefulShutdown.preStopSleepSeconds }}"]
          {{- end }}
        - name: sanitizer
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.sanitizer.image.repository }}:{{ .Values.sanitizer.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.sanitizer.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: sanitizer
              containerPort: 8086
              protocol: TCP
          env:
            {{- if $mtlsEnabled }}
            - name: DSA_MTLS_CA_BUNDLE_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.caBundleKey }}"
            - name: DSA_MTLS_SERVER_CERT_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.certKey }}"
            - name: DSA_MTLS_SERVER_KEY_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.keyKey }}"
            - name: DSA_MTLS_CLIENT_CERT_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.certKey }}"
            - name: DSA_MTLS_CLIENT_KEY_PATH
              value: "{{ .Values.global.mtls.mountPath }}/{{ .Values.global.mtls.keyKey }}"
            - name: DSA_MTLS_SERVER_NAME
              value: "dsa-sanitizer"
            {{- end }}
            - name: SANITIZER_CONFIG_PATH
              value: /config/config.yaml
            - name: SANITIZER_PORT
              value: "8086"
            # M12 fix (2026-06-23): gunicorn worker timeout. Compose sets
            # 120 s (docker-compose.customer.yml:511); the chart previously
            # omitted this, causing 503 on large prompts due to gunicorn's
            # built-in 30 s default. Mirror the Compose value.
            - name: GUNICORN_TIMEOUT
              value: {{ .Values.sanitizer.gunicornTimeout | default 120 | quote }}
            - name: HOME
              value: /tmp/home
            - name: LCR_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: LCR_ENABLED
            - name: LCR_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: LCR_SIGNING_KEY
            - name: CANARY_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: CANARY_HMAC_KEY
            - name: LCR_WITNESS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: LCR_WITNESS_ADDR
            - name: QI_ENGINE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: QI_ENGINE_ENABLED
            - name: QI_ENGINE_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: QI_ENGINE_THRESHOLD
            - name: QI_ENGINE_ACTION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: QI_ENGINE_ACTION
            # ── L3 REQUEST-AVAILABILITY POSTURE (T-393) ───────────────────────
            #
            # The sanitizer owns ONE L3 question and only one: what happens to a
            # REQUEST when the deep PII shield is unavailable. What the
            # CERTIFICATE then claims is the witness's concern, decided by
            # LUCAIRN_L3_COMPLETENESS_POSTURE on the veil-witness pod. The two
            # used to be welded to the single LUCAIRN_L3_REQUIRED env var; PRD
            # prd-2026-08-01-l3-availability-vs-certificate-honesty-split.md
            # split them, so this pod no longer has to "agree" with the witness —
            # they answer different questions and cannot contradict each other.
            #
            # ⚠️ WHY BOTH ENTRIES BELOW ARE CONDITIONAL — THIS IS THE T-393 FIX.
            # LUCAIRN_L3_REQUIRED used to render UNCONDITIONALLY here (an `else`
            # branch emitted "false", and the umbrella's own values.yaml supplied
            # the key anyway, so it was ALWAYS present). The sanitizer image that
            # carries the posture split treats a set legacy flag beside an unset
            # LUCAIRN_L3_AVAILABILITY_POSTURE as an un-migrated deployment and
            # REFUSES TO START (services/sanitizer/config.py,
            # `l3_availability_posture`'s `not _env_present(...)` raise), so
            # rendering the retired flag unconditionally CrashLooped the
            # sanitizer on every kit install from an image bump alone. Neither
            # variable is emitted now unless the operator chose it, so a stock
            # render hands the image NOTHING and its own default applies:
            # "degrade" — an L3 outage serves L1+L2 rather than 503-ing, while
            # the witness independently certifies PARTIAL.
            {{- $g := (default dict .Values.global) }}
            {{- /*
                 MIRROR of validators.l3LegacyFlagWithoutPosture, deliberately
                 duplicated here rather than trusted to the umbrella (T-393
                 review, MEDIUM-5). The umbrella validator reads `.Values.global`
                 at UMBRELLA scope; this template reads the SUBCHART's coalesced
                 `.Values.global`, and the two are not the same map — Helm
                 propagates `global` asymmetrically, and a values file that sets
                 `sandbox-a.global.l3Required` reaches THIS map without ever
                 passing the umbrella guard. Verified reachable:
                 `--set sandbox-a.global.l3Required=true` rendered the retired
                 flag with no posture, i.e. the exact CrashLoop state T-393
                 exists to prevent. A guard has to live where the render happens.
            */}}
            {{- /*
                 The ENUM half of the same mirror. `validators.l3PostureValues`
                 also reads umbrella scope, so `--set
                 sandbox-a.global.l3AvailabilityPosture=true` — the guard's own
                 documented most-likely typo, a rename that kept the retired
                 value — rendered straight through to a pod the image refuses to
                 boot. Both halves have to be mirrored or the bypass just moves
                 from one guard to the other.
                 Empty/null is ABSENCE (the image applies its default);
                 whitespace-only is a value and is refused, exactly as
                 services/sanitizer/config.py `_parse_strict_enum` does.
            */}}
            {{- /*
                 T-548 (2026-08-17): this coercion was
                 `toString (default "" ...)`, and Sprig's `default` calls the
                 BOOLEAN `false` and the NUMBER `0` empty. So
                 `--set global.l3AvailabilityPosture=false` — a bare literal
                 Helm infers as a YAML boolean, and the guard's OWN documented
                 most-likely typo (renaming retired l3Required and keeping its
                 value) — coerced to "", the absence short-circuit below
                 swallowed it, and this allowlist never ran. `hasKey` stayed
                 true, so LUCAIRN_L3_AVAILABILITY_POSTURE: "false" rendered into
                 the pod and the sanitizer refused it at boot. `true`/`1` were
                 always caught (non-empty to Sprig), which is why only the
                 false/0 half of the enum was open. `kindIs "invalid"` carves
                 out ONLY untyped nil (a null `key:`), so every real value —
                 including false and 0 — is compared verbatim. An empty STRING
                 is still absence. Same carve-out as the T-490 secret guards.
            */}}
            {{- if hasKey $g "l3AvailabilityPosture" }}
            {{- $rawVal := $g.l3AvailabilityPosture }}
            {{- $raw := ternary "" (toString $rawVal) (kindIs "invalid" $rawVal) }}
            {{- if and (ne $raw "") (not (has (lower (trim $raw)) (list "degrade" "reject"))) }}
            {{- fail "sandbox-a: global.l3AvailabilityPosture must be \"degrade\" or \"reject\" (value withheld). The sanitizer refuses to start on an off-allowlist posture rather than guessing the weaker one, so this render would CrashLoopBackOff. If you renamed the retired global.l3Required and kept its value: true becomes \"reject\", false becomes \"degrade\". Omit the key entirely to take the image default, \"degrade\". NOTE: if you set this under a subchart key (sandbox-a.global.*) rather than the umbrella global, set the umbrella key instead — a subchart-scoped global bypasses the chart's umbrella validators." }}
            {{- end }}
            {{- end }}
            {{- if and (hasKey $g "l3Required") (not (hasKey $g "l3AvailabilityPosture")) }}
            {{- fail "sandbox-a: l3Required is set in this pod's resolved `global` without l3AvailabilityPosture. LUCAIRN_L3_REQUIRED is RETIRED (T-393) and the sanitizer image REFUSES TO START when it sees the retired flag beside an unset LUCAIRN_L3_AVAILABILITY_POSTURE — this render would produce a CrashLoopBackOff. Set global.l3AvailabilityPosture=degrade|reject (what happens to a REQUEST when L3 is unavailable; the retired true meant `reject`, false meant `degrade`), then delete l3Required. Leaving both unset is supported and is what the kit ships. NOTE: if you set this under a subchart key (sandbox-a.global.*) rather than the umbrella global, set the umbrella key instead — a subchart-scoped global bypasses the chart's other L3 guards." }}
            {{- end }}
            {{- if hasKey $g "l3AvailabilityPosture" }}
            # "degrade" (image default) — an L3 outage continues on L1+L2.
            # "reject" — 503 l3_scrubber_unavailable, the fail-CLOSED posture
            # the retired LUCAIRN_L3_REQUIRED=true selected.
            - name: LUCAIRN_L3_AVAILABILITY_POSTURE
              value: {{ $g.l3AvailabilityPosture | quote }}
            {{- end }}
            {{- if hasKey $g "l3Required" }}
            # RETIRED. Emitted only because the operator still sets
            # global.l3Required, so an image that still reads it keeps behaving
            # as before. On the posture-split image this is a migration
            # tripwire, and validators.l3LegacyFlagWithoutPosture
            # (charts/lucairn/templates/_validators.tpl) refuses the render
            # unless both replacement postures are set alongside it.
            - name: LUCAIRN_L3_REQUIRED
              value: {{ $g.l3Required | quote }}
            {{- end }}
            # Phase 7 ML sidecar wiring (PR #240 production-path follow-up).
            # Sanitizer's pii_ml_client.py reads LUCAIRN_PII_ML_ADDR at boot
            # and dials this on every Phase 7 scan. Default resolves to the
            # pii-ml subchart's Service in this namespace; override via
            # .Values.sanitizer.piiMlClient.endpoint if pii-ml is deployed
            # to a non-default namespace or to an external endpoint.
            #
            # When Phase 7 is disabled (sanitizer.piiranha.enabled=false +
            # sanitizer.gliner.enabled=false) this env is still emitted but
            # never consumed; sanitizer's pii_ml_client.py only dials when
            # the layer is enabled in the rendered config.yaml. Setting an
            # invalid endpoint here is therefore non-fatal in the
            # Phase-7-disabled topology.
            - name: LUCAIRN_PII_ML_ADDR
              value: "{{ .Values.sanitizer.piiMlClient.endpoint | default (printf "pii-ml.%s.svc.cluster.local:50056" .Values.namespace) }}"
            # T-64 (2026-07-27): honestly declare the transport of the
            # LUCAIRN_PII_ML_ADDR hop above. See values.yaml
            # sanitizer.piiMlClient.transport for the full rationale — this
            # is a forward-compatible declaration, INERT against the
            # sanitizer code currently on main (which does not read this
            # var). It is only consumed once the not-yet-merged
            # feat/gliner-remote-fallback branch's declared-transport
            # vocabulary (LUCAIRN_PII_ML_TRANSPORT env-var fallback,
            # services/sanitizer/config.py) ships in a kit release.
            #
            # DERIVE, DON'T GUESS — three cases, none of which can break an
            # existing install (round 5, review-driven, 2026-07-30):
            #
            #   1. Stock endpoint (unset, or written to the EXACT stock
            #      in-cluster DNS name) and no .transport declared ->
            #      auto-derive "in_box_plaintext". This is the only case
            #      where "in-box" is true by construction. Writing the stock
            #      address explicitly doesn't move the dial target, so it is
            #      treated the same as leaving it empty.
            #
            #   2. .transport declared explicitly -> emit it verbatim. The
            #      operator owns the claim.
            #
            #   3. Endpoint overridden to a NON-stock address and no
            #      .transport declared -> emit NOTHING. The chart will not
            #      guess a transport for an address whose topology it does
            #      not know (address-shape inference is the exact unsound
            #      pattern the DSA side deleted:
            #      services/sanitizer/pii_ml_client.py, is_local_endpoint()
            #      removed). Omitting the var leaves the hop UNDECLARED,
            #      which is byte-identical to every kit release shipped so
            #      far and to what main's sanitizer sees today.
            #
            #      ⚠️ This case deliberately does NOT `fail` the render.
            #      A cross-namespace in-cluster pii-ml Service is a
            #      documented, supported override (values.yaml:
            #      "Override only if pii-ml is deployed to a non-default
            #      namespace OR an external endpoint"), so failing here
            #      would hard-break `helm upgrade` for existing installs
            #      that did nothing wrong. T-64 asked for a declaration,
            #      not a fail-closed gate.
            {{- $piiMl := .Values.sanitizer.piiMlClient }}
            {{- $piiMlStockEndpoint := printf "pii-ml.%s.svc.cluster.local:50056" .Values.namespace }}
            {{- $piiMlEndpointValue := ($piiMl.endpoint | default "") }}
            {{- $piiMlEndpointOverridden := and $piiMl (ne $piiMlEndpointValue "") (ne $piiMlEndpointValue $piiMlStockEndpoint) }}
            {{- $piiMlTransportDeclared := ($piiMl.transport | default "") }}
            {{- /*
                 Inverse-contradiction guard (round 5): declaring
                 transport="tailnet" while the endpoint is the stock
                 in-cluster Service DNS name is self-contradictory — the
                 chart itself renders that address as an in-box
                 *.svc.cluster.local hop, so "tailnet" would be a false
                 declaration on the very evidence surface this key exists to
                 keep honest. Reject it. This CANNOT break any existing
                 install: `transport` is a brand-new key introduced by this
                 change, so no deployed values file can already carry it.
            */}}
            {{- if and (eq $piiMlTransportDeclared "tailnet") (not $piiMlEndpointOverridden) }}
            {{- fail (printf "sanitizer.piiMlClient.transport is set to \"tailnet\" but sanitizer.piiMlClient.endpoint resolves to the stock in-cluster pii-ml Service (%q) — that hop is in-box by construction, so \"tailnet\" would be a false transport declaration. Either set sanitizer.piiMlClient.endpoint to the actual off-box/tailnet address, or set sanitizer.piiMlClient.transport to \"in_box_plaintext\" (or leave it empty to auto-derive). From the top-level umbrella chart these paths are sandbox-a.sanitizer.piiMlClient.{transport,endpoint}. See values.yaml sanitizer.piiMlClient.transport and T-64." $piiMlStockEndpoint) -}}
            {{- end }}
            {{- $piiMlTransport := $piiMlTransportDeclared }}
            {{- if and (eq $piiMlTransportDeclared "") (not $piiMlEndpointOverridden) }}
            {{- $piiMlTransport = "in_box_plaintext" }}
            {{- end }}
            {{- if ne $piiMlTransport "" }}
            - name: LUCAIRN_PII_ML_TRANSPORT
              value: {{ $piiMlTransport | quote }}
            {{- else }}
            # LUCAIRN_PII_ML_TRANSPORT intentionally NOT emitted: case 3
            # above — sanitizer.piiMlClient.endpoint is overridden to a
            # non-stock address ({{ $piiMlEndpointValue }}) and
            # sanitizer.piiMlClient.transport was not declared, so the chart
            # has no sound basis for a transport claim and leaves the hop
            # undeclared (same as every prior kit release). Set
            # sanitizer.piiMlClient.transport to "tailnet" or
            # "in_box_plaintext" to declare it.
            {{- end }}
            # Sanitizer content-address cache — see INSTALL.md § "Sanitizer
            # content cache (Redis — default ON)" for the operator runbook.
            # Default "redis" uses the bundled redis-sanitizer-cache StatefulSet
            # in this namespace. The sanitizer app.py fails-OPEN on any Redis
            # error (cache miss, not 500) so the scanner pipeline is never
            # blocked by cache outage.
            #
            # sanitizerCache.enabled  — controls whether the BUNDLED
            #   redis-sanitizer-cache StatefulSet is deployed. It does NOT
            #   force the backend to "memory". Set enabled=false + backend=redis
            #   + redisUrl=<external> to point at an operator-managed Redis
            #   without deploying the bundled StatefulSet.
            # sanitizerCache.backend  — controls which backend the sanitizer
            #   uses ("redis" or "memory"). Defaults to "redis".
            # sanitizerCache.redisUrl — URL passed to the sanitizer when
            #   backend=redis. Defaults to the bundled service DNS when empty.
            - name: SANITIZER_CACHE_BACKEND
              value: {{ .Values.sanitizerCache.backend | default "redis" | quote }}
            {{- if eq (.Values.sanitizerCache.backend | default "redis") "redis" }}
            - name: SANITIZER_CACHE_REDIS_URL
              value: {{ .Values.sanitizerCache.redisUrl | default (printf "redis://%s-sanitizer-cache.%s.svc.cluster.local:6379/0" .Chart.Name .Values.namespace) | quote }}
            - name: SANITIZER_CACHE_TTL_SECONDS
              value: {{ .Values.sanitizerCache.ttlSeconds | default 3600 | quote }}
            {{- end }}
            # Streaming chunk-aware state backend (TMS Slice 3 / DSA PR #267).
            # Closes kit issue #68: without these env vars the sanitizer falls
            # back to the per-worker in-process store, which causes ~88%
            # FAIL-CLOSED under gunicorn cross-worker routing (each chunk of one
            # SSE stream may land on a DIFFERENT worker; per-worker state is lost
            # → bail fires on the very next chunk).
            #
            # SANITIZER_STREAM_STATE_BACKEND — "redis" (default) uses the shared
            #   Redis so ANY gunicorn worker rehydrates the exact per-stream
            #   PlaceholderRegistry + tail-buffer the prior chunk produced. Set to
            #   "memory" only as a temporary revert if Redis is unavailable.
            #
            # SANITIZER_STREAM_STATE_REDIS_URL — resolves to the SAME Redis URL
            #   as SANITIZER_CACHE_REDIS_URL so both always share the same Redis
            #   instance (bundled or external). Resolution order:
            #     1. sanitizerStreamState.redisUrl (explicit override)
            #     2. sanitizerCache.redisUrl        (mirrors the cache URL — covers
            #                                        the external-Redis topology where
            #                                        sanitizerCache.enabled=false)
            #     3. bundled service DNS              (default bundled StatefulSet)
            #   Stream-state keys use a SEPARATE key prefix ("tms:stream:")
            #   and never collide with the content-cache ("tms:cache:") or the
            #   DP-budget namespace ("privacy_budget:") on the other Redis instance.
            #
            # SANITIZER_STREAM_STATE_TTL_SECONDS — per-stream state key TTL (s).
            #   Default 300 (5 min). Set >= the longest expected streaming response.
            #
            # SANITIZER_STREAM_MUTATION_MARKER_TTL_SECONDS — cert-integrity
            #   mutation-marker TTL (s). MUST be strictly > STREAM_STATE_TTL_SECONDS
            #   (sanitizer fails-fast and clamps on boot if violated). The marker
            #   survives the stream state so the gateway can detect mid-stream fresh-
            #   state resets that would produce an unsigned cert with renumbered
            #   placeholders. Default (unset) = max(2×ttlSeconds, ttlSeconds+60);
            #   if you set it ≤ state TTL the sanitizer clamps it up to ttlSeconds+60.
            #   Both TTL vars are emitted unconditionally (also read by the memory
            #   store) so backend=memory operators' ttlSeconds/mutationMarkerTtlSeconds
            #   overrides take effect.
            - name: SANITIZER_STREAM_STATE_BACKEND
              value: {{ .Values.sanitizerStreamState.backend | default "redis" | quote }}
            {{- if eq (.Values.sanitizerStreamState.backend | default "redis") "redis" }}
            - name: SANITIZER_STREAM_STATE_REDIS_URL
              {{- $streamRedisUrl := .Values.sanitizerStreamState.redisUrl | default "" }}
              {{- if $streamRedisUrl }}
              value: {{ $streamRedisUrl | quote }}
              {{- else if .Values.sanitizerCache.redisUrl }}
              value: {{ .Values.sanitizerCache.redisUrl | quote }}
              {{- else }}
              value: {{ printf "redis://%s-sanitizer-cache.%s.svc.cluster.local:6379/0" .Chart.Name .Values.namespace | quote }}
              {{- end }}
            {{- end }}
            - name: SANITIZER_STREAM_STATE_TTL_SECONDS
              value: {{ .Values.sanitizerStreamState.ttlSeconds | default 300 | quote }}
            - name: SANITIZER_STREAM_MUTATION_MARKER_TTL_SECONDS
              value: {{ .Values.sanitizerStreamState.mutationMarkerTtlSeconds | default 600 | quote }}
          volumeMounts:
            - name: sanitizer-config
              mountPath: /config
            - name: sanitizer-tmp
              mountPath: /tmp
            - name: sanitizer-home
              mountPath: /tmp/home
            {{- if $mtlsEnabled }}
            - name: enterprise-mtls-sanitizer
              mountPath: {{ .Values.global.mtls.mountPath | quote }}
              readOnly: true
            - name: sanitizer-mtls-probe
              mountPath: /opt/lucairn/probes
              readOnly: true
            {{- end }}
          startupProbe:
            {{- if $mtlsEnabled }}
            exec:
              command:
                - python3
                - /opt/lucairn/probes/sanitizer-mtls-probe.py
                - /healthz
            {{- else }}
            httpGet:
              path: /healthz
              port: sanitizer
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 5
            {{- if $mtlsEnabled }}
            timeoutSeconds: 5
            {{- end }}
            failureThreshold: 60
          livenessProbe:
            {{- if $mtlsEnabled }}
            exec:
              command:
                - python3
                - /opt/lucairn/probes/sanitizer-mtls-probe.py
                - /healthz
            {{- else }}
            httpGet:
              path: /healthz
              port: sanitizer
            {{- end }}
            periodSeconds: 10
            {{- if $mtlsEnabled }}
            timeoutSeconds: 5
            {{- end }}
          readinessProbe:
            # /readyz (not /healthz) so readiness means the sanitizer is
            # FUNCTIONALLY ready — Presidio NLP engine warmed and the PII
            # pipeline loaded — not merely that the HTTP listener is up.
            # /healthz is connectivity-only and would flip the sidecar
            # Ready while it still 503s real /v1/sanitize traffic (HA-09).
            {{- if $mtlsEnabled }}
            exec:
              command:
                - python3
                - /opt/lucairn/probes/sanitizer-mtls-probe.py
                - /readyz
            {{- else }}
            httpGet:
              path: /readyz
              port: sanitizer
            {{- end }}
            periodSeconds: 10
            {{- if $mtlsEnabled }}
            timeoutSeconds: 5
            {{- end }}
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "1000m"
      volumes:
        - name: sanitizer-config
          configMap:
            name: sanitizer-config
        - name: sanitizer-tmp
          emptyDir: {}
        - name: sanitizer-home
          emptyDir:
            sizeLimit: 500Mi
        {{- if $mtlsEnabled }}
        - name: sanitizer-mtls-probe
          configMap:
            name: sanitizer-mtls-probe
            defaultMode: 0444
        - name: enterprise-mtls-sandbox-a
          secret:
            secretName: {{ .Values.global.mtls.secrets.sandboxA }}
            items:
              - key: {{ .Values.global.mtls.caBundleKey }}
                path: {{ .Values.global.mtls.caBundleKey }}
              - key: {{ .Values.global.mtls.certKey }}
                path: {{ .Values.global.mtls.certKey }}
              - key: {{ .Values.global.mtls.keyKey }}
                path: {{ .Values.global.mtls.keyKey }}
        - name: enterprise-mtls-sanitizer
          secret:
            secretName: {{ .Values.global.mtls.secrets.sanitizer }}
            items:
              - key: {{ .Values.global.mtls.caBundleKey }}
                path: {{ .Values.global.mtls.caBundleKey }}
              - key: {{ .Values.global.mtls.certKey }}
                path: {{ .Values.global.mtls.certKey }}
              - key: {{ .Values.global.mtls.keyKey }}
                path: {{ .Values.global.mtls.keyKey }}
        {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
