{{- /*
  Model-pull Job for the L3 PII-plane runtime.

  REVISION-SUFFIXED NAME (bug-hunter F1 / ToB TOB-008). Kubernetes treats
  Job spec.template as IMMUTABLE for an existing resource, so a fixed-name
  Job makes `helm upgrade` fail outright on any install that already ran it,
  AND the Job can never re-run when `sanitizer.llmScanModel` changes — the
  chart would claim a new model while the cluster kept serving the old one.
  The `-r{{ .Release.Revision }}` suffix is the convention this chart already
  uses for exactly this reason; see migration-job.yaml:2-11.

  RENDER GATE (bug-hunter F3): also gated on the model-registry egress flag.
  `ollama pull` ALWAYS performs a registry round-trip, so with
  `global.identityModelRegistryEgress: false` (the documented air-gap path)
  this Job could only ever fail. It is omitted instead, and the offline model
  must be pre-seeded into the ollama-identity PVC (see values.yaml). An
  absent key resolves to ENABLED — only an explicit `false` suppresses the
  Job, so a standalone subchart install never silently loses its model pull.
*/ -}}
{{- if and .Values.sanitizer.llmScanEnabled (ne .Values.global.identityModelRegistryEgress false) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-identity-model-pull-r{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ollama-identity-model-pull
    app.kubernetes.io/part-of: dsa
spec:
  backoffLimit: 3
  # HARD WALL-CLOCK BOUND (bug-hunter F4). The readiness cap below bounds only
  # the WAIT for ollama-identity; the multi-GB `ollama pull` itself is
  # unbounded, so a stalled registry connection leaves the Job Running forever
  # — the exact hang the readiness cap was added to prevent. activeDeadlineSeconds
  # fails the Job for real. Sized generously for a multi-GB pull on a slow link.
  #
  # SCOPE OF "generously" (T-370): this deadline bounds the WHOLE Job — the
  # readiness wait below (up to 300 s) AND every `backoffLimit: 3` retry, which
  # does NOT reset the clock. The transfer budget is therefore 3300 s of the
  # 3600 s default, i.e. ~11.4 Mbit/s sustained for the shipped ~4.7 GB model
  # but ~48.5 Mbit/s for a 20 GB one. Raise this value alongside any large-model
  # bump on a slow link; docs/L3_MODEL_UPGRADE.md § 2.5 has the table.
  activeDeadlineSeconds: {{ default 3600 .Values.sanitizer.llmScanModelPullDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-identity-model-pull
        dsa.io/model-pull: "true"
        dsa.io/sandbox: identity
    spec:
      # NET-05: this pod never calls the Kubernetes API; using the
      # namespace default ServiceAccount it would still auto-mount an
      # unused token. Disable the mount at the pod level.
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        # T-375 (supply chain): this job used to fetch a custom
        # `pii-scanner-v2.gguf` over PLAINTEXT HTTP with basic auth from a
        # hardcoded bare IP, then `ollama create` it from a Modelfile whose
        # SYSTEM prompt was baked in. That download hop was an unauthenticated,
        # unverified channel into the PII-detection model itself: whoever owned
        # that address could serve weights that selectively miss PII while every
        # certificate still reported a clean L3 pass.
        #
        # The model is now pulled by NAME from the official Ollama registry over
        # HTTPS — the same mechanism sandbox-b already uses
        # (charts/lucairn/charts/sandbox-b/templates/ollama-model-pull-job.yaml).
        # `ollama pull` is issued against the ollama-identity SERVER via
        # OLLAMA_HOST, so the server performs the registry fetch straight into
        # its own PVC; this job holds no model bytes and needs no volumes.
        #
        # The baked Modelfile is GONE and nothing regressed: the sanitizer sends
        # its own complete system prompt and its own decode parameters on every
        # request — `_SYSTEM_PROMPT` (services/sanitizer/llm_scan.py:2008) is
        # concatenated with the delimiter-wrapped chunk in `_seq_prompt`
        # (llm_scan.py:4550) / `_ENSEMBLE_PROMPT` (llm_scan.py:2044) and passed
        # as the `prompt` body field (llm_scan.py:1211), while
        # `OllamaBackend.generate` (llm_scan.py:1185, payload dict at
        # llm_scan.py:1209) sets `options.num_predict` (llm_scan.py:1221,
        # default `_L3_NUM_PREDICT` = 2200 at llm_scan.py:236) / `temperature`
        # / `num_ctx` / `seed` explicitly per call. A registry model ships its
        # own chat template, so the hand-written TEMPLATE block is no longer
        # needed, and the Modelfile's `PARAMETER num_predict 512` was already
        # being overridden by the per-request value.
        #
        # ⚑ CITATION BASIS (T-370 re-grep 2026-08-01): the line numbers above
        # are against dual-sandbox-architecture origin/main @ b9b6ccdbd. Every
        # one of them was STALE as first written on 2026-08-01 (the file has
        # grown ~600 lines since) — they move on each sanitizer merge, so
        # re-derive with `git grep` rather than trusting them.
        - name: model-pull
          image: "{{ .Values.ollamaIdentity.image.repository }}:{{ .Values.ollamaIdentity.image.tag }}{{ if .Values.ollamaIdentity.image.digest }}@{{ .Values.ollamaIdentity.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.ollamaIdentity.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          env:
            # The CLI is a thin client here: every command below is executed by
            # the ollama-identity server, including the registry download.
            - name: OLLAMA_HOST
              value: "ollama-identity:11434"
          command:
            - sh
            - -c
            - >-
              set -e;
              echo "Waiting for ollama-identity to accept requests...";
              i=0;
              until ollama list >/dev/null 2>&1; do
                i=$((i+1));
                if [ "$i" -ge 150 ]; then
                  echo "ollama-identity did not become reachable within 300s" >&2;
                  exit 1;
                fi;
                sleep 2;
              done;
              echo "Pulling {{ .Values.sanitizer.llmScanModel | default "qwen2.5:7b" | quote }} from the official registry over HTTPS...";
              ollama pull {{ .Values.sanitizer.llmScanModel | default "qwen2.5:7b" | quote }};
              echo "Model pull complete.";
              ollama list
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
{{- end }}
