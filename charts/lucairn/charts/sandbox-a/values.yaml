namespace: dsa-identity

# v1.0 ships single-replica sandbox-a. The pod runs a per-pod
# authRateLimiter (services/sandbox-a/internal/server/server.go:29 —
# `failures map[string][]time.Time`) that tracks failed auth attempts
# in-memory. With multi-replica sandbox-a behind a K8s Service:
#   1. A brute-forcer's 10-failure rate-limit becomes 10 × N pods.
#      Pod A counts 10, pod B counts 0 → brute-force rate-limit bypass
#      via Service round-robin load-balancing.
#   2. The sanitizer is wired as a SIDECAR in this same pod (see
#      templates/deployment.yaml `name: sanitizer` container at line
#      152). Scaling sandbox-a also scales the sanitizer; each sanitizer
#      instance holds its own canary-token signing state and per-request
#      caches. The gateway points at sandbox-a.dsa-identity.svc:8086
#      (see gateway/values.yaml:34) so multi-replica sanitizer is
#      reachable but untested for the sidecar topology — adding
#      multi-pod variance to a v1.0 demo lane is conservative-bad.
# Compose works because it runs ONE sandbox-a container with one
# sanitizer sidecar.
#
# Multi-replica sandbox-a is a v2.0 design (Redis-backed rate-limit
# counters + sanitizer as a standalone Deployment + sidecar removal).
# Until then, leave replicaCount=1 + hpa.enabled=false; the umbrella
# validator (validators.sandboxASingleReplica) fails-fast on any
# operator who flips either knob without the v2.0 backend ready.
#
# Vast cascade I sweep (fix-up #15, 2026-05-26): sandbox-a + bundled
# sanitizer sidecar share the veil-witness defect class — pod-local
# state cannot be safely split across replicas via standard K8s Service
# load-balancing.
replicaCount: 1

image:
  repository: dsa-sandbox-a
  tag: ""
  pullPolicy: IfNotPresent

service:
  grpcPort: 50053
  healthPort: 8083

auditServiceAddr: "audit.dsa-audit.svc:50051"
grpcTlsEnabled: "false"
veilEnabled: "true"
veilWitnessAddr: "veil-witness.dsa-witness.svc.cluster.local:50057"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# v1.0 ships HPA disabled — see replicaCount comment above. The
# authRateLimiter is pod-local; HPA scaling beyond 1 replica produces a
# brute-force rate-limit bypass.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilization: 70

pdb:
  # v1.0 single-replica lock: the PDB only renders at replicaCount >= 2
  # (the v2.0 multi-replica unlock). On a single-replica workload a PDB
  # with minAvailable: 1 makes `kubectl drain` hang forever, so v1.0
  # renders no PDB. When 2+ replicas run, maxUnavailable lets drain evict
  # one pod at a time. See templates/pdb.yaml.
  enabled: true
  maxUnavailable: 1

# Graceful shutdown / connection draining on rolling restart + node drain
# (HA-04). On pod termination the kubelet sends SIGTERM and removes the pod
# from Service endpoints CONCURRENTLY — without a drain delay, in-flight
# requests routed just before endpoint removal are dropped. The preStop
# sleep holds the container open while kube-proxy propagates the endpoint
# removal across nodes, then the process exits gracefully.
# terminationGracePeriodSeconds MUST exceed preStopSleepSeconds.
gracefulShutdown:
  # Seconds to sleep in preStop before SIGTERM, letting endpoint removal
  # propagate. 0 disables the preStop hook entirely.
  preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# T-350: the migration Job applies migrations up to a PINNED TARGET VERSION and
# never further. It does not run an open-ended `migrate up`.
#
# Why this exists: the Job's migration files come from the service IMAGE
# (`cp -r /migrations /shared/migrations`), not from this repository, so a bare
# `up` let whichever image tag happened to be pinned decide which tables a
# customer install creates — including migrations this kit release has never
# reviewed for personal-data retention impact. Full rationale (and the
# veil-witness 000011/000012 case that prompted it) is in
# charts/lucairn/templates/_migration-cap.tpl.
#
# targetVersion is a migration VERSION (as in `migrate goto N`), not a count.
# The Job reads the current schema version first and exits 0 without doing
# anything when the database is already at or beyond the target: it NEVER
# migrates down.
#
# 8 = 000008_add_org_id. The chart also carries a hard ceiling of 8
# (charts/sandbox-a/templates/migration-job.yaml); a targetVersion above it is
# refused at render time. Raising both is a deliberate code change gated by
# docs/RELEASING.md § "Migration review".
#
# unsafeAcknowledgeOpenEndedMigrateUp is the only escape hatch. true restores
# the pre-T-350 open-ended `migrate up` AND bypasses the ceiling.
migrations:
  targetVersion: 8
  unsafeAcknowledgeOpenEndedMigrateUp: false

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  storageSize: 10Gi
  storageClass: ""
  user: dsa
  database: sandbox_a

external:
  databaseUrl: ""

sanitizer:
  image:
    # Default repository follows the chart's `global.imageRegistry` prefix
    # (e.g. ghcr.io/declade) so this resolves to ghcr.io/declade/dsa-sanitizer.
    # Override per-environment if you mirror images.
    repository: dsa-sanitizer
    # Empty `tag` falls through to `.Values.global.imageTag` (0.5.1 today)
    # so the side-car stays in lockstep with the rest of the kit.
    tag: ""
    pullPolicy: IfNotPresent
  # Parity with Compose default-sanitizer.yaml (calibrated against the
  # 12-corpus domain bench). Override per environment if needed.
  confidenceThreshold: 0.35
  safePatterns: []
  # T-576 — EXTRA strict whole-span-exact never-redact terms, appended to the
  # ten shipped product-vocabulary terms rendered into
  # `sanitizer.redaction_policy.stop_terms` (surface: l1_strict). This is the
  # replacement for the retired `strict_safe_terms_file` ConfigMap/bind-mount:
  # the sanitizer refuses to boot on that key, so an operator's own strict
  # terms must arrive through this list instead.
  #
  # Semantics: a Presidio/spaCy detection is suppressed ONLY when the ENTIRE
  # detected span (lowercased + stripped) equals the term. "Claude" alone is
  # suppressed; "Claude Müller" still redacts.
  #
  # ⛔ NEVER put a real given name or surname here — that is an under-redaction
  # and would leak real identity data.
  strictSafeTerms: []
  llmAuditEnabled: false
  qiEngineEnabled: "true"
  qiEngineThreshold: "0.25"
  qiEngineAction: "generalize"
  llmScanEnabled: false
  llmScanTimeout: 30
  # T-472 — TOTAL wall-clock budget for ALL of one request's L3 inference,
  # rendered to `llm_scan.request_budget_seconds`. Distinct from
  # llmScanTimeout, which bounds a SINGLE L3 call: a request that makes 20 L3
  # calls of 29s each satisfies llmScanTimeout and still runs for ~580s.
  #
  # Default 90 is the sanitizer image's own shipped default
  # (services/sanitizer/config.py:1784, `request_budget_seconds: float = 90.0`),
  # so rendering it changes NOTHING about a stock install — it only makes the
  # knob reachable from Helm, which it was not before (zero chart references).
  #
  # ⚠️ Bound, enforced at sanitizer boot (config.py:2143): the value must be
  # <= GUNICORN_TIMEOUT - 25s. The headroom is not slack — after the last L3
  # call the worker still has to reassemble fields, run the remaining scanners
  # and EMIT THE SANITIZER CLAIM. A worker SIGKILLed inside that tail produces
  # a certificate with no dsa-sanitizer claim: content that WAS sanitized,
  # evidence that says it was not. Raise this and GUNICORN_TIMEOUT together.
  #
  # A non-finite or non-positive value fails the boot loudly — and the chart
  # passes such a value THROUGH rather than quietly substituting the default,
  # so an explicit 0 reaches the image and is rejected there with a real error
  # instead of booting a budget you never asked for.
  llmScanRequestBudgetSeconds: 90
  # T-375 — model PROVENANCE. This name is what the model-pull Job pulls from
  # the official Ollama registry over HTTPS AND what the sanitizer asks for in
  # sanitizer-configmap.yaml (`llm_scan.model`); the two MUST agree or every L3
  # call 404s. It replaces the custom `pii-scanner-v2.gguf` that was fetched
  # over plaintext HTTP from a hardcoded bare IP.
  #
  # qwen2.5:7b is the model this chart's sanitizer config already requested, so
  # this change moves the TRANSPORT and PROVENANCE, not the detection
  # behaviour.
  #
  # ⛔ DO NOT BUMP THIS VALUE WITHOUT THE PER-ARTIFACT RECALL GATE (T-370).
  #
  #   gemma4:31b requires the per-artifact recall gate (T-370 / PRD
  #   prd-2026-07-31-l3-rebuild-recoverable-truncation-gemma4.md Slice 3) to
  #   pass on YOUR runtime's artifact before flipping this value; the
  #   2026-07-31 validation covered the Ollama Q4_K_M lane at ceiling on a
  #   saturated corpus — it is not transferable.
  #
  # Quantization is part of the artifact: the Ollama Q4_K_M GGUF and a vLLM
  # AWQ / W4A16 / FP8 build of the same upstream weights are DIFFERENT
  # artifacts and recall does not carry across them. Nothing in this chart
  # enforces the gate — no validator, no doctor check. Read
  # docs/L3_MODEL_UPGRADE.md BEFORE changing this value: § 1 lists four
  # further kit-side blockers that make a naive bump a silent 100% L3 outage
  # (the pinned ollama image is too old both to run the model AND to honour
  # the reasoning-suppression field), and § 2 gives the storage / memory /
  # deadline sizing that a 20GB model needs.
  #
  # Air-gapped installs: point this at an internal mirror reference (e.g.
  # `registry.internal.example/library/qwen2.5:7b`) or pre-seed the
  # ollama-identity PVC and set `global.identityModelRegistryEgress: false`.
  llmScanModel: "qwen2.5:7b"
  # Hard wall-clock bound for the model-pull Job (review F4). The pull is
  # multi-GB; a stalled registry connection would otherwise leave the Job
  # Running forever. Generous by design — raise it on a slow link rather than
  # letting a real pull get killed.
  #
  # SIZED FOR THE SHIPPED MODEL. qwen2.5:7b is ~4.7 GB, so 3600 s covers any
  # link sustaining ~11.4 Mbit/s. The Job also spends up to 300 s of this same
  # budget waiting for ollama-identity to answer
  # (templates/ollama-identity-model-job.yaml:100-108), and the deadline bounds
  # the WHOLE Job across all `backoffLimit: 3` retries — a retry does not reset
  # the clock. A 20 GB model would need ~48.5 Mbit/s sustained to fit 3600 s;
  # raise this to 10800 alongside any large-model bump on a slower link. Full
  # table: docs/L3_MODEL_UPGRADE.md § 2.5.
  llmScanModelPullDeadlineSeconds: 3600
  # L3 fail-mode for the sanitizer — now `global.l3AvailabilityPosture`
  # (T-393). "reject" = fail-CLOSED (503 l3_scrubber_unavailable when the L3
  # deep PII shield is unavailable). "degrade" = continue on L1+L2. Wired into
  # the sanitizer container env as LUCAIRN_L3_AVAILABILITY_POSTURE, and ONLY
  # when the operator sets the key — otherwise the image's own default
  # ("degrade") applies.
  #
  # PAIR IT WITH llmScanEnabled (overnight follow-up 2026-06-15 — the Helm side
  # of #73's Compose fix): the L3 shield is the GPU `ollama-identity`
  # StatefulSet, which renders ONLY when sanitizer.llmScanEnabled=true
  # (ollama-identity-statefulset.yaml:1). With the stock default
  # llmScanEnabled=false, `reject` requires an L3 service that was never
  # deployed → the sanitizer /readyz fails liveness and the gateway fail-closes
  # 503 on EVERY request (the trap #73 fixed for Compose). Enterprise operators
  # who enable the L3 shield (sanitizer.llmScanEnabled=true, deploying the GPU
  # ollama-identity sidecar) set `global.l3AvailabilityPosture: reject`.
  #
  # NO PER-SUBCHART OVERRIDE (rehearsal fix 2026-06-19, still true): there is no
  # sanitizer.l3Required key and no sanitizer-level posture key. Availability is
  # a global. It no longer has to agree with anything on the witness — the
  # witness owns a DIFFERENT question (what the certificate claims, via
  # global.l3CompletenessPosture), and the two cannot contradict each other.
  # See charts/lucairn/values.yaml § L3 DEEP-PII-SHIELD POSTURES.
  # SEC-003 fix (2026-05-09): default "sequential" — Pro/Enterprise overlays
  # MUST explicitly set "ensemble" to opt into L3 reversal path.
  llmScanMode: "sequential"
  llmScanRestoreThreshold: 0.85
  # M12 fix (2026-06-23): gunicorn worker timeout. Compose sets 120 s
  # (docker-compose.customer.yml:511 GUNICORN_TIMEOUT: "120"); the Helm
  # chart previously omitted this, defaulting to gunicorn's built-in 30 s
  # and causing 503 on large prompts. Mirror the Compose default here.
  gunicornTimeout: 120

  # Phase 7 — ML PII scanners extracted into the pii-ml gRPC sidecar
  # (PR #240 production-path follow-up, "A3 Proper"). DEFAULT OFF here.
  #
  # As of chart v1.7.1 (2026-06-10) Phase 7 ML is SUSPENDED by default at
  # BOTH gates for performance (the ML sidecar overloads on large prompts).
  # The deterministic layers (known_entity_matching + Presidio L1/L2) remain
  # active. See INSTALL.md § "Re-enabling Phase 7".
  #
  # Operators re-enable Phase 7 by flipping BOTH:
  #   1. Umbrella `pii-ml.enabled: true` (deploys the sidecar) — DEFAULT OFF
  #      as of v1.7.1
  #   2. The piiranha/gliner enabled flags below (sanitizer dials the sidecar)
  #
  # Closes DRIFT-001 from PR #241 contract-drift r1: in-tree
  # config/default-sanitizer.yaml grew these sections at PR #240 ship time;
  # the Helm-rendered ConfigMap fell behind. Adding them here + in
  # sanitizer-configmap.yaml restores chart ↔ in-tree parity.
  piiranha:
    enabled: false
    grpcDeadlineSeconds: 5
  gliner:
    enabled: false
    grpcDeadlineSeconds: 5
    skipMinTextLen: 32
    skipMaxEntityDensity: 0.30
  kAnonymity:
    enabled: false
    k: 5
  piiMlClient:
    # Empty (default) resolves to pii-ml.<namespace>.svc.cluster.local:50056
    # in the sanitizer-configmap.yaml template. Override only if pii-ml is
    # deployed to a non-default namespace OR an external endpoint.
    endpoint: ""
    # T-64 (2026-07-27; behavior narrowed 2026-07-30 after review) — HONESTY
    # DECLARATION, not a behavior change today.
    #
    # ✅ NO UPGRADE ACTION REQUIRED. Every existing install — including one
    # that already overrides `endpoint` above (e.g. a cross-namespace
    # in-cluster pii-ml Service, which the `endpoint` doc directly above
    # calls a normal supported override) — renders exactly as it did before
    # this key existed. Nothing here can fail a `helm upgrade` that used to
    # succeed.
    #
    # LEAVE THIS EMPTY unless you know the topology of a NON-STOCK
    # `endpoint`. Empty means "derive from the endpoint", with three cases:
    #
    #   1. `endpoint` resolves to the stock in-cluster default — either
    #      because you left it empty, OR because you explicitly wrote it to
    #      the exact stock value `pii-ml.<namespace>.svc.cluster.local:50056`
    #      (writing the stock address explicitly doesn't move the dial
    #      target, so it is treated the same as leaving it empty) — the
    #      chart auto-declares "in_box_plaintext". That's the one case where
    #      "in-box" is true by construction.
    #
    #   2. You set this key explicitly to "tailnet" or "in_box_plaintext" —
    #      the chart emits your declaration verbatim. Set it at this
    #      subchart-local path (`sanitizer.piiMlClient.transport`) or, if
    #      you set values from the top-level umbrella chart, at the umbrella
    #      path `sandbox-a.sanitizer.piiMlClient.transport` (that's the one
    #      that takes effect for a `helm upgrade --set` on the umbrella
    #      release).
    #
    #   3. `endpoint` resolves to something ELSE and this key is empty — the
    #      chart emits NO `LUCAIRN_PII_ML_TRANSPORT` env var at all and
    #      leaves a comment in the rendered manifest saying so. It will not
    #      GUESS a transport from address shape; that is exactly the unsound
    #      pattern the DSA side deleted
    #      (`services/sanitizer/pii_ml_client.py`, `is_local_endpoint()`
    #      removed). An undeclared hop is byte-identical to every kit
    #      release shipped so far, so this is a no-op, not a failure. Set
    #      this key if you want the hop declared.
    #
    # ONE render-time rejection exists, and it can only trip on a value that
    # did not exist before this change: setting `transport: "tailnet"` while
    # `endpoint` resolves to the STOCK in-cluster Service is a
    # self-contradiction (the chart itself renders that address as an in-box
    # *.svc.cluster.local hop), so it is refused rather than emitted as a
    # false declaration. Fix it by pointing `endpoint` at the real off-box
    # address, or by declaring "in_box_plaintext".
    #
    # This key is currently INERT either way: main's sanitizer
    # config.py/pii_ml_client.py (as of this PR) has no declared-transport
    # vocabulary and never reads LUCAIRN_PII_ML_TRANSPORT — only the
    # not-yet-merged feat/gliner-remote-fallback branch introduces that read
    # (env-var fallback when no `transport` key is present in the rendered
    # pii_ml_client config block). The kit ships no tailnet transport at all
    # today (no config surface, no docs, no code path), so for every stock
    # install this resolves to "in_box_plaintext" automatically.
    transport: ""
    # Per-scan gRPC deadline (seconds). Sanitizer's config.py reads this as
    # the flat `deadline_seconds` field on `pii_ml_client`; missing → 5.0.
    deadlineSeconds: 5
    # Sanitizer's pii-ml client circuit breaker. Tuned in camelCase here;
    # the configmap template flattens to the in-tree-canonical flat fields
    # `circuit_breaker_open_after` + `circuit_breaker_half_open_seconds`
    # (sanitizer's config.py:595-606 reads ONLY the flat names).
    circuitBreaker:
      consecutiveFailures: 3
      halfOpenSeconds: 30

# Sanitizer content-address cache — dedicated Redis for the sanitizer
# content-addressed redaction cache. See INSTALL.md § "Sanitizer content
# cache (Redis — default ON)" for the operator runbook and
# disable/external-Redis instructions.
# Isolated from redis-sanitizer (DP-budget keys, db 0) so allkeys-lru
# eviction under cache pressure NEVER touches the DP-budget accounting.
# Default ON — mirrors the docker-compose.customer.yml default.
# Set sanitizerCache.enabled=false to fall back to the sanitizer's
# per-worker in-process LRU cache (same fallback the sanitizer app.py
# uses when Redis is unreachable — fail-OPEN, not a 500).
sanitizerCache:
  enabled: true
  # Redis image — must match the redis-sanitizer-cache image in docker-compose.yml.
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  # 512MB allkeys-lru — isolated from DP-budget redis (64MB). Mirrors
  # docker-compose.yml redis-sanitizer-cache definition.
  maxmemory: "512mb"
  maxmemoryPolicy: "allkeys-lru"
  # PVC for persistence (optional but keeps cache warm across pod restarts).
  storageSize: 1Gi
  storageClass: ""
  # Sanitizer cache env knobs wired into the sanitizer sidecar container.
  # The sanitizer reads SANITIZER_CACHE_REDIS_URL when SANITIZER_CACHE_BACKEND=redis.
  # SANITIZER_CACHE_BACKEND defaults to "redis" so the sidecar picks up the
  # bundled redis-sanitizer-cache by default. Set to "memory" to disable.
  backend: "redis"
  # DB 0 on the SEPARATE redis-sanitizer-cache service (never shares DB with
  # DP-budget keys on redis-sanitizer:6379/0).
  redisUrl: ""  # auto-derived from service name when empty; override for external Redis
  ttlSeconds: 3600

# Streaming chunk-aware state backend (TMS Slice 3 / DSA PR #267).
# Fixes the cross-worker FAIL-CLOSED bug (kit issue #68): gunicorn routes
# each SSE chunk of one streaming response to an ARBITRARY worker; with the
# per-worker in-process store (~88% of chunks landed on the wrong worker on
# the Hetzner pilot and triggered alignment-bail fail-closed immediately).
# Option B moves per-stream state to the SAME redis-sanitizer-cache Redis so
# any worker rehydrates the full PlaceholderRegistry + tail-buffer.
#
# stream-state keys (tms:stream:* / tms:streamlock:* / tms:streammut:*)
# share DB 0 on redis-sanitizer-cache with the content-cache keys
# (tms:cache:*). They never collide (distinct prefixes) and never touch the
# DP-budget namespace (redis-sanitizer:6379/0, a SEPARATE StatefulSet).
#
# CONSTRAINT: mutationMarkerTtlSeconds MUST be strictly greater than
# ttlSeconds. Default (unset) = max(2×ttlSeconds, ttlSeconds+60). If you
# set mutationMarkerTtlSeconds explicitly and it is ≤ ttlSeconds, the
# sanitizer clamps it up to ttlSeconds+60 at boot. Raise ttlSeconds only
# if your streams routinely exceed 5 minutes; raise mutationMarkerTtlSeconds
# proportionally (minimum ttlSeconds + 60).
sanitizerStreamState:
  # "redis" (default) — shared Redis, closes cross-worker FAIL-CLOSED.
  # "memory" — per-worker in-process store (pre-Slice-3 fallback; causes
  #            ~88% streaming FAIL-CLOSED under gunicorn; use only as a
  #            temporary revert if the shared Redis is unavailable).
  backend: "redis"
  # Redis URL for stream-state keys. Points at the SAME redis-sanitizer-cache
  # StatefulSet as sanitizerCache.redisUrl (DB 0, distinct key prefix).
  # Auto-derived from the bundled service name when empty; override only if
  # you use an external Redis (set sanitizerCache.enabled=false too).
  redisUrl: ""  # auto-derived from service name when empty; must match sanitizerCache.redisUrl
  # Per-stream state key TTL (seconds). Set >= longest expected streaming
  # response. Streams not closed within this window are evicted; a new chunk
  # after eviction starts fresh state (alignment-bail risk on very long streams).
  ttlSeconds: 300
  # Cert-integrity mutation-marker TTL (seconds). The marker outlives the
  # stream state so the gateway can detect mid-stream fresh-state resets that
  # would produce a cert with renumbered placeholders (a cert-integrity
  # violation). MUST be strictly > ttlSeconds. Default (unset) = max(2×ttlSeconds,
  # ttlSeconds+60); if you set it ≤ ttlSeconds the sanitizer clamps it up to
  # ttlSeconds+60 at boot.
  mutationMarkerTtlSeconds: 600

# ollama-identity is the L3 PII-plane LLM runtime (the on-GPU PII Shield).
# It only renders when sanitizer.llmScanEnabled=true. Images are pinned by
# released tag + sha256 digest (NET-02 supply-chain hardening) so the
# PII-plane runtime cannot silently float to a mutable `:latest`. Override
# repository/tag/digest per environment if you mirror images into a private
# registry. The model-pull Job reuses this same pinned image as a thin CLI
# client; the pinned curl image it used to need is gone with the GGUF download
# (T-375).
ollamaIdentity:
  image:
    repository: ollama/ollama
    tag: "0.6.2"
    # sha256 digest for ollama/ollama:0.6.2 (linux multi-arch index). When set,
    # the image ref renders as repository:tag@sha256:... so the pull is
    # digest-verified. Leave empty to pin by tag only.
    digest: "sha256:74a0929e1e082a09e4fdeef8594b8f4537f661366a04080e600c90ea9f712721"
    pullPolicy: IfNotPresent
    # ⛔ VERSION FLOOR FOR ANY LARGE-MODEL BUMP (T-370). 0.6.2 predates BOTH
    # Gemma-4 model support (landed in ollama 0.22.0, April 2026) AND the
    # top-level `think` request field the sanitizer uses to suppress reasoning.
    # The second is the dangerous one: ollama's server is Go, encoding/json
    # SILENTLY DROPS unknown request fields, so an old build returns 200 while
    # the model keeps reasoning — a thinking model then returns EMPTY content,
    # the sanitizer's verdict decoder refuses to read that as "no PII found",
    # and L3 fail-closes on 100% of calls with nothing pointing at this pin.
    # Bumping sanitizer.llmScanModel to a thinking model REQUIRES bumping this
    # image (tag AND digest here, the compose default, and image-manifest.yaml
    # pii_plane.ollama-identity) first. See docs/L3_MODEL_UPGRADE.md § 1 B1.
  # Persistent model store for the L3 shield, mounted at /root/.ollama.
  #
  # DEFAULT UNCHANGED: 10Gi is exactly what this chart has always rendered for
  # the volumeClaimTemplates entry; exposing it as a value changes no install.
  # It exists because the size was previously hardcoded, which made a larger L3
  # model unreachable from values alone.
  #
  # SIZING: qwen2.5:7b (~4.4 GiB) fits 10Gi. A 20 GB model does NOT — and a
  # model CHANGE needs room for BOTH blobs at once, because `ollama pull` adds
  # and nothing evicts (the old blob is also the fast rollback path). Guidance
  # for a 20 GB model is 40Gi. ⚠️ volumeClaimTemplates is IMMUTABLE on an
  # existing StatefulSet — changing this on a live install renders a spec
  # Kubernetes rejects, so size it at INSTALL time or follow the
  # orphan-delete/PVC-expand procedure in docs/L3_MODEL_UPGRADE.md § 2.1.
  persistence:
    size: 10Gi
  # FAIL-01 demo warmth (PRD prd-2026-05-29-fail-safe-scrubber, §6): keep the
  # L3 scan model resident so the new fail-CLOSED block can never fire from a
  # cold-start hiccup mid-demo. "-1" pins loaded models indefinitely; set a
  # Go duration (e.g. "30m") to expire idle models, or "0" to unload
  # immediately after each request (NOT recommended when the L3 shield is
  # required — risks readyz flapping).
  keepAlive: "-1"
  # FIX-A (full-stack-test-results-2026-05-29): L3 PII shield (qwen2.5:7b)
  # resource envelope, exposed as a chart value. The default 10Gi limit fits
  # the qwen2.5:7b model resident; lower it only if you mirror a smaller L3
  # model. (The OOMKill BLOCKER from the full-stack test was on sandbox-b's
  # bundled ollama at 2Gi, fixed in that subchart too.)
  #
  # ⚠️ THIS CHART REQUESTS NO GPU (T-370). There is no `nvidia.com/gpu`
  # resource and no runtimeClassName anywhere under charts/lucairn/charts/
  # sandbox-a/, so on a stock cluster ollama-identity runs CPU-only and the
  # model's weights are resident in HOST RAM, not VRAM. That is survivable for
  # a ~4.4 GiB model under this 10Gi limit and is NOT survivable for a ~18.6
  # GiB one: the container is OOMKilled during load, `ollama list` stops
  # answering, the readiness probe fails, and with
  # global.l3AvailabilityPosture=reject the
  # gateway fail-closes on every request. A large-model bump needs GPU
  # scheduling added to this chart, or a CPU-sized limit above the resident
  # model size. The kit has NO measured host-RAM figure for a 31B-class model
  # on either path — measure it under load as part of the T-370 gate rather
  # than copying a number. docs/L3_MODEL_UPGRADE.md § 2.2-2.3.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 10Gi

secrets:
  backend: k8s-native
  values:
    # REQUIRED when postgresql.enabled — ships EMPTY on purpose (T-10). There
    # is no working default: templates/_validate.tpl hard-fails the render when
    # this is empty or is still a CHANGE-ME…-shaped placeholder, at every
    # global.dsaEnv.
    #   --set "sandbox-a.secrets.values.postgresPassword=$(openssl rand -base64 24)"
    # Or leave empty and set sandbox-a.secrets.backend to vault | aws | azure.
    postgresPassword: ""
    encryptionKey: ""
    adminKey: ""
    veilSigningKey: ""
    dsaServiceToken: ""  # PRODUCTION: set via existingSecret or --set; dev: inline value
    # PRODUCTION: must be set to a ≥32-char unique random secret. Sanitizer
    # canary-token detector uses it to sign canary tokens; without it, leaked
    # canary tokens cannot be authenticated as ours and silently disable the
    # detector (mirrors Compose-path CANARY_HMAC_KEY :? enforcement).
    canaryHmacKey: ""
  vault:
    path: "sandbox-a"
  aws:
    name: "dsa/sandbox-a"
  azure:
    name: "dsa-sandbox-a"
