{{- if ne .Values.secrets.backend "k8s-native" }}
{{- $backend := .Values.secrets.backend -}}
{{- $key := "" -}}
{{- if eq $backend "vault" }}{{- $key = .Values.secrets.vault.path -}}
{{- else if eq $backend "aws" }}{{- $key = .Values.secrets.aws.name -}}
{{- else if eq $backend "azure" }}{{- $key = .Values.secrets.azure.name -}}
{{- end }}
# The five properties the runner's secret files come from. `gatewayKey` and
# `approverSecret` are optional for the runner but must exist in the store
# (an empty string switches the feature off).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dsa
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dsa-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Chart.Name }}-credentials
  data:
    {{- range $file, $property := (dict "tool_runner_servicenow_username" "servicenowUsername" "tool_runner_servicenow_password" "servicenowPassword" "tool_runner_signing_key" "signingKey" "tool_runner_gateway_key" "gatewayKey" "tool_runner_approver_secret" "approverSecret") }}
    - secretKey: {{ $file }}
      remoteRef:
        key: {{ $key }}
        property: {{ $property }}
    {{- end }}
{{- end }}
