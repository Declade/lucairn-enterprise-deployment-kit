{{- if eq .Values.secrets.backend "k8s-native" }}
# Mounted as FILES under /run/secrets in the runner container. Never envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dsa
type: Opaque
stringData:
  tool_runner_servicenow_username: {{ .Values.secrets.values.servicenowUsername | quote }}
  tool_runner_servicenow_password: {{ .Values.secrets.values.servicenowPassword | quote }}
  tool_runner_signing_key: {{ .Values.secrets.values.signingKey | trim | quote }}
  tool_runner_gateway_key: {{ default "" .Values.secrets.values.gatewayKey | quote }}
  tool_runner_approver_secret: {{ default "" .Values.secrets.values.approverSecret | quote }}
{{- end }}
